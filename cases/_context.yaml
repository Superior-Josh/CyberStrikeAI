---
execution_instructions: |-
  执行主体是 CyberStrikeAI 项目中的 AI。用户仅提供授权、账号、禁止动作和必要业务事实，不负责运行脚本、导出原文或填写结果。角色与辅助工具完成重写和加载后，再由项目 AI 按本流程调用。
  本轮开始时项目 AI 调用重写后的 banma_pentest_run_cases 的 mode=init，再调用 mode=list；每项调用 mode=show 并复用同一 run_dir、raw_dir 和配置路径，不为每个用例重新初始化目录；完整读取共同要求、所属分组要求和本项 YAML，不能仅凭名称或摘要执行。
  实际测试通过 tools/ 下现有、已启用且 schema 已核对的工具调用。http-framework-test 用于 HTTP；扫描器按覆盖选择；execute-python-script 用于真实本地解析、受控采集、已有浏览器及协议交互；exec 仅用于获准读取、现有命令帮助和输出整理。
  每个编号步骤中的获取、提交、访问、复核、恢复和保存均由项目 AI 调用项目工具完成；解释和判定由项目 AI 对照实际观察完成。用户确认业务事实不算工具原文。
  执行前给请求、响应、扫描输出、浏览器或协议观察安排本次目录下的唯一文件名，并与用例编号、子项及实际调用对应；保存原文参数按工具当前 schema/帮助选择，不臆造 output 等参数。
  工具生成的文件与平台返回的完整输出文件路径可作为原文来源；路径须能被本机保存工具实际读取。执行 ID 本身不是文件，也不是自动导出承诺；先调用现有 get_tool_execution/wait_tool_execution 确认完成及真实来源，不能将截断预览或 AI 复述改写成原文。
  每项最后由项目 AI 调用待重写指导工具 save 提交适用子项、实际步骤、观察、真实引用、三态判断、覆盖及恢复结果；核对保存成功和返回路径后才标记本项已保存。保存失败先修正，不自动记为目标中断。
  当前 YAML 是未来调用的指导定义，不表示两个辅助工具已实现。没有可用保存/完整证据取得链时保留待修正资料并说明缺口，不假称落盘完成，也不要求人类手工接管。
common_requirements: |-
  执行前项目 AI 在当前对话列出必测子项、条件项是否纳入的事实依据、对应 YAML 字段与步骤编号、目标入口、方法、基线来源、请求/并发上限、样本数、窗口及停止条件；后续结果关联同一范围。不能只把一个编号步骤当成一个安全控制，复合步骤中的必要行为须逐项核对。
  基线先取用户已有授权信息，再通过现有工具读取获准资料或核对适用协议/标准；仅缺少必须由用户提供的业务事实/授权时询问。AI 不猜测额度、角色共享、密码参数或允许目的地，不把当前行为自行当预期策略。
  只有实际功能、既定范围及授权决定条件项是否纳入。已纳入必要项缺账号、授权、依赖、浏览器、协议客户端或证据时记录缺口，不能改称条件未触发；缺关键目标功能且未确认失败时按本项记中断，不批量跳过或事后缩小范围求通过。
  每个必要子项要有真实正常对照、实际操作、实际观察、期望结果对应理由和来源引用；工具操作成功不等于控制有效。HTTP 状态码、空响应、无告警、单次延时或无回连均不能单独决定结果。
  steps 中的执行准备、判定与保存是组织流程，不是目标安全控制子项，不能替代 required 中的必要验证，也不能以保存成功作为通过依据。
  多个工具可按功能选择首选/替代/辅助；替代的是采集方式，不是验证目标。任何替代证据都要对应真实输入、实际处理路径、适用角色及结果；静态关键词、库名称、反射回显或模型推断不能替代本项要求的实际执行或状态观察。
  动态行为由项目 AI 通过已有浏览器/协议运行能力取得日志、网络记录、状态或无害标记执行证据，操作和输出由工具产生；没有所需能力不交由人类点击，不安装依赖或新增工具/引擎补齐本轮测试。内部算法、目录权限、沙箱/白名单只在有真实实现资料时声称验证。
  带外先验证获准通道，正向探测与目标请求使用不同唯一标记，记录时间、观察窗口和结果；解析、连接、读取及命令执行分别判读。一次无记录不能证明控制有效。
  写入须有授权、专用可恢复对象、原值及恢复方法；停止/恢复通过实际工具调用完成并读取状态。恢复未完成或未确认时保留遗留说明，不伪造恢复成功，不擅自重启或修复目标。
  项目 AI 对照每项 expected_results 判定：任一必要子项已证实失败则整项失败，其他未完成部分写覆盖限制；未证实失败且全部必要项完成、有充分真实证据并符合期望才通过；其余已开始但必要条件/证据不足的项中断。未开始项在草稿写未执行，不补默认结果。
  工具调用、正常业务或客户端故障先修正并重试；不能在未知执行状态下重发有副作用请求。仍无法建立必要验证前提且未证实失败时按实际原因中断；参数、文件引用或保存错误仍是需要修正的项目问题，不归因目标。
  minimum_evidence 列出本项所需证据内容，不是已存在文件的承诺。项目 AI 必须安排并取得实际输出文件/获准导出，记录来源及本项关联；输入事实、原文、观察和解释分开，摘要不含明文密码、完整 Cookie/Token。原文无法取得时不得保存虚构文件或用模板文本冒充。
  判定与保存是两个动作：安全结论依据实测，保存接口负责检查与落盘。文件可读/非空或保存成功不证明来源真实性和安全性；结果统计由已保存有效结果产生，草稿缺口不能被当作完成。
  达成既定样本/窗口或出现停止条件后结束本项，不无限补测；用户取消立即停止测试，不自行续跑。
account_requirements:
  - |-
    凭据可选：用户未提供账密、Token 或 Cookie 时，先执行本轮获准且可执行的已有匿名用例，复用其中实际取得的凭据，不因输入为空立即中断认证用例；
    凭据准备流程结束后仍未取得有效身份时，再逐认证用例核对必要条件并记录中断（条件缺失）；凭据候选、正常登录、实际身份和权限是不同事实，不能把发现候选当作已认证；
    水平越权需要资源归属明确的独立账号，垂直越权需要可靠高权限正常对照，其他用例按各子项所需账号、角色、功能及协议判断；
    缺少必要条件时记录中断（条件缺失），保留已验证观察，不将无法建立对照的请求记为通过。
  - |-
    获取凭证的使用边界：获取的账号仅用于本授权测试验证；
    非专用账号（爆破/泄露所得）只做只读与最小验证；
    涉及写入的用例（如 PT_WEB_AUTH_09/14/18）必须使用专用测试账号，否则记「中断（条件缺失）」；
    写入类用例必须可回滚并登记改动台账。
groups:
  anonymous:
    name: 匿名
    requirements: |-
      匿名（18 条，PT_WEB_01–PT_WEB_18）：目标探测在未登录/匿名会话下执行，请求不携带认证凭证，匿名会话 Cookie 按实际流程使用；
      仅按各匿名用例原有步骤及授权进行账号准备、正常登录对照或候选凭据确认；不为认证准备额外增加注册、口令猜测、爆破或其他凭据获取步骤，已执行尝试与本轮上限共享；认证后的资源访问归认证用例；
      本组结论只覆盖匿名暴露面或登录接口本身，不包括认证后客户端存储、敏感接口和跨域读取。
  authenticated:
    name: 认证
    requirements: |-
      认证（26 条，PT_WEB_AUTH_01–PT_WEB_AUTH_26）：项目 AI 优先验证并复用用户提供的凭据；账密按实际登录流程取得会话，Token/Cookie 按真实携带位置直接验证身份和受保护资源，不强制重新登录，也不从 Token 解码或单次 HTTP 200 推断有效；
      未提供凭据或现有凭据无效时，自主获取只复用本轮已有匿名用例的真实结果：PT_WEB_01 的获准登录口令尝试、PT_WEB_15 的默认凭据检查，以及 PT_WEB_02/PT_WEB_14 实际发现的泄露凭据；原用例已获准且明确执行的账号准备产物也可复用。不得为获取凭据新增用例、独立注册流程、额外弱口令字典、爆破、其他获取行为或突破原请求上限；
      每条自主获取凭据保留原匿名用例编号、实际操作及证据来源。候选只在原匿名用例已有确认步骤或认证用例已有正常认证/身份对照步骤中验证，不另加独立探测、字典或重复候选尝试；已有停止条件和口令上限继续有效，已停止或已完成的匿名用例不为认证准备重复执行。未验证候选不当作有效身份，现有步骤内无法验证成功时按实际缺口中断；
      使用已取得的有效凭据完成正常认证、必要会话刷新和认证用例的权限对照属于凭据使用，不得借此追加凭据获取尝试。记录来源、实际身份、权限级别及会话引用，不保存明文凭据到报告或证据摘要；缺失/篡改凭据、登录前与登出后请求按用例明确条件构造；
      判定口径为「认证态下的权限、输入与业务逻辑防护是否有效」。
      项目 AI 自行调用现有工具完成上述验证与使用，逐用例核对账号数量、角色、资源归属、CSRF 及所需功能；一个有效账号不代表满足全部认证用例，不能为凑齐条件额外创建账号。用户只提供必要事实，不手工执行登录或导出会话。
