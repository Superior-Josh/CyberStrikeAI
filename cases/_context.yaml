login_budget:
  max_attempts: 30
  window_seconds: 60
result_contract:
  version: 4
  interruption_kinds:
    - 环境问题
  not_applicable_result: 通过
verification_contract:
  platform_provenance_required: true
  judgment_review_required: false
  report_check_required: true
execution_instructions: 代码调度器按execution_order遍历冻结授权清单，读取每项完整原文，执行稳定步骤并绑定本轮实际工具记录。代码难以覆盖的发现、业务操作或语义判断交给Eino处理该项缺口；Eino交回观察、结果理由和未覆盖部分，不管理整轮任务或自行保存。重复请求、窗口、共享预算、会话隔离、授权检查和恢复由代码控制。结果和报告经辅助接口保存；缺口继续其他可执行项，取消立即停止。
common_requirements: '本轮采用本机DVWA靶机判定口径。唯一判定来源是本目录各用例及本共同要求；本项steps中的默认安全基线直接适用，不再将用户另行提供业务/部署策略作为统一前置条件。真实入口、账号角色、字段、阈值和资源归属由项目AI调用工具发现，实际行为不能自行当作允许策略。已有明确用户规则优先且记录出处，不篡改本轮规则迎合结果。

  仅工具缺失、不可用依赖、浏览器/协议执行能力等实际执行环境问题，经修正或等效工具重试仍阻止验证且未证实失败时中断，interruption_kind填写环境问题，并引用实际尝试、错误原文及补救。缺文档、缺可选凭据、目标未使用可选功能、首次取证不足不是批量中断理由；先发现、复用现有匿名产物或补采。仍未知不得凭空通过/失败，必须明确真正阻塞，未开始项保持未执行。

  适用性核查本身是每项必须完成的实际测试。对可选攻击面，完整核查同源页面/表单/脚本/网络、候选端点和正常/随机不存在路径；通过实际授权网络请求补充核查。确认没有适用入口/未使用机制可判通过并注明攻击面不适用，只表示在核查范围未暴露该攻击面，不表示机制防护经测试有效。不以单次404、无告警、一般指纹或已知DVWA功能表代替核查。TLS明文认证、默认凭据、危险泄露等必需安全控制不能当作可选机制不存在来通过。

  本机靶机无禁止动作的授权覆盖完成用例所需的有限无害可恢复写入；优先选现有专用测试账号与对象、记录原值和恢复办法，实际恢复并核对。保留用户明确只读/其他禁止动作，冲突部分不执行且报告未覆盖，不强行套用此口径。禁止无关破坏、重置数据库、改变安全等级或自行重启修复目标；不得为凭据准备新增独立注册/爆破行为。

  用户给出的ip:port是默认网络范围，只测该端口，不扩展宿主其他端口、主机、外域或带外服务。不得通过本机访问或漏洞利用读取靶机源码、配置及内部资料，不使用旧轮白盒资料替代本轮黑盒原文，不导出数据库真实口令哈希、密码或密钥到报告。

  每项执行前列出实际资源、必要子项、条件适用依据、基线引用、方法、请求预算、样本数与停止条件；已选注入方法至少两组交替正常/变体，结束复核正常业务。不同工具替代采集方法而非验证目标。动态安全行为缺浏览器运行能力属于环境问题，静态回显不能代替脚本执行证明。

  任一必要子项已实测证实失败则整项失败并保留其他限制；否则完成所有适用安全验证或有证据的攻击面不适用核查才通过。操作成功、HTTP状态、scanner无告警、一次延时或无回连均不能单独支撑通过。观察与解释分开，只说明实际效果，不猜内部防护算法。

  scope_items至少有一个must_complete=true：不存在入口时将攻击面核查纳入并关联completed操作、观察与目标原文；不把所有子项设为未纳入，也不把已证实失败隐藏为条件未触发。明确已开始/已执行/已保存/报告状态，文件哈希正确不是判定正确。

  minimum_evidence所需内容由真实工具采集，保留实际输入、正常/变体响应、来源及子项关联；输入事实仅引用test_info具体字段。不得编造原文、批量转换旧结论或手工修改结果绕过save；变更判定口径使用新报告目录，保留旧记录。

  黑盒范围内继续完成可验证子项；内部组件完整清单、密码算法/加盐等必要资料无法从授权网络观察取得时，明确记录授权边界和未覆盖部分，不尝试越界读取，不将授权限制记为环境故障或将未知判通过。已有确证失败按失败优先保存并列其他缺口；无失败且无法形成完整整项结果时保留本次真实工具原文与未完成状态，继续其他获准用例，最终报告列资料缺口并保持草稿，不为凑齐清单伪造整项结果。

  达成样本或停止条件即结束，不无限扩大测试；出现锁定/挑战/429停止口令提交；用户取消立即停止，不自行恢复。报告和摘要无明文密码、完整Cookie/Token，原始敏感文件权限受限。'
account_requirements:
  - 凭据可选。优先验证用户提供的真实凭据；未提供时先完成已有匿名用例，只复用其实际取得的凭据及原文。候选、正常登录和真实权限分别核对；不得新增独立注册、额外弱口令字典或凭据获取行为。无法取得有效身份先核对实际登录流程及本轮已获准的网络观察，只有确实环境阻塞才中断，不能从输入为空批量生成认证中断。
  - 独立身份、角色及资源归属从实际目标的授权网络响应及账号正常操作对照取得，不猜测归属。两个账号不足不能直接宣称没有水平越权；先核查是否存在私人对象/分级权限，确实没有适用攻击面按有证据的不适用通过。真实账号/身份条件被环境阻塞则引用尝试说明中断。有限写入用专用可恢复对象并保存恢复证据，非专用账号只读最小验证。
groups:
  anonymous:
    name: 匿名
    requirements: '匿名（18 条，PT_WEB_01–PT_WEB_18）：目标探测在未登录/匿名会话下执行，请求不携带认证凭证，匿名会话 Cookie 按实际流程使用；

      仅按各匿名用例原有步骤及授权进行账号准备、正常登录对照或候选凭据确认；不为认证准备额外增加注册、口令猜测、爆破或其他凭据获取步骤，已执行尝试与本轮上限共享；认证后的资源访问归认证用例；

      本组结论只覆盖匿名暴露面或登录接口本身，不包括认证后客户端存储、敏感接口和跨域读取。'
  authenticated:
    name: 认证
    requirements: '认证（26 条，PT_WEB_AUTH_01–PT_WEB_AUTH_26）：项目 AI 优先验证并复用用户提供的凭据；账密按实际登录流程取得会话，Token/Cookie 按真实携带位置直接验证身份和受保护资源，不强制重新登录，也不从 Token
      解码或单次 HTTP 200 推断有效；

      未提供凭据或现有凭据无效时，自主获取只复用本轮已有匿名用例的真实结果：PT_WEB_01 的获准登录口令尝试、PT_WEB_15 的默认凭据检查，以及 PT_WEB_02/PT_WEB_14 实际发现的泄露凭据；原用例已获准且明确执行的账号准备产物也可复用。不得为获取凭据新增用例、独立注册流程、额外弱口令字典、爆破、其他获取行为或突破原请求上限；

      每条自主获取凭据保留原匿名用例编号、实际操作及证据来源。候选只在原匿名用例已有确认步骤或认证用例已有正常认证/身份对照步骤中验证，不另加独立探测、字典或重复候选尝试；已有停止条件和口令上限继续有效，已停止或已完成的匿名用例不为认证准备重复执行。未验证候选不当作有效身份，现有步骤内无法验证成功时先修正认证流程或核查实际登录网络流程，实际环境阻塞才中断；

      使用已取得的有效凭据完成正常认证、必要会话刷新和认证用例的权限对照属于凭据使用，不得借此追加凭据获取尝试。记录来源、实际身份、权限级别及会话引用，不保存明文凭据到报告或证据摘要；缺失/篡改凭据、登录前与登出后请求按用例明确条件构造；

      判定口径为「认证态下的权限、输入与业务逻辑防护是否有效」。

      项目 AI 自行调用现有工具完成上述验证与使用，逐用例核对账号数量、角色、资源归属、CSRF 及所需功能；一个有效账号不代表满足全部认证用例，不能为凑齐条件额外创建账号。用户只提供目标、可选凭据和授权，项目AI从目标获取其他事实，不要求人类手工登录或导出会话。'
