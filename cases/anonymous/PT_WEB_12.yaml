---
category: 基础设施
id: PT_WEB_12
name: TLS 与传输安全配置
description: 用 nmap、execute-python-script 的 ssl 能力与 http-framework-test 检查授权 TLS 服务、证书和明文入口。
level: 高
group: anonymous
required: 目标范围与攻击面实际核查；存在适用入口时完成：约定 TLS 服务的协议、套件、证书及明文入口
conditional: （本共同要求优先：可选机制不存在时完成攻击面核查并停止以下仅适用分支；此后的策略/规则取本项默认基线和实际实现，不向用户索要未必存在的文档）HSTS 按业务适用基线检查；页面资源仅覆盖约定匿名链路，不扩展认证后流量
steps:
  - 执行准备：项目 AI 完整读取 PT_WEB_12 与共同/分组要求，在当前对话列出必测子项和触发依据；核对授权、正常对照、实际工具 schema 与原文输出方式，复用指导工具返回的本次目录，不要求用户运行命令或填写结果
  - 默认安全基线：认证/敏感服务须提供可信TLS1.2或1.3，不允许明文接收认证秘密；明文登录表单及实际明文登录即失败，不因未开TLS端口中断。执行：只核对授权端口的HTTP/HTTPS行为、登录提交与证书；HTTP实际提供认证表单时保存原文作为失败证据，不发送额外真实秘密或扫描猜测443端口
  - 覆盖核查：基于本项默认安全基线与实际目标入口完成必测，不以缺外部策略资料停止；必要时读取获准本机靶机实现补充对照，发现任一确证失败保留失败，其余覆盖继续记录
  - 项目 AI 调用 nmap 的 ssl-enum-ciphers/ssl-cert 核对协议/套件；经 execute-python-script 使用默认 SSLContext 校验证书链、主机名及有效期，保存成功/失败的原始输出；不关闭证书校验后宣称证书通过
  - 用 http-framework-test 不带认证秘密/敏感正文请求 HTTP，关闭跳转，保存拒绝或 HTTPS Location 及适用 HSTS
  - 核对约定页面的敏感提交地址与资源协议，记录未观察链路，不声称实际中间人攻击
  - 判定与保存：项目 AI 逐子项对照本项 expected_results，关联实际操作、观察及 minimum_evidence 所需的真实文件；按共同要求保留失败和覆盖缺口，调用banma_pentest_run_cases save 保存 PT_WEB_12，核对返回路径与成功状态；保存错误先修正，不把计划或预览写成已完成原文
minimum_evidence: 本项默认基线引用、实际目标与入口核查清单、已探测候选及正常/不存在路径对照原文；基线来源、端口/链路清单、TLS 输出、证书校验及 HTTP/HTTPS 响应引用。 项目 AI 在实际调用中取得上述原文，保存或引用本次 evidence/raw/ 下的文件，并保留来源/步骤对应；已完成的目标操作、必要恢复与声明为完成的子项均须有相应真实引用，元数据/AI 摘要不能冒充原文。
expected_results:
  通过: 必测及已触发条件项完成，已测 TLS 和适用 HSTS 满足基线，HTTP 安全拒绝或跳转，已观察匿名链路无敏感明文；依据本项默认安全基线及真实观察判定，范围限于本轮已完整核查内容
  失败: 实测禁止协议/套件、证书不合基线或已观察敏感明文传输；不需要另行用户策略文档才能确认违反本项默认安全基线
  中断: 仅在未证实失败且实际工具/执行环境故障经修正或等效工具重试仍阻止必要验证时中断，记录失败调用、原文及补救；缺策略文档、目标没有该功能、未提供可选凭据或首次采集不足不是中断理由。未知仍须继续核查，不得凭空判通过/失败
