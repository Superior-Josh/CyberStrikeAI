---
category: 基础设施
id: PT_WEB_12
name: TLS 与传输安全配置
description: 用 nmap、execute-python-script 的 ssl 能力与 http-framework-test 检查授权 TLS 服务、证书和明文入口。
level: 高
group: anonymous
required: 约定 TLS 服务的协议、套件、证书及明文入口
conditional: HSTS 按业务适用基线检查；页面资源仅覆盖约定匿名链路，不扩展认证后流量
steps:
  - 执行准备：项目 AI 完整读取 PT_WEB_12 与共同/分组要求，在当前对话列出必测子项和触发依据；核对授权、正常对照、实际工具 schema 与原文输出方式，复用指导工具返回的本次目录，不要求用户运行命令或填写结果
  - 从用户、获准部署资料或明确适用标准取得 TLS/证书/HSTS 基线，登记端口与链路
  - 项目 AI 调用 nmap 的 ssl-enum-ciphers/ssl-cert 核对协议/套件；经 execute-python-script 使用默认 SSLContext 校验证书链、主机名及有效期，保存成功/失败的原始输出；不关闭证书校验后宣称证书通过
  - 用 http-framework-test 不带认证秘密/敏感正文请求 HTTP，关闭跳转，保存拒绝或 HTTPS Location 及适用 HSTS
  - 核对约定页面的敏感提交地址与资源协议，记录未观察链路，不声称实际中间人攻击
  - 判定与保存：项目 AI 逐子项对照本项 expected_results，关联实际操作、观察及 minimum_evidence 所需的真实文件；按共同要求保留失败和覆盖缺口，调用重写后的指导工具 save 保存 PT_WEB_12，核对返回路径与成功状态；保存错误先修正，不把计划或预览写成已完成原文
minimum_evidence: 基线来源、端口/链路清单、TLS 输出、证书校验及 HTTP/HTTPS 响应引用。 项目 AI 在实际调用中取得上述原文，保存或引用本次 evidence/raw/ 下的文件，并保留来源/步骤对应；已完成的目标操作、必要恢复与声明为完成的子项均须有相应真实引用，元数据/AI 摘要不能冒充原文。
expected_results:
  通过: 必测及已触发条件项完成，已测 TLS 和适用 HSTS 满足基线，HTTP 安全拒绝或跳转，已观察匿名链路无敏感明文
  失败: 实测禁止协议/套件、证书不合基线或已观察敏感明文传输
  中断: 未确认失败，但缺明确基线、必要 TLS/证书证据或约定链路观察。
