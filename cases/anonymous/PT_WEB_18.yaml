---
category: 供应链
id: PT_WEB_18
name: CDN/第三方脚本 SRI 校验
description: 用 http-framework-test 与 execute-python-script 校验适用第三方脚本和样式资源的 SRI、跨域加载条件及内容一致性。
level: 中
group: anonymous
required: 约定需 SRI 的第三方脚本/样式摘要与跨域加载条件
conditional: 动态加载需已有浏览器获取实际资源；版本固定和豁免只按真实基线，不要求所有外部资源 SRI
steps:
  - 从用户或获准安全资料取得 SRI 适用基线，用 http-framework-test 下载页面，登记脚本/样式及豁免
  - 在第三方读取授权内下载实际资源，保存 integrity、crossorigin 及 CORS 响应
  - execute-python-script 用 hashlib/base64 按浏览器使用内容表示计算摘要，核对最强适用算法与多个摘要
  - 核对跨域加载条件，必要时观察动态加载，逐资源记录匹配、缺失或无法读取
minimum_evidence: 适用基线/豁免、页面标签、资源文件、计算摘要及 CORS/动态观察引用。
expected_results:
  通过: 必测及已触发条件项完成，所有约定需 SRI 资源具备有效摘要匹配及适用跨域加载条件
  失败: 需 SRI 的已确认资源缺失/无效 integrity、最强适用算法均不匹配或跨域条件不合规则
  中断: 未确认失败，但缺适用基线、授权资源内容或必要动态资源观察。
