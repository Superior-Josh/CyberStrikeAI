---
category: 供应链
id: PT_WEB_18
name: CDN/第三方脚本 SRI 校验
description: 用 http-framework-test 与 execute-python-script 校验适用第三方脚本和样式资源的 SRI、跨域加载条件及内容一致性。
level: 中
group: anonymous
required: 约定需 SRI 的第三方脚本/样式摘要与跨域加载条件
conditional: 动态加载需已有浏览器获取实际资源；版本固定和豁免只按真实基线，不要求所有外部资源 SRI
steps:
  - 执行准备：项目 AI 完整读取 PT_WEB_18 与共同/分组要求，在当前对话列出必测子项和触发依据；核对授权、正常对照、实际工具 schema 与原文输出方式，复用指导工具返回的本次目录，不要求用户运行命令或填写结果
  - 从用户或获准安全资料取得 SRI 适用基线，用 http-framework-test 下载页面，登记脚本/样式及豁免
  - 在第三方读取授权内下载实际资源，保存 integrity、crossorigin 及 CORS 响应
  - 项目 AI 经 execute-python-script 用 hashlib/base64 计算浏览器实际接收的解压后资源内容摘要；不按字符集重新编码、改换行或哈希压缩线上字节，核对最强适用算法/多个摘要，并保存计算输入文件及结果
  - 核对跨域加载条件，必要时观察动态加载，逐资源记录匹配、缺失或无法读取
  - 判定与保存：项目 AI 逐子项对照本项 expected_results，关联实际操作、观察及 minimum_evidence 所需的真实文件；按共同要求保留失败和覆盖缺口，调用重写后的指导工具 save 保存 PT_WEB_18，核对返回路径与成功状态；保存错误先修正，不把计划或预览写成已完成原文
minimum_evidence: 适用基线/豁免、页面标签、资源文件、计算摘要及 CORS/动态观察引用。 项目 AI 在实际调用中取得上述原文，保存或引用本次 evidence/raw/ 下的文件，并保留来源/步骤对应；已完成的目标操作、必要恢复与声明为完成的子项均须有相应真实引用，元数据/AI 摘要不能冒充原文。
expected_results:
  通过: 必测及已触发条件项完成，所有约定需 SRI 资源具备有效摘要匹配及适用跨域加载条件
  失败: 需 SRI 的已确认资源缺失/无效 integrity、最强适用算法均不匹配或跨域条件不合规则
  中断: 未确认失败，但缺适用基线、授权资源内容或必要动态资源观察。
