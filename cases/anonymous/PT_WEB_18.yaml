---
category: 供应链
id: PT_WEB_18
name: CDN/第三方脚本 SRI 校验
description: 用 http-framework-test 与 execute-python-script 校验适用第三方脚本和样式资源的 SRI、跨域加载条件及内容一致性。
level: 中
group: anonymous
required: 目标范围与攻击面实际核查；存在适用入口时完成：约定需 SRI 的第三方脚本/样式摘要与跨域加载条件
conditional: （本共同要求优先：可选机制不存在时完成攻击面核查并停止以下仅适用分支；此后的策略/规则取本项默认基线和实际网络观察，不向用户索要未必存在的文档）动态加载需已有浏览器获取实际资源；版本固定和豁免只按真实基线，不要求所有外部资源 SRI
steps:
  - 执行准备：项目 AI 完整读取 PT_WEB_18 与共同/分组要求，在当前对话列出必测子项和触发依据；核对授权、正常对照、实际工具 schema 与原文输出方式，复用指导工具返回的本次目录，不要求用户运行命令或填写结果
  - 默认安全基线：从第三方加载的可执行脚本/样式须有有效SRI及匹配加载条件；同源本地资源不强制SRI。执行：从完整同源页面和实际动态网络观察整理脚本/样式，记录来源；第三方内容可读时按本项后续步骤算摘要，未获外连授权只读取现有本地缓存/文件，不越界
  - 攻击面核查：读取本轮匿名及认证资源清单、链接/表单/脚本/实际网络记录，探测与本项相关的同源候选入口并对照正常页和随机不存在路径；通过真实授权网络请求补充入口与行为证据。记录实际覆盖和每个候选的结果，不以单个404、登录页、工具无告警、语言指纹或DVWA惯例证明不存在。确认不使用对应机制后停止不适用攻击步骤，将攻击面核查作为must_complete=true的实际验证子项；无法确认时继续补查，只有环境阻塞才中断
  - 在第三方读取授权内下载实际资源，保存 integrity、crossorigin 及 CORS 响应
  - 项目 AI 经 execute-python-script 用 hashlib/base64 计算浏览器实际接收的解压后资源内容摘要；不按字符集重新编码、改换行或哈希压缩线上字节，核对最强适用算法/多个摘要，并保存计算输入文件及结果
  - 核对跨域加载条件，必要时观察动态加载，逐资源记录匹配、缺失或无法读取
  - 判定与保存：项目 AI 逐子项对照本项 expected_results，关联实际操作、观察及 minimum_evidence 所需的真实文件；按共同要求保留失败和覆盖缺口，调用banma_pentest_run_cases save 保存 PT_WEB_18，核对返回路径与成功状态；保存错误先修正，不把计划或预览写成已完成原文
minimum_evidence: 本项默认基线引用、实际目标与入口核查清单、已探测候选及正常/不存在路径对照原文；适用基线/豁免、页面标签、资源文件、计算摘要及 CORS/动态观察引用。 项目 AI 在实际调用中取得上述原文，保存或引用本次 evidence/raw/ 下的文件，并保留来源/步骤对应；已完成的目标操作、必要恢复与声明为完成的子项均须有相应真实引用，元数据/AI 摘要不能冒充原文。
expected_results:
  通过: 必测及已触发条件项完成，所有约定需 SRI 资源具备有效摘要匹配及适用跨域加载条件；依据本项默认安全基线及真实观察判定，范围限于本轮已完整核查内容；或完成攻击面核查确认无适用入口/未使用对应机制，记录“通过（攻击面不适用）”的理由和原文，不声称该机制的防护已验证
  失败: 需 SRI 的已确认资源缺失/无效 integrity、最强适用算法均不匹配或跨域条件不合规则；不需要另行用户策略文档才能确认违反本项默认安全基线
  中断: 仅在未证实失败且实际工具/执行环境故障经修正或等效工具重试仍阻止必要验证时中断，记录失败调用、原文及补救；缺策略文档、目标没有该功能、未提供可选凭据或首次采集不足不是中断理由。未知仍须继续核查，不得凭空判通过/失败
