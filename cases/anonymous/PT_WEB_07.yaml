---
category: 注入
id: PT_WEB_07
name: 外链重定向
description: 用 gau、waybackurls、katana、ffuf 与 http-framework-test 检查跳转参数是否限制未经允许的外部目标。
level: 中
group: anonymous
required: 真实跳转入口的合法/禁止目的地对照
conditional: 存在 JS 跳转时须经已有浏览器观察；历史 URL 工具和 ffuf 仅辅助发现及有限变体
steps:
  - 执行准备：项目 AI 完整读取 PT_WEB_07 与共同/分组要求，在当前对话列出必测子项和触发依据；核对授权、正常对照、实际工具 schema 与原文输出方式，复用指导工具返回的本次目录，不要求用户运行命令或填写结果
  - 从用户或获准业务资料取得允许目标/用户确认规则，登记本轮跳转入口；katana、gau 或 waybackurls 可辅助发现
  - 用 http-framework-test 设置 follow_redirects=false 验证合法跳转
  - 逐入口提交批准外域、编码及域名边界变体，核对 Location 或用户确认；不访问未授权目的地
  - 项目 AI 经 execute-python-script 驱动已有浏览器验证 JS 跳转，先限制导航目的地不越过授权，记录实际跳转意图/目标及用户确认机制；只有解析 JS 而未取得必要运行观察时记录缺口
  - 判定与保存：项目 AI 逐子项对照本项 expected_results，关联实际操作、观察及 minimum_evidence 所需的真实文件；按共同要求保留失败和覆盖缺口，调用重写后的指导工具 save 保存 PT_WEB_07，核对返回路径与成功状态；保存错误先修正，不把计划或预览写成已完成原文
minimum_evidence: 跳转规则、入口清单、正常/变体响应头及适用 JS 导航引用。 项目 AI 在实际调用中取得上述原文，保存或引用本次 evidence/raw/ 下的文件，并保留来源/步骤对应；已完成的目标操作、必要恢复与声明为完成的子项均须有相应真实引用，元数据/AI 摘要不能冒充原文。
expected_results:
  通过: 必测及已触发条件项完成，合法跳转有效，已测禁止目标被限制或经有效用户确认
  失败: 未经允许的外部目标可直接跳转且无所需确认
  中断: 未确认失败，但缺合法对照、目标规则或已触发 JS 跳转证据；正常外链不判失败。
