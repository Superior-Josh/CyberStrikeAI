---
category: 供应链
id: PT_WEB_17
name: 已知组件漏洞扫描（SCA）
description: 用 trivy 对授权本地依赖或镜像做组件漏洞检查，execute-python-script 与 http-framework-test 复核适用版本和处置依据。
level: 高
group: anonymous
required: 目标范围与攻击面实际核查；存在适用入口时完成：授权依赖/镜像清单、组件漏洞检查及适用性复核
conditional: （本共同要求优先：可选机制不存在时完成攻击面核查并停止以下仅适用分支；此后的策略/规则取本项默认基线和实际实现，不向用户索要未必存在的文档）源码/依赖输入用 trivy mode=fs，镜像输入用 mode=image；可达性、例外及风险接受仅在取得实际资料时评价
steps:
  - 执行准备：项目 AI 完整读取 PT_WEB_17 与共同/分组要求，在当前对话列出必测子项和触发依据；核对授权、正常对照、实际工具 schema 与原文输出方式，复用指导工具返回的本次目录，不要求用户运行命令或填写结果
  - 默认安全基线：真实已安装依赖中确认适用的未处置已知漏洞失败；固定实际清单范围完成检查且命中排除后通过，不从HTTP指纹猜完整依赖。执行：本机靶机优先由已有本地部署映射读取镜像/锁文件/依赖清单，使用已安装扫描器或本地公告数据复核；缺扫描器可用等效版本与公告核查，不将只有URL直接记中断
  - 覆盖核查：基于本项默认安全基线与实际目标入口完成必测，不以缺外部策略资料停止；必要时读取获准本机靶机实现补充对照，发现任一确证失败保留失败，其余覆盖继续记录
  - 按已确认对应目标的授权依赖目录或镜像选择trivy模式，不扫描宿主根目录或其他项目；以本机帮助及实际schema核对additional_args，用--scanners vuln限定本项组件漏洞检查、--timeout 180s设单次运行预算、--output指定本次raw_dir唯一原生JSON文件，output_format=json。保存实际输入/清单、漏洞库时间、不支持的依赖及结束状态；不因没有高危命中跳过其他适用版本复核
  - 首次保存前用已有文件读取/查询工具确认原生JSON完整可读，解析摘要与计数而非把大输出反复送入上下文，source_path引用真实文件。预算到期须保留错误及未完成输入，按依赖/镜像清单拆分或用等效版本与公告核查继续完成必要覆盖，不把超时或部分JSON当扫描完成，不因节省时间跳过已选必要输入
  - execute-python-script 解析命中，http-framework-test 读取已知官方公告，核对实际版本与适用前提
  - 按处置基线逐项记录违反、有效例外或待核实状态，不从组件扫描推断全部源码安全
  - 判定与保存：项目 AI 逐子项对照本项 expected_results，关联实际操作、观察及 minimum_evidence 所需的真实文件；按共同要求保留失败和覆盖缺口，调用banma_pentest_run_cases save 保存 PT_WEB_17，核对返回路径与成功状态；保存错误先修正，不把计划或预览写成已完成原文
minimum_evidence: 本项默认基线引用、实际目标与入口核查清单、已探测候选及正常/不存在路径对照原文；输入/组件版本、处置基线、数据库时间、扫描输出、公告及例外依据引用。 项目 AI 在实际调用中取得上述原文，保存或引用本次 evidence/raw/ 下的文件，并保留来源/步骤对应；已完成的目标操作、必要恢复与声明为完成的子项均须有相应真实引用，元数据/AI 摘要不能冒充原文。
expected_results:
  通过: 必测及已触发条件项完成，约定输入检查完成，无违反处置基线的已确认适用漏洞；依据本项默认安全基线及真实观察判定，范围限于本轮已完整核查内容
  失败: 实际组件存在已确认适用且违反处置基线的漏洞；不需要另行用户策略文档才能确认违反本项默认安全基线
  中断: 仅在未证实失败且实际工具/执行环境故障经修正或等效工具重试仍阻止必要验证时中断，记录失败调用、原文及补救；缺策略文档、目标没有该功能、未提供可选凭据或首次采集不足不是中断理由。未知仍须继续核查，不得凭空判通过/失败
