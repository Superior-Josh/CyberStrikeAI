---
category: 注入
id: PT_WEB_09
name: SQL 注入（公开接口）
description: 用 http-framework-test、arjun、sqlmap 与 execute-python-script 对公开查询做正常、布尔及重复时延对照。
level: 高
group: anonymous
required: 目标范围与攻击面实际核查；存在适用入口时完成：真实公开查询及已选注入方法的正常/变体对照
conditional: （本共同要求优先：可选机制不存在时完成攻击面核查并停止以下仅适用分支；此后的策略/规则取本项默认基线和实际网络观察，不向用户索要未必存在的文档）布尔、报错和短延时方法按实际入口预先选择；sqlmap 与 nmap 脚本辅助检测，不要求全部方法运行
steps:
  - 执行准备：项目 AI 完整读取 PT_WEB_09 与共同/分组要求，在当前对话列出必测子项和触发依据；核对授权、正常对照、实际工具 schema 与原文输出方式，复用指导工具返回的本次目录，不要求用户运行命令或填写结果
  - 默认安全基线：公开输入不得改变SQL查询语义或读取非授权数据；每个已选方法至少两组交替正常/真假对照。执行：从匿名页面和接口发现真实查询；登录接口的SQL相关输入亦纳入；选定可验证方法及请求预算，正常和变体均保持其他业务前提有效
  - 攻击面核查：读取本轮匿名及认证资源清单、链接/表单/脚本/实际网络记录，探测与本项相关的同源候选入口并对照正常页和随机不存在路径；通过真实授权网络请求补充入口与行为证据。记录实际覆盖和每个候选的结果，不以单个404、登录页、工具无告警、语言指纹或DVWA惯例证明不存在。确认不使用对应机制后停止不适用攻击步骤，将攻击面核查作为must_complete=true的实际验证子项；无法确认时继续补查，只有环境阻塞才中断
  - 在受控 level/risk 下用 sqlmap 检测批准参数，或直接由 http-framework-test 提交批准变体
  - 项目 AI 按事前记录的次数交替调用 http-framework-test 提交正常、布尔真/假及已选短延时等变体，用 execute-python-script 对照数据、响应与时间分布；只有数据回显相同或未见报错不能确认已测注入方法有效完成
  - 复核测试前后正常查询及可归因效果，排除随机波动、校验错误和统一空响应
  - 判定与保存：项目 AI 逐子项对照本项 expected_results，关联实际操作、观察及 minimum_evidence 所需的真实文件；按共同要求保留失败和覆盖缺口，调用banma_pentest_run_cases save 保存 PT_WEB_09，核对返回路径与成功状态；保存错误先修正，不把计划或预览写成已完成原文
minimum_evidence: 本项默认基线引用、实际目标与入口核查清单、已探测候选及正常/不存在路径对照原文；参数/方法清单、正常与变体原始响应、样本时间及差异分析引用。 项目 AI 在实际调用中取得上述原文，保存或引用本次 evidence/raw/ 下的文件，并保留来源/步骤对应；已完成的目标操作、必要恢复与声明为完成的子项均须有相应真实引用，元数据/AI 摘要不能冒充原文。
expected_results:
  通过: 必测及已触发条件项完成，有效查询条件下约定方法完成，无可复现查询逻辑改变、越界读取或其他注入效果；依据本项默认安全基线及真实观察判定，范围限于本轮已完整核查内容；或完成攻击面核查确认无适用入口/未使用对应机制，记录“通过（攻击面不适用）”的理由和原文，不声称该机制的防护已验证
  失败: 有效对照下证实可归因注入效果；不需要另行用户策略文档才能确认违反本项默认安全基线
  中断: 仅在未证实失败且实际工具/执行环境故障经修正或等效工具重试仍阻止必要验证时中断，记录失败调用、原文及补救；缺策略文档、目标没有该功能、未提供可选凭据或首次采集不足不是中断理由。未知仍须继续核查，不得凭空判通过/失败
