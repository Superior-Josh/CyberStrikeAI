---
category: 注入
id: PT_WEB_09
name: SQL 注入（公开接口）
description: 用 http-framework-test、arjun、sqlmap 与 execute-python-script 对公开查询做正常、布尔及重复时延对照。
level: 高
group: anonymous
required: 真实公开查询及已选注入方法的正常/变体对照
conditional: 布尔、报错和短延时方法按实际入口预先选择；sqlmap 与 nmap 脚本辅助检测，不要求全部方法运行
steps:
  - 执行准备：项目 AI 完整读取 PT_WEB_09 与共同/分组要求，在当前对话列出必测子项和触发依据；核对授权、正常对照、实际工具 schema 与原文输出方式，复用指导工具返回的本次目录，不要求用户运行命令或填写结果
  - 用 http-framework-test 确认正常查询及参数，登记测试方法、样本数、短延时与请求上限；arjun 可辅助发现
  - 在受控 level/risk 下用 sqlmap 检测批准参数，或直接由 http-framework-test 提交批准变体
  - 项目 AI 按事前记录的次数交替调用 http-framework-test 提交正常、布尔真/假及已选短延时等变体，用 execute-python-script 对照数据、响应与时间分布；只有数据回显相同或未见报错不能确认已测注入方法有效完成
  - 复核测试前后正常查询及可归因效果，排除随机波动、校验错误和统一空响应
  - 判定与保存：项目 AI 逐子项对照本项 expected_results，关联实际操作、观察及 minimum_evidence 所需的真实文件；按共同要求保留失败和覆盖缺口，调用重写后的指导工具 save 保存 PT_WEB_09，核对返回路径与成功状态；保存错误先修正，不把计划或预览写成已完成原文
minimum_evidence: 参数/方法清单、正常与变体原始响应、样本时间及差异分析引用。 项目 AI 在实际调用中取得上述原文，保存或引用本次 evidence/raw/ 下的文件，并保留来源/步骤对应；已完成的目标操作、必要恢复与声明为完成的子项均须有相应真实引用，元数据/AI 摘要不能冒充原文。
expected_results:
  通过: 必测及已触发条件项完成，有效查询条件下约定方法完成，无可复现查询逻辑改变、越界读取或其他注入效果
  失败: 有效对照下证实可归因注入效果
  中断: 未确认失败，但缺正常查询、必要重复样本或差异无法归因；一次无报错或扫描无告警不足。
