---
category: 注入
id: PT_WEB_10
name: 文件路径遍历
description: 用 http-framework-test 与 execute-python-script 验证真实文件读取或下载参数是否允许越出授权目录。
level: 中
group: anonymous
required: 真实文件读取入口、目录边界及越界内容对照
conditional: 编码与规范化变体按入口选择；静态文件暴露归 PT_WEB_14
steps:
  - 执行准备：项目 AI 完整读取 PT_WEB_10 与共同/分组要求，在当前对话列出必测子项和触发依据；核对授权、正常对照、实际工具 schema 与原文输出方式，复用指导工具返回的本次目录，不要求用户运行命令或填写结果
  - 确认授权读取目录、参数及已知目录内/外测试文件，登记本轮变体
  - 用 http-framework-test 读取正常文件与随机不存在文件，保存实际内容对照
  - execute-python-script 构造相对路径/编码变体，http-framework-test 保留字面路径逐次提交
  - 按已知文件内容复核越界读取，排除输入回显、软 404 和统一拒绝页
  - 判定与保存：项目 AI 逐子项对照本项 expected_results，关联实际操作、观察及 minimum_evidence 所需的真实文件；按共同要求保留失败和覆盖缺口，调用重写后的指导工具 save 保存 PT_WEB_10，核对返回路径与成功状态；保存错误先修正，不把计划或预览写成已完成原文
minimum_evidence: 目录边界依据、测试文件身份、正常/不存在/越界请求响应引用。 项目 AI 在实际调用中取得上述原文，保存或引用本次 evidence/raw/ 下的文件，并保留来源/步骤对应；已完成的目标操作、必要恢复与声明为完成的子项均须有相应真实引用，元数据/AI 摘要不能冒充原文。
expected_results:
  通过: 必测及已触发条件项完成，正常文件可读，已测变体不能读取目录外测试文件；拒绝状态码不限
  失败: 实际取得授权目录外文件内容或可归因敏感内容
  中断: 未确认失败，但缺真实入口、已知边界文件或正常内容对照。
