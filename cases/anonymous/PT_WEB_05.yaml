category: 信息泄露
id: PT_WEB_05
name: 主机与 Web 组件已知漏洞检查
description: 用 nmap、nuclei、nikto、jaeles 与必要的 metasploit 检查授权服务的已知漏洞，复核适用前提和实际效果。
level: 高
group: anonymous
required: 目标范围与攻击面实际核查；存在适用入口时完成：约定服务和适用漏洞模板检查、命中复核
conditional: （本共同要求优先：可选机制不存在时完成攻击面核查并停止以下仅适用分支；此后的策略/规则取本项默认基线和实际实现，不向用户索要未必存在的文档）metasploit 仅在授权且检查模块行为明确时使用；其他扫描器按覆盖选择替代或补充
steps:
  - 执行准备：项目 AI 完整读取 PT_WEB_05 与共同/分组要求，在当前对话列出必测子项和触发依据；核对授权、正常对照、实际工具 schema 与原文输出方式，复用指导工具返回的本次目录，不要求用户运行命令或填写结果
  - 默认安全基线：已确认适用且可复现的组件漏洞失败；有原文支持的有限模板检查及命中排除完成后可通过，不能宣称覆盖所有CVE。执行：由响应与实际本地部署映射发现组件，选取本机已有适用非破坏性模板；保存选定覆盖与逐命中复核，不向用户索要模板清单
  - 覆盖核查：基于本项默认安全基线与实际目标入口完成必测，不以缺外部策略资料停止；必要时读取获准本机靶机实现补充对照，发现任一确证失败保留失败，其余覆盖继续记录
  - 扫描准备：按已观察的组件/版本/入口选择本机已有非破坏性模板或签名，先列出实际模板ID/路径、适用依据和计划覆盖；检查模板请求/载荷不超出本轮目标端口、禁止动作、共享口令预算或写授权，不启用外域/带外访问，不以严重度过滤代替组件选择，不默认跑全模板或依次串行跑所有扫描器；默认每批最长120秒、最多2个并发检查任务、每秒最多5请求、单请求超时10秒，用户或用例更严格限制优先。本项预计总时长、批次数和请求上限按所选模板及实际载荷计算并在执行前记录，不能用时间/速率代替请求总量预算
  - 按覆盖选择 nuclei、nmap 非破坏性漏洞脚本或 nikto/jaeles 已有签名执行，输出原生保存至本次raw_dir唯一文件，并保留模板加载/完成范围及结束状态的真实执行日志；空命中文件不能代替完成记录。nuclei用template传核查后的明确路径，并按当前schema用additional_args设置-rl 5 -c 2 -pc 1 -prc 2 -timeout 10 -retries 0 -duc及输出路径；-timeout是单请求超时，单批120秒另以已有执行查询/取消能力管理且只取消本批确切execution_id。nikto仅选择匹配的Tuning类别，additional_args设置-maxtime 120s -timeout 10 -Pause 0.2及原生输出路径；其他扫描器先核对本机帮助与参数，不假定相同选项
  - 达到本批预算时保留实际已完成覆盖、未完成模板、真实输出及结束状态；时间到期或主动取消本身不证明环境故障，不作为通过/中断依据。核对剩余必要覆盖后缩小批次或用等效针对性方法继续验证，不再盲目换一个全量扫描器；无进展重试仍被实际执行环境故障阻止时按共同要求记录尝试与原文，已确认失败继续保留
  - 用 http-framework-test 或匹配工具复核每项命中的适用版本及实际行为，排除仅版本猜测
  - execute-python-script 对照计划覆盖与完成情况，列出命中确认或待复核状态
  - 判定与保存：项目 AI 逐子项对照本项 expected_results，关联实际操作、观察及 minimum_evidence 所需的真实文件；按共同要求保留失败和覆盖缺口，调用banma_pentest_run_cases save 保存 PT_WEB_05，核对返回路径与成功状态；保存错误先修正，不把计划或预览写成已完成原文
minimum_evidence: 本项默认基线引用、实际目标与入口核查清单、已探测候选及正常/不存在路径对照原文；服务与模板清单、版本依据、扫描输出及各命中行为复核引用。 项目 AI 在实际调用中取得上述原文，保存或引用本次 evidence/raw/ 下的文件，并保留来源/步骤对应；已完成的目标操作、必要恢复与声明为完成的子项均须有相应真实引用，元数据/AI 摘要不能冒充原文。
expected_results:
  通过: 必测及已触发条件项完成，约定检查完成且无已确认适用漏洞，命中均有支持或排除依据；不声称覆盖全部 CVE；依据本项默认安全基线及真实观察判定，范围限于本轮已完整核查内容
  失败: 版本与适用条件及实际行为证实漏洞；不需要另行用户策略文档才能确认违反本项默认安全基线
  中断: 仅在未证实失败且实际工具/执行环境故障经修正或等效工具重试仍阻止必要验证时中断，记录失败调用、原文及补救；缺策略文档、目标没有该功能、未提供可选凭据或首次采集不足不是中断理由。未知仍须继续核查，不得凭空判通过/失败
