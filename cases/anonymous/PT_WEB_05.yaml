---
category: 信息泄露
id: PT_WEB_05
name: 主机与 Web 组件已知漏洞检查
description: 用 nmap、nuclei、nikto、jaeles 与必要的 metasploit 检查授权服务的已知漏洞，复核适用前提和实际效果。
level: 高
group: anonymous
required: 约定服务和适用漏洞模板检查、命中复核
conditional: metasploit 仅在授权且检查模块行为明确时使用；其他扫描器按覆盖选择替代或补充
steps:
  - 执行准备：项目 AI 完整读取 PT_WEB_05 与共同/分组要求，在当前对话列出必测子项和触发依据；核对授权、正常对照、实际工具 schema 与原文输出方式，复用指导工具返回的本次目录，不要求用户运行命令或填写结果
  - 登记服务、版本依据及本轮模板清单，核对已安装模板动作、权限和非破坏性要求
  - 按覆盖选择 nuclei、nmap 非破坏性漏洞脚本或 nikto/jaeles 已有签名执行，保存原始输出
  - 用 http-framework-test 或匹配工具复核每项命中的适用版本及实际行为，排除仅版本猜测
  - execute-python-script 对照计划覆盖与完成情况，列出命中确认或待复核状态
  - 判定与保存：项目 AI 逐子项对照本项 expected_results，关联实际操作、观察及 minimum_evidence 所需的真实文件；按共同要求保留失败和覆盖缺口，调用重写后的指导工具 save 保存 PT_WEB_05，核对返回路径与成功状态；保存错误先修正，不把计划或预览写成已完成原文
minimum_evidence: 服务与模板清单、版本依据、扫描输出及各命中行为复核引用。 项目 AI 在实际调用中取得上述原文，保存或引用本次 evidence/raw/ 下的文件，并保留来源/步骤对应；已完成的目标操作、必要恢复与声明为完成的子项均须有相应真实引用，元数据/AI 摘要不能冒充原文。
expected_results:
  通过: 必测及已触发条件项完成，约定检查完成且无已确认适用漏洞，命中均有支持或排除依据；不声称覆盖全部 CVE
  失败: 版本与适用条件及实际行为证实漏洞
  中断: 未确认失败，但缺必要模板、约定覆盖未完成或命中无法复核；无告警不能单独证明安全。
