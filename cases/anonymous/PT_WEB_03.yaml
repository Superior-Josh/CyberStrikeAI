---
category: 信息泄露
id: PT_WEB_03
name: 指纹识别信息泄露
description: 用 httpx、nmap、nikto、nuclei 与 http-framework-test 核对响应头、服务 Banner 和错误页中的敏感版本及调试信息。
level: 中
group: anonymous
required: 目标范围与攻击面实际核查；存在适用入口时完成：约定服务的正常响应、错误页及服务 Banner
conditional: （本共同要求优先：可选机制不存在时完成攻击面核查并停止以下仅适用分支；此后的策略/规则取本项默认基线和实际实现，不向用户索要未必存在的文档）非 HTTP 服务仅在授权端口内检查；nuclei、nikto 作为补充，不要求全部扫描器运行
steps:
  - 执行准备：项目 AI 完整读取 PT_WEB_03 与共同/分组要求，在当前对话列出必测子项和触发依据；核对授权、正常对照、实际工具 schema 与原文输出方式，复用指导工具返回的本次目录，不要求用户运行命令或填写结果
  - 默认安全基线：服务响应不应披露精确组件版本、堆栈、内部绝对路径或诊断配置；仅识别一般框架不判失败。执行：采集授权端口的正常页面、随机不存在路径与一项无害非法输入，定位Banner、错误页和诊断信息；禁止扫描其他端口
  - 覆盖核查：基于本项默认安全基线与实际目标入口完成必测，不以缺外部策略资料停止；必要时读取获准本机靶机实现补充对照，发现任一确证失败保留失败，其余覆盖继续记录
  - 用 http-framework-test 获取正常及不存在路径响应；httpx 可辅助采集，nmap 核对批准服务 Banner
  - 对指纹或疑似堆栈、内部路径逐项定位原始响应，execute-python-script 整理内容与基线对照
  - 记录完成服务与未覆盖服务，避免仅依据扫描器推测版本
  - 判定与保存：项目 AI 逐子项对照本项 expected_results，关联实际操作、观察及 minimum_evidence 所需的真实文件；按共同要求保留失败和覆盖缺口，调用banma_pentest_run_cases save 保存 PT_WEB_03，核对返回路径与成功状态；保存错误先修正，不把计划或预览写成已完成原文
minimum_evidence: 本项默认基线引用、实际目标与入口核查清单、已探测候选及正常/不存在路径对照原文；披露基线来源、服务清单、正常/错误响应、Banner 与命中原文引用。 项目 AI 在实际调用中取得上述原文，保存或引用本次 evidence/raw/ 下的文件，并保留来源/步骤对应；已完成的目标操作、必要恢复与声明为完成的子项均须有相应真实引用，元数据/AI 摘要不能冒充原文。
expected_results:
  通过: 必测及已触发条件项完成，约定响应未披露基线禁止的信息；依据本项默认安全基线及真实观察判定，范围限于本轮已完整核查内容
  失败: 实际响应或 Banner 暴露明确禁止披露的版本、堆栈、配置或内部路径；不需要另行用户策略文档才能确认违反本项默认安全基线
  中断: 仅在未证实失败且实际工具/执行环境故障经修正或等效工具重试仍阻止必要验证时中断，记录失败调用、原文及补救；缺策略文档、目标没有该功能、未提供可选凭据或首次采集不足不是中断理由。未知仍须继续核查，不得凭空判通过/失败
