---
category: 安全配置
id: PT_WEB_15
name: 默认凭证与示例应用
description: 用 ffuf、http-framework-test 与适用的 wpscan 检查有限默认凭证及不应部署的示例功能。
level: 高
group: anonymous
required: 实际组件的批准默认凭证组合及禁止示例功能
conditional: 存在相应组件才测试其默认组合/示例；WordPress 的 wpscan 仅辅助组件核对
steps:
  - 执行准备：项目 AI 完整读取 PT_WEB_15 与共同/分组要求，在当前对话列出必测子项和触发依据；核对授权、正常对照、实际工具 schema 与原文输出方式，复用指导工具返回的本次目录，不要求用户运行命令或填写结果
  - 从用户、获准部署资料及组件资料确定适用组合与禁止示例，登记共享口令上限
  - 用 http-framework-test 确认真实登录字段、会话和 CSRF，ffuf 可辅助发现授权入口
  - 逐次提交批准默认组合并核对真实登录接受行为，出现锁定、挑战或 429 停止
  - 核对禁止示例是否实际可使用，认证后资源访问归认证用例，记录已测试与未完成组合
  - 判定与保存：项目 AI 逐子项对照本项 expected_results，关联实际操作、观察及 minimum_evidence 所需的真实文件；按共同要求保留失败和覆盖缺口，调用重写后的指导工具 save 保存 PT_WEB_15，核对返回路径与成功状态；保存错误先修正，不把计划或预览写成已完成原文
minimum_evidence: 组件/部署策略依据、组合清单、登录响应及示例可用性引用。 项目 AI 在实际调用中取得上述原文，保存或引用本次 evidence/raw/ 下的文件，并保留来源/步骤对应；已完成的目标操作、必要恢复与声明为完成的子项均须有相应真实引用，元数据/AI 摘要不能冒充原文。
expected_results:
  通过: 必测及已触发条件项完成，已约定组合不能建立违反部署策略的身份，禁止示例不可用
  失败: 默认组合实际建立禁止身份，或禁止部署的示例功能可使用
  中断: 未确认失败，但缺组件/策略、必要组合验证或真实登录判读；登录页可见不单独判失败。
