---
category: 安全配置
id: PT_WEB_15
name: 默认凭证与示例应用
description: 用 ffuf、http-framework-test 与适用的 wpscan 检查有限默认凭证及不应部署的示例功能。
level: 高
group: anonymous
required: 目标范围与攻击面实际核查；存在适用入口时完成：实际组件的批准默认凭证组合及禁止示例功能
conditional: （本共同要求优先：可选机制不存在时完成攻击面核查并停止以下仅适用分支；此后的策略/规则取本项默认基线和实际实现，不向用户索要未必存在的文档）存在相应组件才测试其默认组合/示例；WordPress 的 wpscan 仅辅助组件核对
steps:
  - 执行准备：项目 AI 完整读取 PT_WEB_15 与共同/分组要求，在当前对话列出必测子项和触发依据；核对授权、正常对照、实际工具 schema 与原文输出方式，复用指导工具返回的本次目录，不要求用户运行命令或填写结果
  - 默认安全基线：默认组件凭证实际可登录即失败；DVWA作为受测靶机仍按此安全口径评估，不因教学用途豁免；示例功能仅在泄露秘密或实际危险效果时失败。执行：识别实际组件，优先核对用户提供凭据是否为组件已知默认组合；候选确认仅用已有匿名步骤且共享30次上限，不自行注册或额外扩充字典
  - 覆盖核查：基于本项默认安全基线与实际目标入口完成必测，不以缺外部策略资料停止；必要时读取获准本机靶机实现补充对照，发现任一确证失败保留失败，其余覆盖继续记录
  - 用 http-framework-test 确认真实登录字段、会话和 CSRF，ffuf 可辅助发现授权入口
  - 逐次提交批准默认组合并核对真实登录接受行为，出现锁定、挑战或 429 停止
  - 核对禁止示例是否实际可使用，认证后资源访问归认证用例，记录已测试与未完成组合
  - 判定与保存：项目 AI 逐子项对照本项 expected_results，关联实际操作、观察及 minimum_evidence 所需的真实文件；按共同要求保留失败和覆盖缺口，调用banma_pentest_run_cases save 保存 PT_WEB_15，核对返回路径与成功状态；保存错误先修正，不把计划或预览写成已完成原文
minimum_evidence: 本项默认基线引用、实际目标与入口核查清单、已探测候选及正常/不存在路径对照原文；组件/部署策略依据、组合清单、登录响应及示例可用性引用。 项目 AI 在实际调用中取得上述原文，保存或引用本次 evidence/raw/ 下的文件，并保留来源/步骤对应；已完成的目标操作、必要恢复与声明为完成的子项均须有相应真实引用，元数据/AI 摘要不能冒充原文。
expected_results:
  通过: 必测及已触发条件项完成，已约定组合不能建立违反部署策略的身份，禁止示例不可用；依据本项默认安全基线及真实观察判定，范围限于本轮已完整核查内容
  失败: 默认组合实际建立禁止身份，或禁止部署的示例功能可使用；不需要另行用户策略文档才能确认违反本项默认安全基线
  中断: 仅在未证实失败且实际工具/执行环境故障经修正或等效工具重试仍阻止必要验证时中断，记录失败调用、原文及补救；缺策略文档、目标没有该功能、未提供可选凭据或首次采集不足不是中断理由。未知仍须继续核查，不得凭空判通过/失败
