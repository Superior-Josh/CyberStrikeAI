category: 基础设施
id: PT_WEB_11
name: 受控负载与可用性（公开服务）
description: 用 http-framework-test 与 execute-python-script 在明确负载上限内验证公开服务可用性、限流和停止后的恢复。
level: 高
group: anonymous
required: 目标范围与攻击面实际核查；存在适用入口时完成：专项授权负载下的可用性、时延、错误率及停止后恢复
conditional: （本共同要求优先：可选机制不存在时完成攻击面核查并停止以下仅适用分支；此后的策略/规则取本项默认基线和实际网络观察，不向用户索要未必存在的文档）资源消耗型操作须独立授权；限流响应仅按既定策略评价，不要求一律出现 429
steps:
  - 默认安全基线：有限负载不得造成服务持续不可用；本套默认正常3次、并发2/4各8次请求，超时5秒，停止后30秒内3次健康复核；任一持续错误或恢复失败须复核后失败，短暂时延不单独失败。执行：选择无写入的正常页面按本项有限预算登记执行；用户无禁止动作的本机靶机授权允许该有限测试，不追加压力测试或无限提高并发
  - 覆盖核查：基于本项默认安全基线与实际目标入口完成必测，不以缺外部策略资料停止；通过获准网络接口取得正常/变体响应补充对照，发现任一确证失败保留失败，其余覆盖继续记录
  - 用 http-framework-test 采集正常样本，再用 execute-python-script 的 urllib.request/concurrent.futures 从低负载执行批准计划
  - 达到停止阈值立即停止提交，为在途请求设置超时并记录实际结束情况
  - 在批准窗口用 http-framework-test 观察恢复，汇总时延、失败率和关联影响，不重启服务
minimum_evidence: 本项默认基线引用、实际目标与入口核查清单、已探测候选及正常/不存在路径对照原文；专项授权与基线、负载计划/实际计数、响应时序及停止/恢复观察引用。 原文在实际操作中取得并自动关联本轮执行、步骤及子项；必要操作和恢复均保留真实来源，元数据或模型解释不能冒充原文。
expected_results:
  通过: 必测及已触发条件项完成，约定负载及恢复行为满足可用性/时延/错误率基线，不推断任意 DoS 防护；依据本项默认安全基线及真实观察判定，范围限于本轮已完整核查内容
  失败: 授权负载内实测违反明确可用性或恢复基线，影响与测试有关联证据；不需要另行用户策略文档才能确认违反本项默认安全基线
  中断: 仅在未证实失败且实际工具/执行环境故障经修正或等效工具重试仍阻止必要验证时中断，记录失败调用、原文及补救；缺策略文档、目标没有该功能、未提供可选凭据或首次采集不足不是中断理由。未知仍须继续核查，不得凭空判通过/失败
