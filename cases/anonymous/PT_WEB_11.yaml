---
category: 基础设施
id: PT_WEB_11
name: 受控负载与可用性（公开服务）
description: 用 http-framework-test 与 execute-python-script 在明确负载上限内验证公开服务可用性、限流和停止后的恢复。
level: 高
group: anonymous
required: 专项授权负载下的可用性、时延、错误率及停止后恢复
conditional: 资源消耗型操作须独立授权；限流响应仅按既定策略评价，不要求一律出现 429
steps:
  - 执行准备：项目 AI 完整读取 PT_WEB_11 与共同/分组要求，在当前对话列出必测子项和触发依据；核对授权、正常对照、实际工具 schema 与原文输出方式，复用指导工具返回的本次目录，不要求用户运行命令或填写结果
  - 从用户或获准服务要求取得判定基线，登记并发、总量、持续时间、恢复窗口及停止阈值
  - 用 http-framework-test 采集正常样本，再用 execute-python-script 的 urllib.request/concurrent.futures 从低负载执行批准计划
  - 达到停止阈值立即停止提交，为在途请求设置超时并记录实际结束情况
  - 在批准窗口用 http-framework-test 观察恢复，汇总时延、失败率和关联影响，不重启服务
  - 判定与保存：项目 AI 逐子项对照本项 expected_results，关联实际操作、观察及 minimum_evidence 所需的真实文件；按共同要求保留失败和覆盖缺口，调用重写后的指导工具 save 保存 PT_WEB_11，核对返回路径与成功状态；保存错误先修正，不把计划或预览写成已完成原文
minimum_evidence: 专项授权与基线、负载计划/实际计数、响应时序及停止/恢复观察引用。 项目 AI 在实际调用中取得上述原文，保存或引用本次 evidence/raw/ 下的文件，并保留来源/步骤对应；已完成的目标操作、必要恢复与声明为完成的子项均须有相应真实引用，元数据/AI 摘要不能冒充原文。
expected_results:
  通过: 必测及已触发条件项完成，约定负载及恢复行为满足可用性/时延/错误率基线，不推断任意 DoS 防护
  失败: 授权负载内实测违反明确可用性或恢复基线，影响与测试有关联证据
  中断: 未确认失败，但缺专项授权、基线、必要样本或恢复观察。
