level: 高
group: anonymous
required: 目标范围与攻击面实际核查；存在适用入口时完成：本轮约定反射入口及 DOM source/sink 的输入与执行边界
conditional: （本共同要求优先：可选机制不存在时完成攻击面核查并停止以下仅适用分支；此后的策略/规则取本项默认基线和实际网络观察，不向用户索要未必存在的文档）变体按真实上下文选择；约定反射/DOM 执行边界须经已有浏览器取得正常及变体运行观察，静态分析只辅助定位
steps:
  - 执行准备：项目 AI 完整读取 PT_WEB_08 与共同/分组要求，在当前对话列出必测子项和触发依据；核对授权、正常对照、实际工具 schema 与原文输出方式，复用指导工具返回的本次目录，不要求用户运行命令或填写结果
  - 默认安全基线：非可信输入须保持数据语义，不得在浏览器成为脚本；分别发现反射和DOM输入路径。执行：从实际匿名页面、表单、查询参数和脚本发现反射/DOM入口，列出完整同源资源覆盖；有路径时使用无害执行标记与正常浏览器对照
  - 攻击面核查：读取本轮匿名及认证资源清单、链接/表单/脚本/实际网络记录，探测与本项相关的同源候选入口并对照正常页和随机不存在路径；通过真实授权网络请求补充入口与行为证据。记录实际覆盖和每个候选的结果，不以单个404、登录页、工具无告警、语言指纹或DVWA惯例证明不存在。确认不使用对应机制后停止不适用攻击步骤，将攻击面核查作为must_complete=true的实际验证子项；无法确认时继续补查，只有环境阻塞才中断
  - 提交正常与无害标记变体，保存完整响应及 HTML/属性/脚本上下文；dalfox 仅发现候选
  - 项目 AI 用 execute-python-script 核对 JS source/sink 并驱动已有浏览器，在正常页面运行条件下提交无害标记、记录执行事件与输入上下文，分别验证约定反射/DOM 路径；CSP/静态分析仅辅助，浏览器故障先修正
  - 分别核对两类覆盖与证据，排除仅反射回显、静态关键词命中或浏览器故障
  - 判定与保存：项目 AI 逐子项对照本项 expected_results，关联实际操作、观察及 minimum_evidence 所需的真实文件；按共同要求保留失败和覆盖缺口，调用banma_pentest_run_cases save 保存 PT_WEB_08，核对返回路径与成功状态；保存错误先修正，不把计划或预览写成已完成原文
minimum_evidence: 本项默认基线引用、实际目标与入口核查清单、已探测候选及正常/不存在路径对照原文；入口/上下文清单、正常/变体原始响应、DOM 数据流、实际浏览器执行或阻止事件及本次文件引用。 项目 AI 在实际调用中取得上述原文，保存或引用本次 evidence/raw/ 下的文件，并保留来源/步骤对应；已完成的目标操作、必要恢复与声明为完成的子项均须有相应真实引用，元数据/AI 摘要不能冒充原文。
expected_results:
  通过: 必测及已触发条件项完成，约定两类验证完成，已测输入无非预期脚本执行且有效控制有证据；CSP 不强制禁止合法内联脚本；依据本项默认安全基线及真实观察判定，范围限于本轮已完整核查内容；或完成攻击面核查确认无适用入口/未使用对应机制，记录“通过（攻击面不适用）”的理由和原文，不声称该机制的防护已验证
  失败: 真实浏览器在有效页面/角色/输入对照下执行了非预期脚本，效果可归因于本项输入；不需要另行用户策略文档才能确认违反本项默认安全基线
  中断: 仅在未证实失败且实际工具/执行环境故障经修正或等效工具重试仍阻止必要验证时中断，记录失败调用、原文及补救；缺策略文档、目标没有该功能、未提供可选凭据或首次采集不足不是中断理由。未知仍须继续核查，不得凭空判通过/失败
