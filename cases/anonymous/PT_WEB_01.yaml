---
category: 信息泄露
id: PT_WEB_01
name: 登录接口口令尝试防护
description: 用 http-framework-test 逐次提交有限口令候选，按明确的次数、窗口及恢复策略验证登录防猜测控制。
level: 高
group: anonymous
required: 真实登录对照、失败尝试限制及恢复
conditional: 创建账号仅在获授权时进行；阈值验证不得超过本轮共享口令尝试上限（最多 30 次）
steps:
  - 执行准备：项目 AI 完整读取 PT_WEB_01 与共同/分组要求，在当前对话列出必测子项和触发依据；核对授权、正常对照、实际工具 schema 与原文输出方式，复用指导工具返回的本次目录，不要求用户运行命令或填写结果
  - 从用户或获准登录策略资料取得计数维度、阈值与窗口，登记候选数、请求上限及停止条件
  - 用 http-framework-test 取得字段、匿名会话及 CSRF，验证专用账号正常登录
  - 项目 AI 逐次调用 http-framework-test 提交批准候选，记录共享计数、时间、响应与实际限制作效；出现锁定、挑战或 429 立即停止口令提交，以已有输出或无额外口令尝试的获准状态查询核对限制，不能为证明限制再超出停止边界
  - 在批准恢复窗口复核正常登录，execute-python-script 汇总实际限制与恢复，单独记录凭证是否被接受
  - 判定与保存：项目 AI 逐子项对照本项 expected_results，关联实际操作、观察及 minimum_evidence 所需的真实文件；按共同要求保留失败和覆盖缺口，调用重写后的指导工具 save 保存 PT_WEB_01，核对返回路径与成功状态；保存错误先修正，不把计划或预览写成已完成原文
minimum_evidence: 策略来源、正常登录、逐次失败响应与时间、限制效果和恢复响应引用。 项目 AI 在实际调用中取得上述原文，保存或引用本次 evidence/raw/ 下的文件，并保留来源/步骤对应；已完成的目标操作、必要恢复与声明为完成的子项均须有相应真实引用，元数据/AI 摘要不能冒充原文。
expected_results:
  通过: 必测及已触发条件项完成，达到可验证阈值后的尝试被有效限制，正常登录及恢复符合策略；猜中凭证不单独说明防猜测失效
  失败: 在有效计数与窗口内实测突破既定限制，或恢复行为违反明确策略
  中断: 未确认失败，但缺正常账号、策略、阈值授权量或限制/恢复观察，有限未命中不能证明口令安全。
