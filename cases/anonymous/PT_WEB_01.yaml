---
category: 信息泄露
id: PT_WEB_01
name: 登录接口口令尝试防护
description: 用 http-framework-test 逐次提交有限口令候选，按明确的次数、窗口及恢复策略验证登录防猜测控制。
level: 高
group: anonymous
required: 目标范围与攻击面实际核查；存在适用入口时完成：真实登录对照、失败尝试限制及恢复
conditional: 不新增独立注册；候选与默认凭据尝试共享最多30次，锁定/挑战/429立即停止；明示更严格限制优先
steps:
  - 执行准备：项目 AI 完整读取 PT_WEB_01 与共同/分组要求，在当前对话列出必测子项和触发依据；核对授权、正常对照、实际工具 schema 与原文输出方式，复用指导工具返回的本次目录，不要求用户运行命令或填写结果
  - 默认安全基线：登录防猜测须有实际限速、挑战或锁定；本套默认探测预算为同一账号60秒内最多30次错误口令，出现控制即停止；这是假设明确的本套有限验证口径，不是通用产品阈值。执行：取得真实登录字段和正常身份对照，登记共享候选数与时间；优先读取实际限速配置，未取得配置时按本项默认预算执行，不等待用户提供阈值
  - 覆盖核查：基于本项默认安全基线与实际目标入口完成必测，不以缺外部策略资料停止；必要时读取获准本机靶机实现补充对照，发现任一确证失败保留失败，其余覆盖继续记录
  - 用 http-framework-test 取得字段、匿名会话及 CSRF，验证专用账号正常登录
  - 项目 AI 逐次调用 http-framework-test 提交批准候选，记录共享计数、时间、响应与实际限制作效；出现锁定、挑战或 429 立即停止口令提交，以已有输出或无额外口令尝试的获准状态查询核对限制，不能为证明限制再超出停止边界
  - 在批准恢复窗口复核正常登录，execute-python-script 汇总实际限制与恢复，单独记录凭证是否被接受
  - 判定与保存：项目 AI 逐子项对照本项 expected_results，关联实际操作、观察及 minimum_evidence 所需的真实文件；按共同要求保留失败和覆盖缺口，调用banma_pentest_run_cases save 保存 PT_WEB_01，核对返回路径与成功状态；保存错误先修正，不把计划或预览写成已完成原文
minimum_evidence: 本项默认基线引用、实际目标与入口核查清单、已探测候选及正常/不存在路径对照原文；策略来源、正常登录、逐次失败响应与时间、限制效果和恢复响应引用。 项目 AI 在实际调用中取得上述原文，保存或引用本次 evidence/raw/ 下的文件，并保留来源/步骤对应；已完成的目标操作、必要恢复与声明为完成的子项均须有相应真实引用，元数据/AI 摘要不能冒充原文。
expected_results:
  通过: 必测及已触发条件项完成，达到可验证阈值后的尝试被有效限制，正常登录及恢复符合策略；猜中凭证不单独说明防猜测失效；依据本项默认安全基线及真实观察判定，范围限于本轮已完整核查内容
  失败: 按默认60秒最多30次错误口令预算完成同一账号有效失败尝试仍无任何限速、挑战或锁定；或实测突破已知限制/恢复规则。有限未猜中不证明口令安全
  中断: 仅在未证实失败且实际工具/执行环境故障经修正或等效工具重试仍阻止必要验证时中断，记录失败调用、原文及补救；缺策略文档、目标没有该功能、未提供可选凭据或首次采集不足不是中断理由。未知仍须继续核查，不得凭空判通过/失败
