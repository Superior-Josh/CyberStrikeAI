---
category: 信息泄露
id: PT_WEB_06
name: WAF 防护绕过
description: 用 wafw00f、nmap、nuclei 确认 WAF，再用 http-framework-test、sqlmap 或 dalfox 对照验证受保护入口的绕过。
level: 高
group: anonymous
required: WAF 受保护入口、正常/被拦截请求和变体效果对照
conditional: SQL/XSS 变体按真实入口选择工具；需要 XSS 效果判定时须有已有浏览器的实际执行观察，不以静态候选代替
steps:
  - 执行准备：项目 AI 完整读取 PT_WEB_06 与共同/分组要求，在当前对话列出必测子项和触发依据；核对授权、正常对照、实际工具 schema 与原文输出方式，复用指导工具返回的本次目录，不要求用户运行命令或填写结果
  - 项目 AI 读取已提供/获准资料并调用 wafw00f（或 nmap/nuclei 适用检测）确认 WAF、受保护入口与应拦截行为；仅指纹命中不证明具体拦截由 WAF 产生，登记获准变体及请求上限
  - 用 http-framework-test 建立正常请求与确被 WAF 限制的攻击请求对照，排除后端自身拒绝
  - 在已确认入口提交批准编码/tamper 变体，保存 WAF 响应及后端效果
  - 项目 AI 用实际工具复核变体的后端效果与归因，XSS 效果须经已有浏览器观察；分别记录 WAF 放行、后端安全及未完成验证，不要求用户在浏览器中手工复现
  - 判定与保存：项目 AI 逐子项对照本项 expected_results，关联实际操作、观察及 minimum_evidence 所需的真实文件；按共同要求保留失败和覆盖缺口，调用重写后的指导工具 save 保存 PT_WEB_06，核对返回路径与成功状态；保存错误先修正，不把计划或预览写成已完成原文
minimum_evidence: WAF 与策略依据、正常/被拦截/变体响应及后端效果对照引用。 项目 AI 在实际调用中取得上述原文，保存或引用本次 evidence/raw/ 下的文件，并保留来源/步骤对应；已完成的目标操作、必要恢复与声明为完成的子项均须有相应真实引用，元数据/AI 摘要不能冒充原文。
expected_results:
  通过: 必测及已触发条件项完成，已测变体未绕过应有控制产生攻击效果；放行但后端安全单独记录
  失败: 批准变体绕过 WAF 并产生可复现攻击效果
  中断: 未确认失败，但缺可归因 WAF 拦截对照、有效入口或必要攻击效果证据。
