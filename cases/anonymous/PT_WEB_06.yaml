---
category: 信息泄露
id: PT_WEB_06
name: WAF 防护绕过
description: 用 wafw00f、nmap、nuclei 确认 WAF，再用 http-framework-test、sqlmap 或 dalfox 对照验证受保护入口的绕过。
level: 高
group: anonymous
required: 真实入口的正常/攻击/编码变体后端效果；存在可归因WAF时追加绕过对照
conditional: （本共同要求优先：可选机制不存在时完成攻击面核查并停止以下仅适用分支；此后的策略/规则取本项默认基线和实际网络观察，不向用户索要未必存在的文档）SQL/XSS 变体按真实入口选择工具；需要 XSS 效果判定时须有已有浏览器的实际执行观察，不以静态候选代替
steps:
  - 执行准备：项目 AI 完整读取 PT_WEB_06 与共同/分组要求，在当前对话列出必测子项和触发依据；核对授权、正常对照、实际工具 schema 与原文输出方式，复用指导工具返回的本次目录，不要求用户运行命令或填写结果
  - 默认安全基线：WAF是可选实现；验证应用是否拒绝有效攻击及编码变体，应用自身有效防护可通过；确认攻击生效失败，缺少WAF指纹本身不构成失败。执行：发现授权入口，用正常和适用无害攻击建立应用效果对照；存在可归因WAF拦截时执行绕过对照，否则直接验证应用边界并注明未验证WAF专有机制
  - 覆盖核查：从实际页面、参数及真实正常/攻击网络响应发现适用攻击入口；无WAF时仍完成应用正常/攻击/编码变体效果验证，不以WAF未部署直接通过或中断
  - 用http-framework-test建立正常与适用无害攻击对照，核对真实后端效果；存在可归因WAF阻断时记录阻断请求，否则以应用防护对照继续，不要求先出现WAF拦截
  - 存在WAF拦截则提交有限编码/tamper变体并复核后端效果；无WAF则核对应用对等价攻击输入的效果，不把无WAF误写成攻击面不存在
  - 项目 AI 用实际工具复核变体的后端效果与归因，XSS 效果须经已有浏览器观察；分别记录 WAF 放行、后端安全及未完成验证，不要求用户在浏览器中手工复现
  - 判定与保存：项目 AI 逐子项对照本项 expected_results，关联实际操作、观察及 minimum_evidence 所需的真实文件；按共同要求保留失败和覆盖缺口，调用banma_pentest_run_cases save 保存 PT_WEB_06，核对返回路径与成功状态；保存错误先修正，不把计划或预览写成已完成原文
minimum_evidence: 本项默认基线引用、实际目标与入口核查清单、已探测候选及正常/不存在路径对照原文；WAF 与策略依据、正常/被拦截/变体响应及后端效果对照引用。 项目 AI 在实际调用中取得上述原文，保存或引用本次 evidence/raw/ 下的文件，并保留来源/步骤对应；已完成的目标操作、必要恢复与声明为完成的子项均须有相应真实引用，元数据/AI 摘要不能冒充原文。
expected_results:
  通过: 完成真实入口正常/攻击/编码变体效果对照，应用在已测范围未接受有效攻击；存在可归因WAF时同时完成其适用绕过对照，无WAF本身不影响应用验证结论
  失败: 适用有效攻击或编码变体经真实后端/浏览器效果复核生效，控制失效；只有WAF放行而应用安全不判失败
  中断: 仅在未证实失败且实际工具/执行环境故障经修正或等效工具重试仍阻止必要验证时中断，记录失败调用、原文及补救；缺策略文档、目标没有该功能、未提供可选凭据或首次采集不足不是中断理由。未知仍须继续核查，不得凭空判通过/失败
