---
category: 信息泄露
id: PT_WEB_04
name: 端口扫描
description: 用 rustscan/masscan 与 nmap 检查已授权 TCP/UDP 范围内的开放端口，按业务基线核对暴露面。
level: 中
group: anonymous
required: 约定 TCP 范围扫描及开放服务核对
conditional: UDP 仅在授权且具备权限时纳入；1-65535 仅在全端口授权时扫描
steps:
  - 执行准备：项目 AI 完整读取 PT_WEB_04 与共同/分组要求，在当前对话列出必测子项和触发依据；核对授权、正常对照、实际工具 schema 与原文输出方式，复用指导工具返回的本次目录，不要求用户运行命令或填写结果
  - 取得用户或获准部署资料的开放端口基线，登记主机、协议、端口、速率及时间窗口
  - 用 nmap 扫描批准范围；rustscan 或 masscan 可替代 TCP 发现阶段，不重复要求全部工具
  - 用 nmap 复核开放端口服务，扫描已纳入的 UDP 范围
  - execute-python-script 对照开放清单，分别记录 open、closed、filtered 与未完成范围
  - 判定与保存：项目 AI 逐子项对照本项 expected_results，关联实际操作、观察及 minimum_evidence 所需的真实文件；按共同要求保留失败和覆盖缺口，调用重写后的指导工具 save 保存 PT_WEB_04，核对返回路径与成功状态；保存错误先修正，不把计划或预览写成已完成原文
minimum_evidence: 授权范围、业务开放基线、扫描参数及原始端口/服务输出引用。 项目 AI 在实际调用中取得上述原文，保存或引用本次 evidence/raw/ 下的文件，并保留来源/步骤对应；已完成的目标操作、必要恢复与声明为完成的子项均须有相应真实引用，元数据/AI 摘要不能冒充原文。
expected_results:
  通过: 必测及已触发条件项完成，约定范围扫描完成，已确认开放服务符合业务基线；未测范围不推断关闭
  失败: 复核证实存在基线禁止的开放服务
  中断: 未确认失败，但缺开放基线、必要扫描权限或范围未完成；filtered 仅记录观测状态。
