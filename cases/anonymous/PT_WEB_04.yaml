---
category: 信息泄露
id: PT_WEB_04
name: 端口扫描
description: 用 rustscan/masscan 与 nmap 检查已授权 TCP/UDP 范围内的开放端口，按业务基线核对暴露面。
level: 中
group: anonymous
required: 目标范围与攻击面实际核查；存在适用入口时完成：约定 TCP 范围扫描及开放服务核对
conditional: （本共同要求优先：可选机制不存在时完成攻击面核查并停止以下仅适用分支；此后的策略/规则取本项默认基线和实际实现，不向用户索要未必存在的文档）UDP 仅在授权且具备权限时纳入；1-65535 仅在全端口授权时扫描
steps:
  - 执行准备：项目 AI 完整读取 PT_WEB_04 与共同/分组要求，在当前对话列出必测子项和触发依据；核对授权、正常对照、实际工具 schema 与原文输出方式，复用指导工具返回的本次目录，不要求用户运行命令或填写结果
  - 默认安全基线：只验证用户给出的ip:port及明确追加授权端口；已授权服务可正常开放，禁止额外端口探测；仅在已授权范围发现非预期管理/数据库服务时失败。执行：将用户给出的ip:port直接作为默认批准TCP范围，用nmap指定-p该端口并复核服务；未给其他端口/UDP授权时不扩展到常见端口或全端口
  - 覆盖核查：基于本项默认安全基线与实际目标入口完成必测，不以缺外部策略资料停止；必要时读取获准本机靶机实现补充对照，发现任一确证失败保留失败，其余覆盖继续记录
  - 用 nmap 扫描批准范围；rustscan 或 masscan 可替代 TCP 发现阶段，不重复要求全部工具
  - 用 nmap 复核开放端口服务，扫描已纳入的 UDP 范围
  - execute-python-script 对照开放清单，分别记录 open、closed、filtered 与未完成范围
  - 判定与保存：项目 AI 逐子项对照本项 expected_results，关联实际操作、观察及 minimum_evidence 所需的真实文件；按共同要求保留失败和覆盖缺口，调用banma_pentest_run_cases save 保存 PT_WEB_04，核对返回路径与成功状态；保存错误先修正，不把计划或预览写成已完成原文
minimum_evidence: 本项默认基线引用、实际目标与入口核查清单、已探测候选及正常/不存在路径对照原文；授权范围、业务开放基线、扫描参数及原始端口/服务输出引用。 项目 AI 在实际调用中取得上述原文，保存或引用本次 evidence/raw/ 下的文件，并保留来源/步骤对应；已完成的目标操作、必要恢复与声明为完成的子项均须有相应真实引用，元数据/AI 摘要不能冒充原文。
expected_results:
  通过: 必测及已触发条件项完成，约定范围扫描完成，已确认开放服务符合业务基线；未测范围不推断关闭；依据本项默认安全基线及真实观察判定，范围限于本轮已完整核查内容
  失败: 复核证实存在基线禁止的开放服务；不需要另行用户策略文档才能确认违反本项默认安全基线
  中断: 仅在未证实失败且实际工具/执行环境故障经修正或等效工具重试仍阻止必要验证时中断，记录失败调用、原文及补救；缺策略文档、目标没有该功能、未提供可选凭据或首次采集不足不是中断理由。未知仍须继续核查，不得凭空判通过/失败
