---
category: 信息泄露
id: PT_WEB_02
name: 客户端敏感信息泄露（匿名）
description: 用 http-framework-test、katana 与 execute-python-script 检查匿名可取得页面、JS、接口及客户端存储中的敏感信息。
level: 中
group: anonymous
required: 目标范围与攻击面实际核查；存在适用入口时完成：约定匿名页面、JS、接口的敏感内容检查
conditional: （本共同要求优先：可选机制不存在时完成攻击面核查并停止以下仅适用分支；此后的策略/规则取本项默认基线和实际实现，不向用户索要未必存在的文档）已测流程签发 Cookie 时检查用途与安全属性；存在客户端存储时检查实际存储，动态值须有已有浏览器观察
steps:
  - 执行准备：项目 AI 完整读取 PT_WEB_02 与共同/分组要求，在当前对话列出必测子项和触发依据；核对授权、正常对照、实际工具 schema 与原文输出方式，复用指导工具返回的本次目录，不要求用户运行命令或填写结果
  - 默认安全基线：秘密包括真实密码、会话秘密、私钥及非公开个人数据；公开资源地址不算秘密；认证Cookie须HttpOnly、HTTPS场景须Secure，跨站用途按实际流程判断SameSite。执行：从匿名首页、链接、脚本引用和可达接口递归整理同一授权服务资源清单；根据字段上下文与实际用途核对秘密及Cookie，不要求另行提供字段目录
  - 覆盖核查：基于本项默认安全基线与实际目标入口完成必测，不以缺外部策略资料停止；必要时读取获准本机靶机实现补充对照，发现任一确证失败保留失败，其余覆盖继续记录
  - 用 http-framework-test 的 download 保存资源，execute-python-script 检索并复核疑似凭证、个人数据及配置上下文
  - 项目 AI 用已有浏览器能力或原始响应核对适用 Cookie 的用途与 Secure/HttpOnly/SameSite；存在实际客户端存储时经 execute-python-script 驱动已有浏览器记录存储值来源，静态存储调用代码不能证明运行时值
  - 逐资源记录敏感性、实际值的脱敏摘要及来源，不包含认证后存储
  - 判定与保存：项目 AI 逐子项对照本项 expected_results，关联实际操作、观察及 minimum_evidence 所需的真实文件；按共同要求保留失败和覆盖缺口，调用banma_pentest_run_cases save 保存 PT_WEB_02，核对返回路径与成功状态；保存错误先修正，不把计划或预览写成已完成原文
minimum_evidence: 本项默认基线引用、实际目标与入口核查清单、已探测候选及正常/不存在路径对照原文；资源清单、实际响应/下载文件、疑似内容上下文及适用 Cookie/存储观察引用。 项目 AI 在实际调用中取得上述原文，保存或引用本次 evidence/raw/ 下的文件，并保留来源/步骤对应；已完成的目标操作、必要恢复与声明为完成的子项均须有相应真实引用，元数据/AI 摘要不能冒充原文。
expected_results:
  通过: 必测及已触发条件项完成，未暴露经确认秘密或非公开数据，适用 Cookie 和存储控制满足用途；依据本项默认安全基线及真实观察判定，范围限于本轮已完整核查内容
  失败: 匿名实测取得禁止公开的敏感内容，或适用 Cookie/存储控制实测违反基线；不需要另行用户策略文档才能确认违反本项默认安全基线
  中断: 仅在未证实失败且实际工具/执行环境故障经修正或等效工具重试仍阻止必要验证时中断，记录失败调用、原文及补救；缺策略文档、目标没有该功能、未提供可选凭据或首次采集不足不是中断理由。未知仍须继续核查，不得凭空判通过/失败
