---
category: 安全配置
id: PT_WEB_13
name: HTTP 安全头缺失检测
description: 用 httpx、http-framework-test、nuclei 与 execute-python-script 按页面用途和明确基线检查有效 HTTP 安全头。
level: 中
group: anonymous
required: 目标范围与攻击面实际核查；存在适用入口时完成：约定页面类型的生效 CSP、嵌入限制、HSTS 及 MIME 防护
conditional: （本共同要求优先：可选机制不存在时完成攻击面核查并停止以下仅适用分支；此后的策略/规则取本项默认基线和实际网络观察，不向用户索要未必存在的文档）各头按 HTML/API/错误响应用途适用；nuclei 仅补充发现
steps:
  - 执行准备：项目 AI 完整读取 PT_WEB_13 与共同/分组要求，在当前对话列出必测子项和触发依据；核对授权、正常对照、实际工具 schema 与原文输出方式，复用指导工具返回的本次目录，不要求用户运行命令或填写结果
  - 默认安全基线：HTML须有生效的脚本来源限制及禁止非可信嵌入策略，响应须有nosniff；HTTPS敏感服务须HSTS；等效生效策略可满足要求，不要求过时X-XSS-Protection。执行：采集同源登录、正常业务及错误HTML页面，按本项默认基线核对CSP、frame-ancestors/XFO、nosniff与适用HSTS，普通API不套用HTML脚本规则
  - 覆盖核查：基于本项默认安全基线与实际目标入口完成必测，不以缺外部策略资料停止；通过获准网络接口取得正常/变体响应补充对照，发现任一确证失败保留失败，其余覆盖继续记录
  - 用 http-framework-test（或 httpx）保存实际完整响应头及页面类型
  - 项目 AI 用 execute-python-script 逐响应核对实际生效 CSP、Report-Only、frame-ancestors 或适用 XFO、HSTS 与 MIME 防护，记录重复/冲突头及优先关系；头存在不等于策略有效
  - 逐页面复核缺失/无效控制，记录满足需求的等效策略及未覆盖响应
  - 判定与保存：项目 AI 逐子项对照本项 expected_results，关联实际操作、观察及 minimum_evidence 所需的真实文件；按共同要求保留失败和覆盖缺口，调用banma_pentest_run_cases save 保存 PT_WEB_13，核对返回路径与成功状态；保存错误先修正，不把计划或预览写成已完成原文
minimum_evidence: 本项默认基线引用、实际目标与入口核查清单、已探测候选及正常/不存在路径对照原文；页面与适用基线、响应头原文、指令/冲突核对引用。 项目 AI 在实际调用中取得上述原文，保存或引用本次 evidence/raw/ 下的文件，并保留来源/步骤对应；已完成的目标操作、必要恢复与声明为完成的子项均须有相应真实引用，元数据/AI 摘要不能冒充原文。
expected_results:
  通过: 必测及已触发条件项完成，所有约定适用头有效并符合基线；不强制固定 default-src 或同时具备 XFO 与 frame-ancestors；依据本项默认安全基线及真实观察判定，范围限于本轮已完整核查内容
  失败: 适用强制防护缺失或无效且违反明确基线，Report-Only 不能代替强制策略；不需要另行用户策略文档才能确认违反本项默认安全基线
  中断: 仅在未证实失败且实际工具/执行环境故障经修正或等效工具重试仍阻止必要验证时中断，记录失败调用、原文及补救；缺策略文档、目标没有该功能、未提供可选凭据或首次采集不足不是中断理由。未知仍须继续核查，不得凭空判通过/失败
