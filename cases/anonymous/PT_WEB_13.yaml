---
category: 安全配置
id: PT_WEB_13
name: HTTP 安全头缺失检测
description: 用 httpx、http-framework-test、nuclei 与 execute-python-script 按页面用途和明确基线检查有效 HTTP 安全头。
level: 中
group: anonymous
required: 约定页面类型的生效 CSP、嵌入限制、HSTS 及 MIME 防护
conditional: 各头按 HTML/API/错误响应用途适用；nuclei 仅补充发现
steps:
  - 执行准备：项目 AI 完整读取 PT_WEB_13 与共同/分组要求，在当前对话列出必测子项和触发依据；核对授权、正常对照、实际工具 schema 与原文输出方式，复用指导工具返回的本次目录，不要求用户运行命令或填写结果
  - 从用户或获准安全要求取得各页面适用基线，登记正常及错误页面
  - 用 http-framework-test（或 httpx）保存实际完整响应头及页面类型
  - 项目 AI 用 execute-python-script 逐响应核对实际生效 CSP、Report-Only、frame-ancestors 或适用 XFO、HSTS 与 MIME 防护，记录重复/冲突头及优先关系；头存在不等于策略有效
  - 逐页面复核缺失/无效控制，记录满足需求的等效策略及未覆盖响应
  - 判定与保存：项目 AI 逐子项对照本项 expected_results，关联实际操作、观察及 minimum_evidence 所需的真实文件；按共同要求保留失败和覆盖缺口，调用重写后的指导工具 save 保存 PT_WEB_13，核对返回路径与成功状态；保存错误先修正，不把计划或预览写成已完成原文
minimum_evidence: 页面与适用基线、响应头原文、指令/冲突核对引用。 项目 AI 在实际调用中取得上述原文，保存或引用本次 evidence/raw/ 下的文件，并保留来源/步骤对应；已完成的目标操作、必要恢复与声明为完成的子项均须有相应真实引用，元数据/AI 摘要不能冒充原文。
expected_results:
  通过: 必测及已触发条件项完成，所有约定适用头有效并符合基线；不强制固定 default-src 或同时具备 XFO 与 frame-ancestors
  失败: 适用强制防护缺失或无效且违反明确基线，Report-Only 不能代替强制策略
  中断: 未确认失败，但缺用途/基线、必要响应或策略无法判读。
