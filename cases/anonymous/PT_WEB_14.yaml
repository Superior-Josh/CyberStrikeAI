---
category: 安全配置
id: PT_WEB_14
name: 敏感文件/目录泄露
description: 用 ffuf、dirsearch、dirb、nikto、nuclei 与 http-framework-test 核对匿名是否能够读取不应公开的配置、备份或版本库内容。
level: 高
group: anonymous
required: 约定敏感路径的匿名读取与内容确认
conditional: 字典按授权资源选择；robots.txt 仅提供线索，扫描器可选其一或补充
steps:
  - 执行准备：项目 AI 完整读取 PT_WEB_14 与共同/分组要求，在当前对话列出必测子项和触发依据；核对授权、正常对照、实际工具 schema 与原文输出方式，复用指导工具返回的本次目录，不要求用户运行命令或填写结果
  - 从用户或获准部署资料确定不应公开内容，execute-python-script 整理路径字典、请求上限和速率
  - 用 ffuf、dirsearch 或 dirb 发现候选；nikto/nuclei 已安装 exposures 模板可补充
  - 用 http-framework-test 获取命中与随机不存在路径，核对真实内容和认证边界
  - 逐项确认配置、备份、版本库或内部文档敏感性，整理脱敏摘要与实际覆盖
  - 判定与保存：项目 AI 逐子项对照本项 expected_results，关联实际操作、观察及 minimum_evidence 所需的真实文件；按共同要求保留失败和覆盖缺口，调用重写后的指导工具 save 保存 PT_WEB_14，核对返回路径与成功状态；保存错误先修正，不把计划或预览写成已完成原文
minimum_evidence: 敏感性依据、字典/范围、命中及不存在路径响应原文引用。 项目 AI 在实际调用中取得上述原文，保存或引用本次 evidence/raw/ 下的文件，并保留来源/步骤对应；已完成的目标操作、必要恢复与声明为完成的子项均须有相应真实引用，元数据/AI 摘要不能冒充原文。
expected_results:
  通过: 必测及已触发条件项完成，批准路径检查完成，匿名不能取得禁止公开的敏感文件内容
  失败: 实测匿名可读取禁止公开的敏感内容
  中断: 未确认失败，但缺必要路径覆盖、内容证据或敏感性依据；统一页、公开文档及 robots.txt 不单独判失败。
