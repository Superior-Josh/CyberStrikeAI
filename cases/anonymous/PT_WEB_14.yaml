category: 安全配置
id: PT_WEB_14
name: 敏感文件/目录泄露
description: 用 ffuf、dirsearch、dirb、nikto、nuclei 与 http-framework-test 核对匿名是否能够读取不应公开的配置、备份或版本库内容。
level: 高
group: anonymous
required: 目标范围与攻击面实际核查；存在适用入口时完成：约定敏感路径的匿名读取与内容确认
conditional: （本共同要求优先：可选机制不存在时完成攻击面核查并停止以下仅适用分支；此后的策略/规则取本项默认基线和实际网络观察，不向用户索要未必存在的文档）字典按授权资源选择；robots.txt 仅提供线索，扫描器可选其一或补充
steps:
  - 默认安全基线：真实秘密配置、数据库备份、版本库及非公开内部文件不得匿名下载；robots和公开说明不单独失败。执行：根据页面路径、部署组件与有限常见敏感文件清单探测同源资源，保存实际字典与软404正常对照；从获准可读取的实际内容确认敏感性，靶机服务端源码/配置不读取
  - 覆盖核查：基于本项默认安全基线与实际目标入口完成必测，不以缺外部策略资料停止；通过获准网络接口取得正常/变体响应补充对照，发现任一确证失败保留失败，其余覆盖继续记录
  - 用 ffuf、dirsearch 或 dirb 核查批准候选；先检查实际请求行为，排除会下载或解析靶机服务端源码/配置的字典项与模板，不用自动扫描绕过禁止读取
  - 用 http-framework-test 核对获准资源与随机不存在路径的实际响应和认证边界；源码/配置候选仅可核查不返回内容的访问迹象，不用GET/Range下载正文，不以HTTP200或文件名证明秘密泄露
  - 仅依据获准取得的实际网络内容确认敏感性，整理脱敏摘要；禁止读取的源码/配置部分明确未覆盖，不将访问迹象当已证实泄露或安全
minimum_evidence: 本项默认基线引用、实际目标与入口核查清单、已探测候选及正常/不存在路径对照原文；敏感性依据、字典/范围、命中及不存在路径响应原文引用。 原文在实际操作中取得并自动关联本轮执行、步骤及子项；必要操作和恢复均保留真实来源，元数据或模型解释不能冒充原文。
expected_results:
  通过: 必测及已触发条件项完成，批准路径检查完成，匿名不能取得禁止公开的敏感文件内容；依据本项默认安全基线及真实观察判定，范围限于本轮已完整核查内容
  失败: 实测匿名可读取禁止公开的敏感内容；不需要另行用户策略文档才能确认违反本项默认安全基线
  中断: 仅在未证实失败且实际工具/执行环境故障经修正或等效工具重试仍阻止必要验证时中断，记录失败调用、原文及补救；缺策略文档、目标没有该功能、未提供可选凭据或首次采集不足不是中断理由。未知仍须继续核查，不得凭空判通过/失败
