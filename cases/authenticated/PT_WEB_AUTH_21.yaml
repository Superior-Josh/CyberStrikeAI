---
category: 数据安全
id: PT_WEB_AUTH_21
name: 敏感数据传输加密验证
description: 用 http-framework-test、nmap 与 execute-python-script 检查实际认证流程及敏感请求的加密、证书、认证 Cookie 属性和适用混合内容，分别记录 HTTP 入口与业务处理证据。
level: 高
group: authenticated
required: 目标范围与攻击面实际核查；存在适用入口时完成：约定登录/敏感请求 TLS、证书、HTTP 入口与传输行为
conditional: （本共同要求优先：可选机制不存在时完成攻击面核查并停止以下仅适用分支；此后的策略/规则取本项默认基线和实际实现，不向用户索要未必存在的文档）Cookie 架构须查安全属性；存在动态链路须观察；HTTP 业务处理须有效无秘密标记对照或获准实现证据
steps:
  - 执行准备：项目 AI 完整读取 PT_WEB_AUTH_21 与共同/分组要求，在当前对话列出必测子项和触发依据；核对授权、正常对照、实际工具 schema 与原文输出方式，复用指导工具返回的本次目录，不要求用户运行命令或填写结果
  - 默认安全基线：登录及敏感请求须使用可信TLS，认证Cookie不得经明文自动发送；真实明文认证流程失败，不因服务仅支持HTTP中断。执行：发现实际登录/敏感接口及Cookie，采集表单与真实传输原文；仅核对授权端口，不要求另行TLS部署资料，不为验证重复发送秘密
  - 覆盖核查：基于本项默认安全基线与实际目标入口完成必测，不以缺外部策略资料停止；必要时读取获准本机靶机实现补充对照，发现任一确证失败保留失败，其余覆盖继续记录
  - 用 nmap TLS 脚本与 execute-python-script 默认 SSLContext 核对证书/主机名，http-framework-test 不带真实秘密请求 HTTP 并关闭跳转
  - 核对表单提交、Cookie Secure 及静态资源；存在动态链路时经已有浏览器观察请求与跳转，不以手工附加 Cookie 模拟自动携带
  - 项目 AI 仅在明确授权/可恢复且不发送真实秘密的条件下，通过现有工具以能保持其他业务前提有效的专用标记核对 HTTP 处理并恢复；或读取获准的对应实现/配置原文。不能安全构造对照时读取获准本机实现补证；只有实际环境阻塞且无已确认失败时中断，不要求用户手工发送认证明文
  - 分别核对 TLS、入口、Cookie、静态/动态及业务处理证据，标明未观察链路
  - 判定与保存：项目 AI 逐子项对照本项 expected_results，关联实际操作、观察及 minimum_evidence 所需的真实文件；按共同要求保留失败和覆盖缺口，调用banma_pentest_run_cases save 保存 PT_WEB_AUTH_21，核对返回路径与成功状态；保存错误先修正，不把计划或预览写成已完成原文
minimum_evidence: 本项默认基线引用、实际目标与入口核查清单、已探测候选及正常/不存在路径对照原文；传输基线/接口清单、正常请求、TLS/证书与 HTTP 响应、适用 Cookie/动态/业务及恢复引用。 项目 AI 在实际调用中取得上述原文，保存或引用本次 evidence/raw/ 下的文件，并保留来源/步骤对应；已完成的目标操作、必要恢复与声明为完成的子项均须有相应真实引用，元数据/AI 摘要不能冒充原文。
expected_results:
  通过: 必测及已触发条件项完成，已观察登录/敏感链路及适用 Cookie 满足 TLS 基线，HTTP 安全拒绝/跳转，业务不接受明文有有效对照或实现依据；依据本项默认安全基线及真实观察判定，范围限于本轮已完整核查内容
  失败: 实测敏感明文传输、违反基线的证书/混合内容/Cookie 携带或敏感业务接受明文处理；不需要另行用户策略文档才能确认违反本项默认安全基线
  中断: 仅在未证实失败且实际工具/执行环境故障经修正或等效工具重试仍阻止必要验证时中断，记录失败调用、原文及补救；缺策略文档、目标没有该功能、未提供可选凭据或首次采集不足不是中断理由。未知仍须继续核查，不得凭空判通过/失败
