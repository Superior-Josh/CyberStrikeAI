---
category: 注入
id: PT_WEB_AUTH_10
name: 命令注入
description: 用 http-framework-test、execute-python-script 与可用 dnslog 对照验证参数是否引发未授权系统命令执行。
level: 严重
group: authenticated
required: 真实命令参数的正常与批准无害变体效果对照
conditional: 回显/短延时/带外方法按入口预先选择；带外须批准 dnslog 通道并有正向对照与窗口
steps:
  - 执行准备：项目 AI 完整读取 PT_WEB_AUTH_10 与共同/分组要求，在当前对话列出必测子项和触发依据；核对授权、正常对照、实际工具 schema 与原文输出方式，复用指导工具返回的本次目录，不要求用户运行命令或填写结果
  - 用 http-framework-test 确认正常参数及行为，登记变体、重复样本数、最大延时与请求上限
  - 交替提交正常与变体，execute-python-script 比较回显和时延，排除业务等待与波动
  - 已纳入带外方法时，项目 AI 调用 dnslog operation=get_domain/get_records，独立正向探测与目标请求使用不同唯一标记，保存操作结果、时间和观察窗口；DNS 解析须与命令载荷/正常对照关联，不直接等于系统命令已执行
  - 复核可重复命令效果及归因，对照约定方法是否完成
  - 判定与保存：项目 AI 逐子项对照本项 expected_results，关联实际操作、观察及 minimum_evidence 所需的真实文件；按共同要求保留失败和覆盖缺口，调用重写后的指导工具 save 保存 PT_WEB_AUTH_10，核对返回路径与成功状态；保存错误先修正，不把计划或预览写成已完成原文
minimum_evidence: 正常/变体响应与时序、方法计划，适用带外正向/目标记录及窗口引用。 项目 AI 在实际调用中取得上述原文，保存或引用本次 evidence/raw/ 下的文件，并保留来源/步骤对应；已完成的目标操作、必要恢复与声明为完成的子项均须有相应真实引用，元数据/AI 摘要不能冒充原文。
expected_results:
  通过: 必测及已触发条件项完成，约定方法在有效对照下未产生非预期命令执行效果
  失败: 证实命令回显、重复可归因延时或已关联带外命令执行
  中断: 未确认失败，但缺正常入口、必要样本、可用带外通道/窗口或无法归因；一次延时或无回连不足。
