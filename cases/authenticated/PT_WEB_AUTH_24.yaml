---
category: 高级交互
id: PT_WEB_AUTH_24
name: WebSocket 安全
description: 通过 execute-python-script 的已验证协议客户端、http-framework-test 与 nmap 检查 WebSocket 握手、消息权限和传输边界。
level: 高
group: authenticated
required: 真实 WebSocket 正常协议、身份/消息权限及敏感传输
conditional: Origin 按浏览器与业务来源规则适用；输入变体按实际消费者选择，写消息需授权/恢复，wss 核对 TLS
steps:
  - 执行准备：项目 AI 完整读取 PT_WEB_AUTH_24 与共同/分组要求，在当前对话列出必测子项和触发依据；核对授权、正常对照、实际工具 schema 与原文输出方式，复用指导工具返回的本次目录，不要求用户运行命令或填写结果
  - 用 http-framework-test 读取页面/JS，确认授权地址、子协议、消息样例、身份/来源规则和可恢复对象
  - execute-python-script 使用已有协议库或已验证 socket/ssl 客户端，完成正确握手、Accept、掩码、长度及适用分片/ping/pong 的正常往返
  - 项目 AI 经已验证客户端在独立连接中分别改变身份、适用 Origin 和对象，记录握手、消息级拒绝/实际数据及获准状态写入；正常消息对照保持可用，不能由握手成功或 JSON 回显推断消息授权已验证
  - 提交批准输入并核对消费者实际效果，nmap TLS 脚本及默认 SSLContext 核对 wss；关闭连接并恢复写入
  - 判定与保存：项目 AI 逐子项对照本项 expected_results，关联实际操作、观察及 minimum_evidence 所需的真实文件；按共同要求保留失败和覆盖缺口，调用重写后的指导工具 save 保存 PT_WEB_AUTH_24，核对返回路径与成功状态；保存错误先修正，不把计划或预览写成已完成原文
minimum_evidence: 协议/权限规则、正常握手/消息、变体订阅/状态、适用 TLS 及关闭/恢复引用。 项目 AI 在实际调用中取得上述原文，保存或引用本次 evidence/raw/ 下的文件，并保留来源/步骤对应；已完成的目标操作、必要恢复与声明为完成的子项均须有相应真实引用，元数据/AI 摘要不能冒充原文。
expected_results:
  通过: 必测及已触发条件项完成，约定身份、来源及消息权限有效，敏感消息加密满足基线，输入无非预期效果
  失败: 未授权身份实测读取/写入禁止消息或对象，违反适用来源/传输规则或输入产生攻击效果
  中断: 未确认失败，但缺正常协议客户端、业务权限对照或必要消息/TLS 证据；JSON 回显不等同脚本执行。
