---
category: 高级交互
id: PT_WEB_AUTH_24
name: WebSocket 安全
description: 通过 execute-python-script 的已验证协议客户端、http-framework-test 与 nmap 检查 WebSocket 握手、消息权限和传输边界。
level: 高
group: authenticated
required: 目标范围与攻击面实际核查；存在适用入口时完成：真实 WebSocket 正常协议、身份/消息权限及敏感传输
conditional: （本共同要求优先：可选机制不存在时完成攻击面核查并停止以下仅适用分支；此后的策略/规则取本项默认基线和实际网络观察，不向用户索要未必存在的文档）Origin 按浏览器与业务来源规则适用；输入变体按实际消费者选择，写消息需授权/恢复，wss 核对 TLS
steps:
  - 执行准备：项目 AI 完整读取 PT_WEB_AUTH_24 与共同/分组要求，在当前对话列出必测子项和触发依据；核对授权、正常对照、实际工具 schema 与原文输出方式，复用指导工具返回的本次目录，不要求用户运行命令或填写结果
  - 默认安全基线：WebSocket须落实真实消息身份/对象权限，敏感消息须wss；握手成功不代表消息授权有效。执行：从页面/客户端脚本及实际网络核查WebSocket入口，存在时建立正确协议正常往返及变体对照；无该协议须保留实际核查依据
  - 攻击面核查：读取本轮匿名及认证资源清单、链接/表单/脚本/实际网络记录，探测与本项相关的同源候选入口并对照正常页和随机不存在路径；通过真实授权网络请求补充入口与行为证据。记录实际覆盖和每个候选的结果，不以单个404、登录页、工具无告警、语言指纹或DVWA惯例证明不存在。确认不使用对应机制后停止不适用攻击步骤，将攻击面核查作为must_complete=true的实际验证子项；无法确认时继续补查，只有环境阻塞才中断
  - execute-python-script 使用已有协议库或已验证 socket/ssl 客户端，完成正确握手、Accept、掩码、长度及适用分片/ping/pong 的正常往返
  - 项目 AI 经已验证客户端在独立连接中分别改变身份、适用 Origin 和对象，记录握手、消息级拒绝/实际数据及获准状态写入；正常消息对照保持可用，不能由握手成功或 JSON 回显推断消息授权已验证
  - 提交批准输入并核对消费者实际效果，nmap TLS 脚本及默认 SSLContext 核对 wss；关闭连接并恢复写入
  - 判定与保存：项目 AI 逐子项对照本项 expected_results，关联实际操作、观察及 minimum_evidence 所需的真实文件；按共同要求保留失败和覆盖缺口，调用banma_pentest_run_cases save 保存 PT_WEB_AUTH_24，核对返回路径与成功状态；保存错误先修正，不把计划或预览写成已完成原文
minimum_evidence: 本项默认基线引用、实际目标与入口核查清单、已探测候选及正常/不存在路径对照原文；协议/权限规则、正常握手/消息、变体订阅/状态、适用 TLS 及关闭/恢复引用。 项目 AI 在实际调用中取得上述原文，保存或引用本次 evidence/raw/ 下的文件，并保留来源/步骤对应；已完成的目标操作、必要恢复与声明为完成的子项均须有相应真实引用，元数据/AI 摘要不能冒充原文。
expected_results:
  通过: 必测及已触发条件项完成，约定身份、来源及消息权限有效，敏感消息加密满足基线，输入无非预期效果；依据本项默认安全基线及真实观察判定，范围限于本轮已完整核查内容；或完成攻击面核查确认无适用入口/未使用对应机制，记录“通过（攻击面不适用）”的理由和原文，不声称该机制的防护已验证
  失败: 未授权身份实测读取/写入禁止消息或对象，违反适用来源/传输规则或输入产生攻击效果；不需要另行用户策略文档才能确认违反本项默认安全基线
  中断: 仅在未证实失败且实际工具/执行环境故障经修正或等效工具重试仍阻止必要验证时中断，记录失败调用、原文及补救；缺策略文档、目标没有该功能、未提供可选凭据或首次采集不足不是中断理由。未知仍须继续核查，不得凭空判通过/失败
