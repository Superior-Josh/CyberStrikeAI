---
category: 注入
id: PT_WEB_AUTH_11
name: SSRF 服务端请求伪造
description: 用 http-framework-test、execute-python-script 与授权 dnslog 对照正常 URL 功能和禁止目的地，验证服务端请求边界。
level: 严重
group: authenticated
required: 目标范围与攻击面实际核查；存在适用入口时完成：正常 URL 功能及约定禁止目的地/协议边界对照
conditional: （本共同要求优先：可选机制不存在时完成攻击面核查并停止以下仅适用分支；此后的策略/规则取本项默认基线和实际网络观察，不向用户索要未必存在的文档）内网、元数据、文件目标须明确授权；存在重定向时核对最终目的地；带外须批准可用通道
steps:
  - 执行准备：项目 AI 完整读取 PT_WEB_AUTH_11 与共同/分组要求，在当前对话列出必测子项和触发依据；核对授权、正常对照、实际工具 schema 与原文输出方式，复用指导工具返回的本次目录，不要求用户运行命令或填写结果
  - 默认安全基线：用户URL不得越界读取本地秘密或访问非授权目的地；普通固定资源加载不是SSRF入口。执行：从真实表单及API网络行为发现可控服务端URL功能，使用授权端口内安全资源与无敏感内容的请求对照，不以文件读取载荷访问靶机源码/配置；不扫描宿主其他服务，不依赖外部带外才收口
  - 攻击面核查：读取本轮匿名及认证资源清单、链接/表单/脚本/实际网络记录，探测与本项相关的同源候选入口并对照正常页和随机不存在路径；通过真实授权网络请求补充入口与行为证据。记录实际覆盖和每个候选的结果，不以单个404、登录页、工具无告警、语言指纹或DVWA惯例证明不存在。确认不使用对应机制后停止不适用攻击步骤，将攻击面核查作为must_complete=true的实际验证子项；无法确认时继续补查，只有环境阻塞才中断
  - 用 http-framework-test 验证正常 URL，逐次提交批准禁止类别和适用重定向变体
  - 需要带外时用 dnslog 确认通道，分别标记正向探测与目标请求，记录窗口及实际访问内容
  - execute-python-script 关联目的地响应、错误与记录，区分解析、连接、读取和正常外连
  - 判定与保存：项目 AI 逐子项对照本项 expected_results，关联实际操作、观察及 minimum_evidence 所需的真实文件；按共同要求保留失败和覆盖缺口，调用banma_pentest_run_cases save 保存 PT_WEB_AUTH_11，核对返回路径与成功状态；保存错误先修正，不把计划或预览写成已完成原文
minimum_evidence: 本项默认基线引用、实际目标与入口核查清单、已探测候选及正常/不存在路径对照原文；业务边界、正常/禁止目的地响应、适用跳转链及带外通道/目标记录引用。 项目 AI 在实际调用中取得上述原文，保存或引用本次 evidence/raw/ 下的文件，并保留来源/步骤对应；已完成的目标操作、必要恢复与声明为完成的子项均须有相应真实引用，元数据/AI 摘要不能冒充原文。
expected_results:
  通过: 必测及已触发条件项完成，正常功能有效，已测禁止地址/协议及最终目的地被有效限制；依据本项默认安全基线及真实观察判定，范围限于本轮已完整核查内容；或完成攻击面核查确认无适用入口/未使用对应机制，记录“通过（攻击面不适用）”的理由和原文，不声称该机制的防护已验证
  失败: 证实服务端非预期访问禁止目的地或资源，效果与目标请求关联；不需要另行用户策略文档才能确认违反本项默认安全基线
  中断: 仅在未证实失败且实际工具/执行环境故障经修正或等效工具重试仍阻止必要验证时中断，记录失败调用、原文及补救；缺策略文档、目标没有该功能、未提供可选凭据或首次采集不足不是中断理由。未知仍须继续核查，不得凭空判通过/失败
