---
category: 注入
id: PT_WEB_AUTH_11
name: SSRF 服务端请求伪造
description: 用 http-framework-test、execute-python-script 与授权 dnslog 对照正常 URL 功能和禁止目的地，验证服务端请求边界。
level: 严重
group: authenticated
required: 正常 URL 功能及约定禁止目的地/协议边界对照
conditional: 内网、元数据、文件目标须明确授权；存在重定向时核对最终目的地；带外须批准可用通道
steps:
  - 执行准备：项目 AI 完整读取 PT_WEB_AUTH_11 与共同/分组要求，在当前对话列出必测子项和触发依据；核对授权、正常对照、实际工具 schema 与原文输出方式，复用指导工具返回的本次目录，不要求用户运行命令或填写结果
  - 从用户或获准业务资料取得允许/禁止目的地和协议，登记安全测试资源、变体及请求上限
  - 用 http-framework-test 验证正常 URL，逐次提交批准禁止类别和适用重定向变体
  - 需要带外时用 dnslog 确认通道，分别标记正向探测与目标请求，记录窗口及实际访问内容
  - execute-python-script 关联目的地响应、错误与记录，区分解析、连接、读取和正常外连
  - 判定与保存：项目 AI 逐子项对照本项 expected_results，关联实际操作、观察及 minimum_evidence 所需的真实文件；按共同要求保留失败和覆盖缺口，调用重写后的指导工具 save 保存 PT_WEB_AUTH_11，核对返回路径与成功状态；保存错误先修正，不把计划或预览写成已完成原文
minimum_evidence: 业务边界、正常/禁止目的地响应、适用跳转链及带外通道/目标记录引用。 项目 AI 在实际调用中取得上述原文，保存或引用本次 evidence/raw/ 下的文件，并保留来源/步骤对应；已完成的目标操作、必要恢复与声明为完成的子项均须有相应真实引用，元数据/AI 摘要不能冒充原文。
expected_results:
  通过: 必测及已触发条件项完成，正常功能有效，已测禁止地址/协议及最终目的地被有效限制
  失败: 证实服务端非预期访问禁止目的地或资源，效果与目标请求关联
  中断: 未确认失败，但缺业务边界、正常对照或必要目的地观察；DNS 解析不单独等于资源读取，无记录不证明未尝试。
