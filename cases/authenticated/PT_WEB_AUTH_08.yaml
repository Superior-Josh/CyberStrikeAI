---
category: 注入
id: PT_WEB_AUTH_08
name: SQL 注入（认证后接口）
description: 用 sqlmap、http-framework-test 与 execute-python-script 在有效认证及动态令牌条件下做查询注入对照。
level: 高
group: authenticated
required: 有效认证查询及已选注入方法的正常/变体对照
conditional: 动态 CSRF 按流程更新；布尔/报错/短延时方法预先选择，sqlmap 仅辅助检测
steps:
  - 执行准备：项目 AI 完整读取 PT_WEB_AUTH_08 与共同/分组要求，在当前对话列出必测子项和触发依据；核对授权、正常对照、实际工具 schema 与原文输出方式，复用指导工具返回的本次目录，不要求用户运行命令或填写结果
  - 用 http-framework-test 验证 Cookie/Token、动态 CSRF 与正常查询，登记参数/方法、重复样本数及请求/延时上限
  - 用 sqlmap 的 cookie、当前支持头/请求文件选项保持认证，设受控 level/risk；或直接提交批准变体
  - 项目 AI 在认证/CSRF 持续有效的条件下按计划交替重复正常、布尔真/假及已选短延时等变体，经 execute-python-script 汇总原始响应和时序；正常数据对照必须独立于会话过期/权限拒绝
  - 再次核对正常查询有效，排除会话过期、CSRF 错误、权限拒绝和随机波动
  - 判定与保存：项目 AI 逐子项对照本项 expected_results，关联实际操作、观察及 minimum_evidence 所需的真实文件；按共同要求保留失败和覆盖缺口，调用重写后的指导工具 save 保存 PT_WEB_AUTH_08，核对返回路径与成功状态；保存错误先修正，不把计划或预览写成已完成原文
minimum_evidence: 认证/CSRF 流程引用、参数与方法清单、前后正常响应、变体与时序样本引用。 项目 AI 在实际调用中取得上述原文，保存或引用本次 evidence/raw/ 下的文件，并保留来源/步骤对应；已完成的目标操作、必要恢复与声明为完成的子项均须有相应真实引用，元数据/AI 摘要不能冒充原文。
expected_results:
  通过: 必测及已触发条件项完成，认证前提持续有效，约定方法完成且无可归因注入效果
  失败: 有效认证查询对照下证实注入导致越界读取、逻辑改变或重复可归因效果
  中断: 未确认失败，但缺有效认证/CSRF、正常查询、必要样本或效果无法归因；扫描无告警不足。
