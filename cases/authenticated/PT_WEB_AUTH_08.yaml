---
category: 注入
id: PT_WEB_AUTH_08
name: SQL 注入（认证后接口）
description: 用 sqlmap、http-framework-test 与 execute-python-script 在有效认证及动态令牌条件下做查询注入对照。
level: 高
group: authenticated
required: 有效认证查询及已选注入方法的正常/变体对照
conditional: 动态 CSRF 按流程更新；布尔/报错/短延时方法预先选择，sqlmap 仅辅助检测
steps:
  - 用 http-framework-test 验证 Cookie/Token、动态 CSRF 与正常查询，登记参数/方法、重复样本数及请求/延时上限
  - 用 sqlmap 的 cookie、当前支持头/请求文件选项保持认证，设受控 level/risk；或直接提交批准变体
  - 用 http-framework-test 交替重复正常与变体，execute-python-script 汇总响应、数据与时延分布
  - 再次核对正常查询有效，排除会话过期、CSRF 错误、权限拒绝和随机波动
minimum_evidence: 认证/CSRF 流程引用、参数与方法清单、前后正常响应、变体与时序样本引用。
expected_results:
  通过: 必测及已触发条件项完成，认证前提持续有效，约定方法完成且无可归因注入效果
  失败: 有效认证查询对照下证实注入导致越界读取、逻辑改变或重复可归因效果
  中断: 未确认失败，但缺有效认证/CSRF、正常查询、必要样本或效果无法归因；扫描无告警不足。
