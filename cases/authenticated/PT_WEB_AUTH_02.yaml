---
category: 权限控制
id: PT_WEB_AUTH_02
name: 越权访问（垂直越权）
description: 用 http-framework-test 与 ffuf 对照有效普通用户和高权限操作，验证后端管理权限及获准角色变更。
level: 高
group: authenticated
required: 普通身份及真实高权限接口的读取权限对照
conditional: 管理操作与角色字段修改仅在写授权及可恢复对象具备时纳入；ffuf 仅辅助批准路径发现
steps:
  - 执行准备：项目 AI 完整读取 PT_WEB_AUTH_02 与共同/分组要求，在当前对话列出必测子项和触发依据；核对授权、正常对照、实际工具 schema 与原文输出方式，复用指导工具返回的本次目录，不要求用户运行命令或填写结果
  - 从用户或获准权限资料确定普通/高权限边界，建立高权限正常响应或足以确认接口行为的可靠资料对照
  - 用 http-framework-test 保持有效普通会话访问真实管理接口，核对内容与实际身份
  - 对已纳入的操作重放低权限请求，独立变更 role/userType 等字段并读取真实权限/状态
  - 核对禁止读取与操作效果，恢复角色/对象改动；execute-python-script 汇总只读与写入覆盖
  - 判定与保存：项目 AI 逐子项对照本项 expected_results，关联实际操作、观察及 minimum_evidence 所需的真实文件；按共同要求保留失败和覆盖缺口，调用重写后的指导工具 save 保存 PT_WEB_AUTH_02，核对返回路径与成功状态；保存错误先修正，不把计划或预览写成已完成原文
minimum_evidence: 角色与接口权限依据、高权限正常或可靠资料、低权限响应、适用状态及恢复引用。 项目 AI 在实际调用中取得上述原文，保存或引用本次 evidence/raw/ 下的文件，并保留来源/步骤对应；已完成的目标操作、必要恢复与声明为完成的子项均须有相应真实引用，元数据/AI 摘要不能冒充原文。
expected_results:
  通过: 必测及已触发条件项完成，普通身份不能读取禁止管理数据或完成高权限操作，适用字段篡改不改变服务端权限
  失败: 普通身份实测取得禁止数据、完成高权限操作或升权
  中断: 未确认失败，但缺可靠高权限对照、有效普通身份或必要效果证据；路径存在与普通账号 404 不足。
