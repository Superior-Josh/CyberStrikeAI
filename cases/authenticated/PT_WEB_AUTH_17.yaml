---
category: 注入
id: PT_WEB_AUTH_17
name: SSTI 服务端模板注入
description: 用 http-framework-test 与 execute-python-script 对照多组无害表达式，验证用户输入是否成为服务端模板代码。
level: 严重
group: authenticated
required: 目标范围与攻击面实际核查；存在适用入口时完成：服务端正常渲染与多组表达式/普通文本对照
conditional: （本共同要求优先：可选机制不存在时完成攻击面核查并停止以下仅适用分支；此后的策略/规则取本项默认基线和实际实现，不向用户索要未必存在的文档）编码变体按引擎与输入上下文选择；合法模板功能按业务权限边界评价，不扩展未授权命令
steps:
  - 执行准备：项目 AI 完整读取 PT_WEB_AUTH_17 与共同/分组要求，在当前对话列出必测子项和触发依据；核对授权、正常对照、实际工具 schema 与原文输出方式，复用指导工具返回的本次目录，不要求用户运行命令或填写结果
  - 默认安全基线：用户数据不得被非预期当作服务端模板表达式执行；合法主动模板功能须保持其权限边界。执行：从实际渲染功能和获准本地实现确定是否有模板输入路径，提交多组无害不同结果表达式及普通文本建立服务端求值对照
  - 攻击面核查：读取本轮匿名及认证资源清单、链接/表单/脚本/实际网络记录，探测与本项相关的同源候选入口并对照正常页和随机不存在路径；必要时读取获准本机靶机路由/实现补证。记录实际覆盖和每个候选的结果，不以单个404、登录页、工具无告警、语言指纹或DVWA惯例证明不存在。确认不使用对应机制后停止不适用攻击步骤，将攻击面核查作为must_complete=true的实际验证子项；无法确认时继续补查，只有环境阻塞才中断
  - 项目 AI 调用 http-framework-test 交替提交适用无害表达式（示例 {{7*7}}、${7*7}、<%=7*7%>）、不同结果表达式和普通文本；按真实引擎选择，不将示例全视为必测，也不发送 HTML 排版转义文本代替原始表达式
  - execute-python-script 核对响应求值位置，排除预存数字、客户端计算和输入回显；复核适用编码变体
  - 按实际模板用途对照非预期求值或越界，不从无结果推断沙箱/白名单实现
  - 判定与保存：项目 AI 逐子项对照本项 expected_results，关联实际操作、观察及 minimum_evidence 所需的真实文件；按共同要求保留失败和覆盖缺口，调用banma_pentest_run_cases save 保存 PT_WEB_AUTH_17，核对返回路径与成功状态；保存错误先修正，不把计划或预览写成已完成原文
minimum_evidence: 本项默认基线引用、实际目标与入口核查清单、已探测候选及正常/不存在路径对照原文；功能/权限依据、正常/多组表达式/文本响应、服务端求值归因引用。 项目 AI 在实际调用中取得上述原文，保存或引用本次 evidence/raw/ 下的文件，并保留来源/步骤对应；已完成的目标操作、必要恢复与声明为完成的子项均须有相应真实引用，元数据/AI 摘要不能冒充原文。
expected_results:
  通过: 必测及已触发条件项完成，约定表达式测试完成，无非预期服务端求值或超出批准模板边界；依据本项默认安全基线及真实观察判定，范围限于本轮已完整核查内容；或完成攻击面核查确认无适用入口/未使用对应机制，记录“通过（攻击面不适用）”的理由和原文，不声称该机制的防护已验证
  失败: 多组有效对照证实输入成为非预期服务端模板代码或越出批准边界；不需要另行用户策略文档才能确认违反本项默认安全基线
  中断: 仅在未证实失败且实际工具/执行环境故障经修正或等效工具重试仍阻止必要验证时中断，记录失败调用、原文及补救；缺策略文档、目标没有该功能、未提供可选凭据或首次采集不足不是中断理由。未知仍须继续核查，不得凭空判通过/失败
