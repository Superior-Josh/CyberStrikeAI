---
category: 注入
id: PT_WEB_AUTH_17
name: SSTI 服务端模板注入
description: 用 http-framework-test 与 execute-python-script 对照多组无害表达式，验证用户输入是否成为服务端模板代码。
level: 严重
group: authenticated
required: 服务端正常渲染与多组表达式/普通文本对照
conditional: 编码变体按引擎与输入上下文选择；合法模板功能按业务权限边界评价，不扩展未授权命令
steps:
  - 执行准备：项目 AI 完整读取 PT_WEB_AUTH_17 与共同/分组要求，在当前对话列出必测子项和触发依据；核对授权、正常对照、实际工具 schema 与原文输出方式，复用指导工具返回的本次目录，不要求用户运行命令或填写结果
  - 用 http-framework-test 确认正常渲染，从用户或获准功能资料确定是否允许模板表达式及权限边界
  - 项目 AI 调用 http-framework-test 交替提交适用无害表达式（示例 {{7*7}}、${7*7}、<%=7*7%>）、不同结果表达式和普通文本；按真实引擎选择，不将示例全视为必测，也不发送 HTML 排版转义文本代替原始表达式
  - execute-python-script 核对响应求值位置，排除预存数字、客户端计算和输入回显；复核适用编码变体
  - 按实际模板用途对照非预期求值或越界，不从无结果推断沙箱/白名单实现
  - 判定与保存：项目 AI 逐子项对照本项 expected_results，关联实际操作、观察及 minimum_evidence 所需的真实文件；按共同要求保留失败和覆盖缺口，调用重写后的指导工具 save 保存 PT_WEB_AUTH_17，核对返回路径与成功状态；保存错误先修正，不把计划或预览写成已完成原文
minimum_evidence: 功能/权限依据、正常/多组表达式/文本响应、服务端求值归因引用。 项目 AI 在实际调用中取得上述原文，保存或引用本次 evidence/raw/ 下的文件，并保留来源/步骤对应；已完成的目标操作、必要恢复与声明为完成的子项均须有相应真实引用，元数据/AI 摘要不能冒充原文。
expected_results:
  通过: 必测及已触发条件项完成，约定表达式测试完成，无非预期服务端求值或超出批准模板边界
  失败: 多组有效对照证实输入成为非预期服务端模板代码或越出批准边界
  中断: 未确认失败，但缺正常渲染、功能边界或服务端求值判读；边界无法安全验证时保留缺口。
