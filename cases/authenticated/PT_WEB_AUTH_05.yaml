---
category: 会话安全
id: PT_WEB_AUTH_05
name: 点击劫持
description: 用 http-framework-test、nuclei 与 execute-python-script 检查敏感页面是否阻止不可信来源嵌入。
level: 中
group: authenticated
required: 敏感页面的有效嵌入限制与合法来源规则
conditional: 头部策略缺失/冲突或动态嵌入行为不能判读时须用已有浏览器对照；nuclei 仅辅助
steps:
  - 从用户或获准页面用途/权限资料确定敏感交互与允许嵌入来源，用 http-framework-test 获取有效认证页面
  - execute-python-script 核对强制 frame-ancestors 或适用 XFO，区分 Report-Only、冲突及允许来源
  - 已触发行为验证时创建临时测试页，在已有浏览器观察合法和不可信来源嵌入及敏感交互可达性
  - 关联策略与行为结论，清理本轮临时资源，记录静态和浏览器覆盖
minimum_evidence: 页面敏感性/来源规则、有效响应头及适用嵌入/交互观察引用。
expected_results:
  通过: 必测及已触发条件项完成，有效策略或行为证据证明敏感页面限制不可信嵌入，合法嵌入符合规则
  失败: 证实不可信来源可嵌入敏感页面用于禁止交互，或适用嵌入限制明确违反基线
  中断: 未确认失败，但缺敏感页面/来源依据、有效认证响应或已触发浏览器对照。
