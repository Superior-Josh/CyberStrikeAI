---
category: 会话安全
id: PT_WEB_AUTH_05
name: 点击劫持
description: 用 http-framework-test、nuclei 与 execute-python-script 检查敏感页面是否阻止不可信来源嵌入。
level: 中
group: authenticated
required: 敏感页面的有效嵌入限制与合法来源规则
conditional: 头部策略缺失/冲突或动态嵌入行为不能判读时须用已有浏览器对照；nuclei 仅辅助
steps:
  - 执行准备：项目 AI 完整读取 PT_WEB_AUTH_05 与共同/分组要求，在当前对话列出必测子项和触发依据；核对授权、正常对照、实际工具 schema 与原文输出方式，复用指导工具返回的本次目录，不要求用户运行命令或填写结果
  - 从用户或获准页面用途/权限资料确定敏感交互与允许嵌入来源，用 http-framework-test 获取有效认证页面
  - execute-python-script 核对强制 frame-ancestors 或适用 XFO，区分 Report-Only、冲突及允许来源
  - 已触发行为验证时，由项目 AI 调用 execute-python-script 创建本轮临时测试页并驱动已有浏览器，记录合法/不可信来源嵌入、实际认证是否携带及危险交互可达性；不能把 Cookie 缺失导致空页面当作嵌入防护有效
  - 关联策略与行为结论，清理本轮临时资源，记录静态和浏览器覆盖
  - 判定与保存：项目 AI 逐子项对照本项 expected_results，关联实际操作、观察及 minimum_evidence 所需的真实文件；按共同要求保留失败和覆盖缺口，调用重写后的指导工具 save 保存 PT_WEB_AUTH_05，核对返回路径与成功状态；保存错误先修正，不把计划或预览写成已完成原文
minimum_evidence: 页面敏感性/来源规则、有效响应头及适用嵌入/交互观察引用。 项目 AI 在实际调用中取得上述原文，保存或引用本次 evidence/raw/ 下的文件，并保留来源/步骤对应；已完成的目标操作、必要恢复与声明为完成的子项均须有相应真实引用，元数据/AI 摘要不能冒充原文。
expected_results:
  通过: 必测及已触发条件项完成，有效策略或行为证据证明敏感页面限制不可信嵌入，合法嵌入符合规则
  失败: 证实不可信来源可嵌入敏感页面用于禁止交互，或适用嵌入限制明确违反基线
  中断: 未确认失败，但缺敏感页面/来源依据、有效认证响应或已触发浏览器对照。
