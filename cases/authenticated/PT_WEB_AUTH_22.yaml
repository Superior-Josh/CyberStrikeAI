level: 高
group: authenticated
required: 目标范围与攻击面实际核查；存在适用入口时完成：约定角色的数据必要披露/脱敏及真实密码存储依据
conditional: （本共同要求优先：可选机制不存在时完成攻击面核查并停止以下仅适用分支；此后的策略/规则取本项默认基线和实际网络观察，不向用户索要未必存在的文档）不读取靶机源码、配置、数据库或内部存储资料；无法从授权网络证据核实密码依据时保留该必要部分未完成，不将数据脱敏结果扩展为存储安全
steps:
  - 执行准备：项目 AI 完整读取 PT_WEB_AUTH_22 与共同/分组要求，在当前对话列出必测子项和触发依据；核对授权、正常对照、实际工具 schema 与原文输出方式，复用指导工具返回的本次目录，不要求用户运行命令或填写结果
  - 默认安全基线：密码须使用带独立盐的自适应口令哈希；明文、可逆存储或MD5/SHA等快速哈希失败；非必要角色不得获得秘密字段。执行：由实际授权网络响应核查字段用途；口令算法/参数和盐处理仅在网络证据可真实核实时评价，无法核实列未完成，不读取内部资料补证；不得导出真实口令哈希或把显示掩码当安全存储
  - 覆盖核查：基于本项默认安全基线与实际目标入口完成必测，不以缺外部策略资料停止；通过获准网络接口取得正常/变体响应补充对照，发现任一确证失败保留失败，其余覆盖继续记录
  - 用 http-framework-test 采集本人及约定角色正常响应，execute-python-script 解析 json/re 并脱敏整理字段差异
  - 项目 AI 仅用真实授权网络证据核对密码算法、参数及加盐基线，不能调用exec或文件/容器工具读取内部资料，不能要求用户手工查库；显示掩码、登录成功或API无密码字段不能证明存储算法安全，缺密码依据按共同要求保留资料缺口
  - 分别记录数据披露与密码存储结果，不从显示掩码或 API 无密码字段反推存储安全
  - 判定与保存：项目 AI 逐子项对照本项 expected_results，关联实际操作、观察及 minimum_evidence 所需的真实文件；按共同要求保留失败和覆盖缺口，调用banma_pentest_run_cases save 保存 PT_WEB_AUTH_22，核对返回路径与成功状态；保存错误先修正，不把计划或预览写成已完成原文
minimum_evidence: 本项默认基线引用、实际目标与入口核查清单、已探测候选及正常/不存在路径对照原文；字段/角色及存储基线、各角色响应引用、真实算法/参数/加盐依据，不在摘要保存秘密。 项目 AI 在实际调用中取得上述原文，保存或引用本次 evidence/raw/ 下的文件，并保留来源/步骤对应；已完成的目标操作、必要恢复与声明为完成的子项均须有相应真实引用，元数据/AI 摘要不能冒充原文。
expected_results:
  通过: 必测及已触发条件项完成，约定角色只获取允许必要字段且脱敏符合规则，实际密码算法/参数/加盐满足基线；依据本项默认安全基线及真实观察判定，范围限于本轮已完整核查内容
  失败: 实测禁止数据披露或真实密码存储违反基线；不需要另行用户策略文档才能确认违反本项默认安全基线
  中断: 仅在未证实失败且实际工具/执行环境故障经修正或等效工具重试仍阻止必要验证时中断，记录失败调用、原文及补救；缺策略文档、目标没有该功能、未提供可选凭据或首次采集不足不是中断理由。未知仍须继续核查，不得凭空判通过/失败
