---
category: 数据安全
id: PT_WEB_AUTH_22
name: 密码存储与敏感数据脱敏验证
description: 用 http-framework-test、execute-python-script 与获准的 exec 文件读取，分别验证角色所需数据披露和密码存储依据。
level: 高
group: authenticated
required: 约定角色的数据必要披露/脱敏及真实密码存储依据
conditional: 实现/存储资料仅在获准可读时取得；无法取得密码依据须中断该必要部分，不覆盖其他数据存储保护
steps:
  - 执行准备：项目 AI 完整读取 PT_WEB_AUTH_22 与共同/分组要求，在当前对话列出必测子项和触发依据；核对授权、正常对照、实际工具 schema 与原文输出方式，复用指导工具返回的本次目录，不要求用户运行命令或填写结果
  - 从用户或获准业务/安全资料取得敏感字段、角色必要权限、脱敏和密码存储要求
  - 用 http-framework-test 采集本人及约定角色正常响应，execute-python-script 解析 json/re 并脱敏整理字段差异
  - 项目 AI 调用获准 exec 文件读取或已有资料工具取得实际密码算法、参数及加盐证据，经 execute-python-script 核对基线；无源码/存储访问授权时不扩大读取范围，不能要求用户手工查库，也不把显示掩码推断为安全存储
  - 分别记录数据披露与密码存储结果，不从显示掩码或 API 无密码字段反推存储安全
  - 判定与保存：项目 AI 逐子项对照本项 expected_results，关联实际操作、观察及 minimum_evidence 所需的真实文件；按共同要求保留失败和覆盖缺口，调用重写后的指导工具 save 保存 PT_WEB_AUTH_22，核对返回路径与成功状态；保存错误先修正，不把计划或预览写成已完成原文
minimum_evidence: 字段/角色及存储基线、各角色响应引用、真实算法/参数/加盐依据，不在摘要保存秘密。 项目 AI 在实际调用中取得上述原文，保存或引用本次 evidence/raw/ 下的文件，并保留来源/步骤对应；已完成的目标操作、必要恢复与声明为完成的子项均须有相应真实引用，元数据/AI 摘要不能冒充原文。
expected_results:
  通过: 必测及已触发条件项完成，约定角色只获取允许必要字段且脱敏符合规则，实际密码算法/参数/加盐满足基线
  失败: 实测禁止数据披露或真实密码存储违反基线
  中断: 未确认失败，但缺角色/脱敏规则、必要响应或实际密码存储依据。
