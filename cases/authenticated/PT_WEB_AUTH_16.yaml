---
category: 注入
id: PT_WEB_AUTH_16
name: 服务端原型链污染
description: 用 http-framework-test 与 execute-python-script 验证对象合并入口在当前请求及可观察后续对象中的原型污染效果。
level: 高
group: authenticated
required: 服务端真实合并入口及可观察对象的污染对照
conditional: 独立对象/后续请求按实际作用范围纳入；权限影响仅获授权后验证，不覆盖客户端原型污染
steps:
  - 执行准备：项目 AI 完整读取 PT_WEB_AUTH_16 与共同/分组要求，在当前对话列出必测子项和触发依据；核对授权、正常对照、实际工具 schema 与原文输出方式，复用指导工具返回的本次目录，不要求用户运行命令或填写结果
  - 用 http-framework-test 定位合并入口与正常对象，ffuf 可辅助；确认可观察属性与作用范围、清理方法
  - 项目 AI 经 execute-python-script 用真实嵌套键生成 __proto__ 与 constructor.prototype 无害标记 JSON，保留原始请求体，并构造普通同名字段对照；字符串字段名 constructor.prototype 不自动等同嵌套对象
  - 用 http-framework-test 提交变体，核对当前请求及已纳入独立对象/后续请求的属性来源
  - 区分回显、普通自有属性与真实原型变化，清理标记并核对；不由无跨请求效果排除局部污染
  - 判定与保存：项目 AI 逐子项对照本项 expected_results，关联实际操作、观察及 minimum_evidence 所需的真实文件；按共同要求保留失败和覆盖缺口，调用重写后的指导工具 save 保存 PT_WEB_AUTH_16，核对返回路径与成功状态；保存错误先修正，不把计划或预览写成已完成原文
minimum_evidence: 合并/观察入口依据、正常/同名字段/变体响应、属性来源及清理引用。 项目 AI 在实际调用中取得上述原文，保存或引用本次 evidence/raw/ 下的文件，并保留来源/步骤对应；已完成的目标操作、必要恢复与声明为完成的子项均须有相应真实引用，元数据/AI 摘要不能冒充原文。
expected_results:
  通过: 必测及已触发条件项完成，约定作用范围验证完成，输入不能非预期改变原型或其他对象属性
  失败: 实际出现可归因原型改变或其他对象属性污染，权限影响按实测范围记录
  中断: 未确认失败，但缺真实合并入口、正常对象、属性来源或必要作用范围观察。
