---
category: 注入
id: PT_WEB_AUTH_16
name: 服务端原型链污染
description: 用 http-framework-test 与 execute-python-script 验证对象合并入口在当前请求及可观察后续对象中的原型污染效果。
level: 高
group: authenticated
required: 目标范围与攻击面实际核查；存在适用入口时完成：服务端真实合并入口及可观察对象的污染对照
conditional: （本共同要求优先：可选机制不存在时完成攻击面核查并停止以下仅适用分支；此后的策略/规则取本项默认基线和实际实现，不向用户索要未必存在的文档）独立对象/后续请求按实际作用范围纳入；权限影响仅获授权后验证，不覆盖客户端原型污染
steps:
  - 执行准备：项目 AI 完整读取 PT_WEB_AUTH_16 与共同/分组要求，在当前对话列出必测子项和触发依据；核对授权、正常对照、实际工具 schema 与原文输出方式，复用指导工具返回的本次目录，不要求用户运行命令或填写结果
  - 默认安全基线：用户对象合并不得改变其他对象或原型的继承属性；输入回显和自有属性不算污染。执行：从实际请求与获准本地实现确认服务端语言和对象合并入口；非原型对象机制经核查不适用，不能仅凭PHP Banner下结论
  - 攻击面核查：读取本轮匿名及认证资源清单、链接/表单/脚本/实际网络记录，探测与本项相关的同源候选入口并对照正常页和随机不存在路径；必要时读取获准本机靶机路由/实现补证。记录实际覆盖和每个候选的结果，不以单个404、登录页、工具无告警、语言指纹或DVWA惯例证明不存在。确认不使用对应机制后停止不适用攻击步骤，将攻击面核查作为must_complete=true的实际验证子项；无法确认时继续补查，只有环境阻塞才中断
  - 项目 AI 经 execute-python-script 用真实嵌套键生成 __proto__ 与 constructor.prototype 无害标记 JSON，保留原始请求体，并构造普通同名字段对照；字符串字段名 constructor.prototype 不自动等同嵌套对象
  - 用 http-framework-test 提交变体，核对当前请求及已纳入独立对象/后续请求的属性来源
  - 区分回显、普通自有属性与真实原型变化，清理标记并核对；不由无跨请求效果排除局部污染
  - 判定与保存：项目 AI 逐子项对照本项 expected_results，关联实际操作、观察及 minimum_evidence 所需的真实文件；按共同要求保留失败和覆盖缺口，调用banma_pentest_run_cases save 保存 PT_WEB_AUTH_16，核对返回路径与成功状态；保存错误先修正，不把计划或预览写成已完成原文
minimum_evidence: 本项默认基线引用、实际目标与入口核查清单、已探测候选及正常/不存在路径对照原文；合并/观察入口依据、正常/同名字段/变体响应、属性来源及清理引用。 项目 AI 在实际调用中取得上述原文，保存或引用本次 evidence/raw/ 下的文件，并保留来源/步骤对应；已完成的目标操作、必要恢复与声明为完成的子项均须有相应真实引用，元数据/AI 摘要不能冒充原文。
expected_results:
  通过: 必测及已触发条件项完成，约定作用范围验证完成，输入不能非预期改变原型或其他对象属性；依据本项默认安全基线及真实观察判定，范围限于本轮已完整核查内容；或完成攻击面核查确认无适用入口/未使用对应机制，记录“通过（攻击面不适用）”的理由和原文，不声称该机制的防护已验证
  失败: 实际出现可归因原型改变或其他对象属性污染，权限影响按实测范围记录；不需要另行用户策略文档才能确认违反本项默认安全基线
  中断: 仅在未证实失败且实际工具/执行环境故障经修正或等效工具重试仍阻止必要验证时中断，记录失败调用、原文及补救；缺策略文档、目标没有该功能、未提供可选凭据或首次采集不足不是中断理由。未知仍须继续核查，不得凭空判通过/失败
