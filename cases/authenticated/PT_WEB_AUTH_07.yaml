---
category: 会话安全
id: PT_WEB_AUTH_07
name: 并发会话控制与登出失效
description: 用 http-framework-test 与 execute-python-script 按既定单会话/全会话登出及并发上限验证会话控制。
level: 中
group: authenticated
required: 目标范围与攻击面实际核查；存在适用入口时完成：独立正常会话的登出失效、其他会话效果及适用并发淘汰对照
conditional: （本共同要求优先：可选机制不存在时完成攻击面核查并停止以下仅适用分支；此后的策略/规则取本项默认基线和实际网络观察，不向用户索要未必存在的文档）并发上限控制按实际部署策略纳入；没有上限要求须有策略依据，不能以未达到上限证明有效
steps:
  - 执行准备：项目 AI 完整读取 PT_WEB_AUTH_07 与共同/分组要求，在当前对话列出必测子项和触发依据；核对授权、正常对照、实际工具 schema 与原文输出方式，复用指导工具返回的本次目录，不要求用户运行命令或填写结果
  - 默认安全基线：登出的该会话须失效；默认不要求全会话登出或单账号只能一会话；仅存在明示上限时检验淘汰。执行：建立两个独立正常会话，默认按当前会话登出验证；从真实页面、网络响应或用户已明确的限制发现并发策略则核对，不因未知并发额度中断登出验证
  - 覆盖核查：基于本项默认安全基线与实际目标入口完成必测，不以缺外部策略资料停止；通过获准网络接口取得正常/变体响应补充对照，发现任一确证失败保留失败，其余覆盖继续记录
  - 按当前会话登出默认口径逐个建立真正独立的会话，记录实际身份及受保护资源；有明示并发上限时按已知规则核对，不从两个会话均有效推导违反单会话策略
  - 存在上限要求时逐次建立到阈值和一个越限会话，核对新旧权限与淘汰行为
  - execute-python-script 分别对照登出与并发策略，清理本轮会话并保存结果
  - 判定与保存：项目 AI 逐子项对照本项 expected_results，关联实际操作、观察及 minimum_evidence 所需的真实文件；按共同要求保留失败和覆盖缺口，调用banma_pentest_run_cases save 保存 PT_WEB_AUTH_07，核对返回路径与成功状态；保存错误先修正，不把计划或预览写成已完成原文
minimum_evidence: 本项默认基线引用、实际目标与入口核查清单、已探测候选及正常/不存在路径对照原文；会话策略、独立会话引用、登出前后权限及适用阈值/淘汰响应引用。 项目 AI 在实际调用中取得上述原文，保存或引用本次 evidence/raw/ 下的文件，并保留来源/步骤对应；已完成的目标操作、必要恢复与声明为完成的子项均须有相应真实引用，元数据/AI 摘要不能冒充原文。
expected_results:
  通过: 必测及已触发条件项完成，旧登出会话失去受保护权限，其他会话及适用并发限制符合策略；依据本项默认安全基线及真实观察判定，范围限于本轮已完整核查内容
  失败: 登出凭证仍获取受保护数据，或实测突破既定并发/淘汰规则；不需要另行用户策略文档才能确认违反本项默认安全基线
  中断: 仅在未证实失败且实际工具/执行环境故障经修正或等效工具重试仍阻止必要验证时中断，记录失败调用、原文及补救；缺策略文档、目标没有该功能、未提供可选凭据或首次采集不足不是中断理由。未知仍须继续核查，不得凭空判通过/失败
