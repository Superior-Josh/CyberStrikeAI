---
category: 会话安全
id: PT_WEB_AUTH_07
name: 并发会话控制与登出失效
description: 用 http-framework-test 与 execute-python-script 按既定单会话/全会话登出及并发上限验证会话控制。
level: 中
group: authenticated
required: 独立正常会话的登出失效、其他会话效果及适用并发淘汰对照
conditional: 并发上限控制按实际部署策略纳入；没有上限要求须有策略依据，不能以未达到上限证明有效
steps:
  - 执行准备：项目 AI 完整读取 PT_WEB_AUTH_07 与共同/分组要求，在当前对话列出必测子项和触发依据；核对授权、正常对照、实际工具 schema 与原文输出方式，复用指导工具返回的本次目录，不要求用户运行命令或填写结果
  - 从用户或获准会话策略取得单/全会话登出、适用并发上限及淘汰规则，登记会话数量授权
  - 项目 AI 用 http-framework-test 建立真正独立的会话，记录单会话策略造成的实际淘汰，不将复制同一 Cookie 当两个会话；选择登出前仍可正常获取受保护资源的会话执行登出，再重放该会话凭证并核对权限；其他会话按既定保留/淘汰策略单独对照，不能用已被淘汰会话的拒绝证明登出有效
  - 存在上限要求时逐次建立到阈值和一个越限会话，核对新旧权限与淘汰行为
  - execute-python-script 分别对照登出与并发策略，清理本轮会话并保存结果
  - 判定与保存：项目 AI 逐子项对照本项 expected_results，关联实际操作、观察及 minimum_evidence 所需的真实文件；按共同要求保留失败和覆盖缺口，调用重写后的指导工具 save 保存 PT_WEB_AUTH_07，核对返回路径与成功状态；保存错误先修正，不把计划或预览写成已完成原文
minimum_evidence: 会话策略、独立会话引用、登出前后权限及适用阈值/淘汰响应引用。 项目 AI 在实际调用中取得上述原文，保存或引用本次 evidence/raw/ 下的文件，并保留来源/步骤对应；已完成的目标操作、必要恢复与声明为完成的子项均须有相应真实引用，元数据/AI 摘要不能冒充原文。
expected_results:
  通过: 必测及已触发条件项完成，旧登出会话失去受保护权限，其他会话及适用并发限制符合策略
  失败: 登出凭证仍获取受保护数据，或实测突破既定并发/淘汰规则
  中断: 未确认失败，但缺登出策略、正常会话、适用阈值授权量或权限对照。按单会话策略淘汰的旧会话不作为仍有效会话对照，须保留实际淘汰依据。
