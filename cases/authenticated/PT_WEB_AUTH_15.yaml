---
category: 注入
id: PT_WEB_AUTH_15
name: 客户端验证绕过
description: 用 http-framework-test、ffuf 与 execute-python-script 将真实客户端规则映射到服务端字段和业务状态验证。
level: 中
group: authenticated
required: 真实客户端规则映射、正常/边界/非法值与服务端状态
conditional: 字段组合按实际业务规则纳入；ffuf 仅在批准有限字典中辅助
steps:
  - 执行准备：项目 AI 完整读取 PT_WEB_AUTH_15 与共同/分组要求，在当前对话列出必测子项和触发依据；核对授权、正常对照、实际工具 schema 与原文输出方式，复用指导工具返回的本次目录，不要求用户运行命令或填写结果
  - 用 http-framework-test 获取表单/JS，execute-python-script 关联客户端规则与服务端字段，登记变体与可恢复对象
  - 保持真实认证/CSRF，提交正常值并读取状态，确认业务对照有效
  - 逐次只变更一个因素测试边界、超界及已纳入组合，读取实际业务状态，不仅看提示
  - 对照客户端/业务规则整理服务端限制，恢复对象并核对
  - 判定与保存：项目 AI 逐子项对照本项 expected_results，关联实际操作、观察及 minimum_evidence 所需的真实文件；按共同要求保留失败和覆盖缺口，调用重写后的指导工具 save 保存 PT_WEB_AUTH_15，核对返回路径与成功状态；保存错误先修正，不把计划或预览写成已完成原文
minimum_evidence: 字段规则来源、正常与非法请求/响应、实际状态及恢复引用。 项目 AI 在实际调用中取得上述原文，保存或引用本次 evidence/raw/ 下的文件，并保留来源/步骤对应；已完成的目标操作、必要恢复与声明为完成的子项均须有相应真实引用，元数据/AI 摘要不能冒充原文。
expected_results:
  通过: 必测及已触发条件项完成，正常值有效，已测非法格式、范围和组合不能改变违反规则的持久状态
  失败: 绕过客户端后服务端实际接受违反业务规则的输入并改变状态
  中断: 未确认失败，但缺规则映射、正常对照、写授权或持久状态证据。
