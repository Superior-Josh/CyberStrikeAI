---
category: 注入
id: PT_WEB_AUTH_15
name: 客户端验证绕过
description: 用 http-framework-test、ffuf 与 execute-python-script 将真实客户端规则映射到服务端字段和业务状态验证。
level: 中
group: authenticated
required: 目标范围与攻击面实际核查；存在适用入口时完成：真实客户端规则映射、正常/边界/非法值与服务端状态
conditional: （本共同要求优先：可选机制不存在时完成攻击面核查并停止以下仅适用分支；此后的策略/规则取本项默认基线和实际网络观察，不向用户索要未必存在的文档）字段组合按实际业务规则纳入；ffuf 仅在批准有限字典中辅助
steps:
  - 执行准备：项目 AI 完整读取 PT_WEB_AUTH_15 与共同/分组要求，在当前对话列出必测子项和触发依据；核对授权、正常对照、实际工具 schema 与原文输出方式，复用指导工具返回的本次目录，不要求用户运行命令或填写结果
  - 默认安全基线：真实客户端声明的字段类型、长度及业务不变量须在服务端落实，不应仅靠JS拦截。执行：从实际表单/客户端JS及网络响应建立字段规则映射，以正常值和单因素边界变体核对真实状态，不要求用户另列规则
  - 攻击面核查：读取本轮匿名及认证资源清单、链接/表单/脚本/实际网络记录，探测与本项相关的同源候选入口并对照正常页和随机不存在路径；通过真实授权网络请求补充入口与行为证据。记录实际覆盖和每个候选的结果，不以单个404、登录页、工具无告警、语言指纹或DVWA惯例证明不存在。确认不使用对应机制后停止不适用攻击步骤，将攻击面核查作为must_complete=true的实际验证子项；无法确认时继续补查，只有环境阻塞才中断
  - 保持真实认证/CSRF，提交正常值并读取状态，确认业务对照有效
  - 逐次只变更一个因素测试边界、超界及已纳入组合，读取实际业务状态，不仅看提示
  - 对照客户端/业务规则整理服务端限制，恢复对象并核对
  - 判定与保存：项目 AI 逐子项对照本项 expected_results，关联实际操作、观察及 minimum_evidence 所需的真实文件；按共同要求保留失败和覆盖缺口，调用banma_pentest_run_cases save 保存 PT_WEB_AUTH_15，核对返回路径与成功状态；保存错误先修正，不把计划或预览写成已完成原文
minimum_evidence: 本项默认基线引用、实际目标与入口核查清单、已探测候选及正常/不存在路径对照原文；字段规则来源、正常与非法请求/响应、实际状态及恢复引用。 项目 AI 在实际调用中取得上述原文，保存或引用本次 evidence/raw/ 下的文件，并保留来源/步骤对应；已完成的目标操作、必要恢复与声明为完成的子项均须有相应真实引用，元数据/AI 摘要不能冒充原文。
expected_results:
  通过: 必测及已触发条件项完成，正常值有效，已测非法格式、范围和组合不能改变违反规则的持久状态；依据本项默认安全基线及真实观察判定，范围限于本轮已完整核查内容；或完成攻击面核查确认无适用入口/未使用对应机制，记录“通过（攻击面不适用）”的理由和原文，不声称该机制的防护已验证
  失败: 绕过客户端后服务端实际接受违反业务规则的输入并改变状态；不需要另行用户策略文档才能确认违反本项默认安全基线
  中断: 仅在未证实失败且实际工具/执行环境故障经修正或等效工具重试仍阻止必要验证时中断，记录失败调用、原文及补救；缺策略文档、目标没有该功能、未提供可选凭据或首次采集不足不是中断理由。未知仍须继续核查，不得凭空判通过/失败
