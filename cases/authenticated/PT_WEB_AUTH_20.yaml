category: 业务逻辑
id: PT_WEB_AUTH_20
name: GraphQL 特有漏洞
description: 用 http-framework-test 与 execute-python-script 验证 GraphQL 公开范围、查询资源预算及对象/字段权限。
level: 高
group: authenticated
required: 目标范围与攻击面实际核查；存在适用入口时完成：GraphQL 正常查询、公开范围、约定资源预算及字段/对象权限
conditional: （本共同要求优先：可选机制不存在时完成攻击面核查并停止以下仅适用分支；此后的策略/规则取本项默认基线和实际网络观察，不向用户索要未必存在的文档）深度/复杂度/别名/批量按真实支持方式纳入；跨账号对象需第二账号，未支持能力须有实际依据
steps:
  - 默认安全基线：GraphQL须落实对象/字段权限及已有资源预算；公开内省本身不算漏洞。执行：由页面、实际网络及常见同源路径核查真实GraphQL端点，存在时取得schema/权限规则并正常查询；不存在须有完整核查依据
  - 攻击面核查：读取本轮匿名及认证资源清单、链接/表单/脚本/实际网络记录，探测与本项相关的同源候选入口并对照正常页和随机不存在路径；通过真实授权网络请求补充入口与行为证据。记录实际覆盖和每个候选的结果，不以单个404、登录页、工具无告警、语言指纹或DVWA惯例证明不存在。确认不使用对应机制后停止不适用攻击步骤，将攻击面核查作为must_complete=true的实际验证子项；无法确认时继续补查，只有环境阻塞才中断
  - 用 http-framework-test 验证正常查询，execute-python-script 构造约定预算边界变体并逐次提交
  - 记录 data/errors、消耗和时延，在资源归属明确账号间核对禁止对象/字段访问与合法字段对照
  - 逐子项核对预算拒绝与真实数据权限，不把公开内省或受控批量一律判失败
minimum_evidence: 本项默认基线引用、实际目标与入口核查清单、已探测候选及正常/不存在路径对照原文；GraphQL 规则、正常及预算查询/响应、归属/合法字段与越权数据对照引用。 原文在实际操作中取得并自动关联本轮执行、步骤及子项；必要操作和恢复均保留真实来源，元数据或模型解释不能冒充原文。
expected_results:
  通过: 必测及已触发条件项完成，约定公开范围与资源预算符合基线，字段及对象权限有效；依据本项默认安全基线及真实观察判定，范围限于本轮已完整核查内容；或完成攻击面核查确认无适用入口/未使用对应机制，记录“通过（攻击面不适用）”的理由和原文，不声称该机制的防护已验证
  失败: 实测取得禁止对象/字段，或在有效预算对照下突破明确资源控制；不需要另行用户策略文档才能确认违反本项默认安全基线
  中断: 仅在未证实失败且实际工具/执行环境故障经修正或等效工具重试仍阻止必要验证时中断，记录失败调用、原文及补救；缺策略文档、目标没有该功能、未提供可选凭据或首次采集不足不是中断理由。未知仍须继续核查，不得凭空判通过/失败
