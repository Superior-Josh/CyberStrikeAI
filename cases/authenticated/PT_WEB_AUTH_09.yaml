level: 高
group: authenticated
required: 目标范围与攻击面实际核查；存在适用入口时完成：实际存储、真实触发页面/角色及脚本执行边界
conditional: （本共同要求优先：可选机制不存在时完成攻击面核查并停止以下仅适用分支；此后的策略/规则取本项默认基线和实际网络观察，不向用户索要未必存在的文档）查看角色按已约定显示范围纳入；dalfox 只辅助发现；必要触发观察由项目 AI 经已有浏览器完成
steps:
  - 执行准备：项目 AI 完整读取 PT_WEB_AUTH_09 与共同/分组要求，在当前对话列出必测子项和触发依据；核对授权、正常对照、实际工具 schema 与原文输出方式，复用指导工具返回的本次目录，不要求用户运行命令或填写结果
  - 默认安全基线：持久保存的非可信内容不得在真实查看角色浏览器执行脚本。执行：发现实际留言/资料等持久字段，选专用可恢复对象和无害标记，记录原值、查看角色、触发页面及恢复动作
  - 攻击面核查：读取本轮匿名及认证资源清单、链接/表单/脚本/实际网络记录，探测与本项相关的同源候选入口并对照正常页和随机不存在路径；通过真实授权网络请求补充入口与行为证据。记录实际覆盖和每个候选的结果，不以单个404、登录页、工具无告警、语言指纹或DVWA惯例证明不存在。确认不使用对应机制后停止不适用攻击步骤，将攻击面核查作为must_complete=true的实际验证子项；无法确认时继续补查，只有环境阻塞才中断
  - 用 http-framework-test 提交正常和批准无害标记内容，读回证明实际保存
  - 项目 AI 经 execute-python-script 驱动已有浏览器，以约定真实查看角色访问实际触发页面，保存无害标记执行事件、页面上下文及已存储值对应关系；静态净化特征或 URL 扫描不能代替必要触发观察
  - 恢复/删除内容并核对状态，区分安全富文本、普通回显与实际执行
  - 判定与保存：项目 AI 逐子项对照本项 expected_results，关联实际操作、观察及 minimum_evidence 所需的真实文件；按共同要求保留失败和覆盖缺口，调用banma_pentest_run_cases save 保存 PT_WEB_AUTH_09，核对返回路径与成功状态；保存错误先修正，不把计划或预览写成已完成原文
minimum_evidence: 本项默认基线引用、实际目标与入口核查清单、已探测候选及正常/不存在路径对照原文；原值/正常对照、提交/实际读回响应、真实触发页面/角色及无害标记执行或阻止事件、恢复状态文件引用。 项目 AI 在实际调用中取得上述原文，保存或引用本次 evidence/raw/ 下的文件，并保留来源/步骤对应；已完成的目标操作、必要恢复与声明为完成的子项均须有相应真实引用，元数据/AI 摘要不能冒充原文。
expected_results:
  通过: 必测及已触发条件项完成，已存储输入在约定页面/角色中不产生非预期脚本执行，编码/净化等控制有证据；依据本项默认安全基线及真实观察判定，范围限于本轮已完整核查内容；或完成攻击面核查确认无适用入口/未使用对应机制，记录“通过（攻击面不适用）”的理由和原文，不声称该机制的防护已验证
  失败: 已存储输入在真实浏览器查看场景引发可归因的非预期脚本执行；不需要另行用户策略文档才能确认违反本项默认安全基线
  中断: 仅在未证实失败且实际工具/执行环境故障经修正或等效工具重试仍阻止必要验证时中断，记录失败调用、原文及补救；缺策略文档、目标没有该功能、未提供可选凭据或首次采集不足不是中断理由。未知仍须继续核查，不得凭空判通过/失败
