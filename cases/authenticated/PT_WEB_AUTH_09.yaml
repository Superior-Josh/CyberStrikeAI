---
category: 注入
id: PT_WEB_AUTH_09
name: 存储型 XSS
description: 用 http-framework-test 保存并读回测试内容，结合 execute-python-script 的实际浏览器验证检查存储后触发的 XSS。
level: 高
group: authenticated
required: 实际存储、真实触发页面/角色及脚本执行边界
conditional: 不同查看角色按已约定显示范围纳入；dalfox 仅辅助，动态或充分替代证据须对应已存储内容
steps:
  - 确认写授权、专用账号及可恢复字段，登记原值、显示页面、查看角色与上下文
  - 用 http-framework-test 提交正常和批准无害标记内容，读回证明实际保存
  - 访问真实触发页面，execute-python-script 经已有浏览器观察执行或核对充分替代控制证据，关联角色及存储值
  - 恢复/删除内容并核对状态，区分安全富文本、普通回显与实际执行
minimum_evidence: 原值/正常对照、提交及读回响应、触发页面/角色、执行或充分控制证据和恢复引用。
expected_results:
  通过: 必测及已触发条件项完成，已存储输入在约定页面/角色中不产生非预期脚本执行，编码/净化等控制有证据
  失败: 已存储输入在真实查看场景引发非预期脚本执行或充分证据证实可执行注入
  中断: 未确认失败，但缺写授权、实际保存、触发条件或充分执行/控制证据；普通 URL 无告警不足。
