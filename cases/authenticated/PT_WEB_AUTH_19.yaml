---
category: 业务逻辑
id: PT_WEB_AUTH_19
name: API 限流与绕过
description: 用 http-framework-test 与 execute-python-script 按明确额度、维度和窗口检查 API 限流及有限绕过变体。
level: 中
group: authenticated
required: 实际API与限流攻击面核查；存在真实额度策略或高成本防滥用入口时完成阈值、共享额度及恢复对照
conditional: （本共同要求优先：可选机制不存在时完成攻击面核查并停止以下仅适用分支；此后的策略/规则取本项默认基线和实际网络观察，不向用户索要未必存在的文档）UA/测试 Token 等标识变体仅按已确认计数维度选择；来源伪造/代理切换须额外授权
steps:
  - 执行准备：项目 AI 完整读取 PT_WEB_AUTH_19 与共同/分组要求，在当前对话列出必测子项和触发依据；核对授权、正常对照、实际工具 schema 与原文输出方式，复用指导工具返回的本次目录，不要求用户运行命令或填写结果
  - 默认安全基线：限流须遵守真实配置维度/窗口，不得通过应共享标识绕过；无额度策略的普通低成本接口不强制任意速率限制。执行：从实际API响应及用户已明确的限制发现限流规则，存在时按已知阈值和获准预算验证；无策略时最多20次、并发不超过2的有限检查并核对是否属于登录/高成本入口，高成本入口使用本项基线或用户明确防滥用要求对照
  - 攻击面核查：读取本轮匿名及认证资源清单、链接/表单/脚本/实际网络记录，探测与本项相关的同源候选入口并对照正常页和随机不存在路径；通过真实授权网络请求补充入口与行为证据。记录实际覆盖和每个候选的结果，不以单个404、登录页、工具无告警、语言指纹或DVWA惯例证明不存在。确认不使用对应机制后停止不适用攻击步骤，将攻击面核查作为must_complete=true的实际验证子项；无法确认时继续补查，只有环境阻塞才中断
  - 存在网络观察或用户已明确的额度规则时用http-framework-test建立正常请求，经execute-python-script在预算内验证已知阈值；无额度策略的普通低成本接口完成有限行为核查并注明该限流攻击面不适用；登录防猜测仍由PT_WEB_01验证，高成本入口不得因此豁免真实防滥用要求
  - 同窗口测试应共享额度的批准标识变体，核对拒绝效果与实际业务状态，达到停止条件停止提交
  - 跨窗口观察恢复，按实际计数汇总，正常新身份或新窗口额度不当绕过
  - 判定与保存：项目 AI 逐子项对照本项 expected_results，关联实际操作、观察及 minimum_evidence 所需的真实文件；按共同要求保留失败和覆盖缺口，调用banma_pentest_run_cases save 保存 PT_WEB_AUTH_19，核对返回路径与成功状态；保存错误先修正，不把计划或预览写成已完成原文
minimum_evidence: 本项默认基线引用、实际目标与入口核查清单、已探测候选及正常/不存在路径对照原文；限流策略、正常/阈值/共享变体响应、请求计数/窗口时间及恢复引用。 项目 AI 在实际调用中取得上述原文，保存或引用本次 evidence/raw/ 下的文件，并保留来源/步骤对应；已完成的目标操作、必要恢复与声明为完成的子项均须有相应真实引用，元数据/AI 摘要不能冒充原文。
expected_results:
  通过: 必测及已触发条件项完成，既定阈值、拒绝和恢复有效，应共享额度未因已测变体突破；依据本项默认安全基线及真实观察判定，范围限于本轮已完整核查内容；或完成攻击面核查确认无适用入口/未使用对应机制，记录“通过（攻击面不适用）”的理由和原文，不声称该机制的防护已验证
  失败: 有效计数窗口中实测突破既定阈值或共享额度，或恢复行为违反策略；不需要另行用户策略文档才能确认违反本项默认安全基线
  中断: 仅在未证实失败且实际工具/执行环境故障经修正或等效工具重试仍阻止必要验证时中断，记录失败调用、原文及补救；缺策略文档、目标没有该功能、未提供可选凭据或首次采集不足不是中断理由。未知仍须继续核查，不得凭空判通过/失败
