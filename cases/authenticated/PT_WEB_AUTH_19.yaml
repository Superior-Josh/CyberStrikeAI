---
category: 业务逻辑
id: PT_WEB_AUTH_19
name: API 限流与绕过
description: 用 http-framework-test 与 execute-python-script 按明确额度、维度和窗口检查 API 限流及有限绕过变体。
level: 中
group: authenticated
required: 实际 API 的阈值限制、应共享额度的变体与跨窗口恢复
conditional: UA/测试 Token 等标识变体仅按已确认计数维度选择；来源伪造/代理切换须额外授权
steps:
  - 执行准备：项目 AI 完整读取 PT_WEB_AUTH_19 与共同/分组要求，在当前对话列出必测子项和触发依据；核对授权、正常对照、实际工具 schema 与原文输出方式，复用指导工具返回的本次目录，不要求用户运行命令或填写结果
  - 从用户或获准 API 策略取得额度、维度、窗口及恢复规则，登记总量/并发/副作用授权和停止条件
  - 用 http-framework-test 建立正常请求，execute-python-script 用 urllib.request/concurrent.futures 在批准范围验证阈值
  - 同窗口测试应共享额度的批准标识变体，核对拒绝效果与实际业务状态，达到停止条件停止提交
  - 跨窗口观察恢复，按实际计数汇总，正常新身份或新窗口额度不当绕过
  - 判定与保存：项目 AI 逐子项对照本项 expected_results，关联实际操作、观察及 minimum_evidence 所需的真实文件；按共同要求保留失败和覆盖缺口，调用重写后的指导工具 save 保存 PT_WEB_AUTH_19，核对返回路径与成功状态；保存错误先修正，不把计划或预览写成已完成原文
minimum_evidence: 限流策略、正常/阈值/共享变体响应、请求计数/窗口时间及恢复引用。 项目 AI 在实际调用中取得上述原文，保存或引用本次 evidence/raw/ 下的文件，并保留来源/步骤对应；已完成的目标操作、必要恢复与声明为完成的子项均须有相应真实引用，元数据/AI 摘要不能冒充原文。
expected_results:
  通过: 必测及已触发条件项完成，既定阈值、拒绝和恢复有效，应共享额度未因已测变体突破
  失败: 有效计数窗口中实测突破既定阈值或共享额度，或恢复行为违反策略
  中断: 未确认失败，但缺额度/维度/窗口、达到阈值的授权量或必要状态/恢复观察。
