category: 注入
id: PT_WEB_AUTH_14
name: 文件上传漏洞
description: 用 execute-python-script 构造合法与变体上传样例，http-framework-test 核对类型验证、访问权限和执行隔离。
level: 严重
group: authenticated
required: 目标范围与攻击面实际核查；存在适用入口时完成：合法上传、约定规则变体及实际存储/访问/执行边界
conditional: （本共同要求优先：可选机制不存在时完成攻击面核查并停止以下仅适用分支；此后的策略/规则取本项默认基线和实际网络观察，不向用户索要未必存在的文档）大小边界按授权上限；执行隔离仅用批准无害样例，只验证实际网络访问/执行边界，不读取目录权限配置，不上传持久化后门
steps:
  - 执行准备：项目 AI 完整读取 PT_WEB_AUTH_14 与共同/分组要求，在当前对话列出必测子项和触发依据；核对授权、正常对照、实际工具 schema 与原文输出方式，复用指导工具返回的本次目录，不要求用户运行命令或填写结果
  - 默认安全基线：上传不得令非可信内容获得服务端执行能力、越界路径或覆盖其他对象；合法类型和大小依真实表单及网络响应。执行：发现上传规则、实际存储与访问方式，构造正常样例及带唯一无害执行标记变体，登记实际可用删除/恢复方法；没有获准的网络删除/恢复接口时不执行需要清理的上传变更，记录限制，不转用本机文件操作
  - 攻击面核查：读取本轮匿名及认证资源清单、链接/表单/脚本/实际网络记录，探测与本项相关的同源候选入口并对照正常页和随机不存在路径；通过真实授权网络请求补充入口与行为证据。记录实际覆盖和每个候选的结果，不以单个404、登录页、工具无告警、语言指纹或DVWA惯例证明不存在。确认不使用对应机制后停止不适用攻击步骤，将攻击面核查作为must_complete=true的实际验证子项；无法确认时继续补查，只有环境阻塞才中断
  - 用 execute-python-script 构造正常与扩展名/MIME/文件名等单因素变体及 multipart 请求体
  - 用 http-framework-test 以 data=@请求体和匹配 boundary 提交，核对真实内容、存储位置和访问身份
  - 项目 AI 用现有工具验证批准的执行、访问及覆盖边界，记录真实文件内容和消费者行为，区分下载、客户端主动内容与服务端执行；验证结束后调用删除接口并再次读取状态，不能把删除响应成功直接写成样例已移除
  - 判定与保存：项目 AI 逐子项对照本项 expected_results，关联实际操作、观察及 minimum_evidence 所需的真实文件；按共同要求保留失败和覆盖缺口，调用banma_pentest_run_cases save 保存 PT_WEB_AUTH_14，核对返回路径与成功状态；保存错误先修正，不把计划或预览写成已完成原文
minimum_evidence: 本项默认基线引用、实际目标与入口核查清单、已探测候选及正常/不存在路径对照原文；上传规则、样例/请求体、正常/变体响应、存储/权限/执行效果及删除引用。 项目 AI 在实际调用中取得上述原文，保存或引用本次 evidence/raw/ 下的文件，并保留来源/步骤对应；已完成的目标操作、必要恢复与声明为完成的子项均须有相应真实引用，元数据/AI 摘要不能冒充原文。
expected_results:
  通过: 必测及已触发条件项完成，正常上传有效，规则变体受限制且无非预期执行、覆盖或越权，适用执行/权限边界有证据；依据本项默认安全基线及真实观察判定，范围限于本轮已完整核查内容；或完成攻击面核查确认无适用入口/未使用对应机制，记录“通过（攻击面不适用）”的理由和原文，不声称该机制的防护已验证
  失败: 上传实测违反规则并造成禁止存储、执行、覆盖或越权访问；不需要另行用户策略文档才能确认违反本项默认安全基线
  中断: 仅在未证实失败且实际工具/执行环境故障经修正或等效工具重试仍阻止必要验证时中断，记录失败调用、原文及补救；缺策略文档、目标没有该功能、未提供可选凭据或首次采集不足不是中断理由。未知仍须继续核查，不得凭空判通过/失败
