---
category: 注入
id: PT_WEB_AUTH_14
name: 文件上传漏洞
description: 用 execute-python-script 构造合法与变体上传样例，http-framework-test 核对类型验证、访问权限和执行隔离。
level: 严重
group: authenticated
required: 合法上传、约定规则变体及实际存储/访问/执行边界
conditional: 大小边界按授权上限；执行隔离仅用批准无害样例，目录权限仅依据获准配置，不上传持久化后门
steps:
  - 执行准备：项目 AI 完整读取 PT_WEB_AUTH_14 与共同/分组要求，在当前对话列出必测子项和触发依据；核对授权、正常对照、实际工具 schema 与原文输出方式，复用指导工具返回的本次目录，不要求用户运行命令或填写结果
  - 取得用户或获准上传规则、专用账号与删除方式，登记类型/大小/访问/执行要求及可恢复对象
  - 用 execute-python-script 构造正常与扩展名/MIME/文件名等单因素变体及 multipart 请求体
  - 用 http-framework-test 以 data=@请求体和匹配 boundary 提交，核对真实内容、存储位置和访问身份
  - 项目 AI 用现有工具验证批准的执行、访问及覆盖边界，记录真实文件内容和消费者行为，区分下载、客户端主动内容与服务端执行；验证结束后调用删除接口并再次读取状态，不能把删除响应成功直接写成样例已移除
  - 判定与保存：项目 AI 逐子项对照本项 expected_results，关联实际操作、观察及 minimum_evidence 所需的真实文件；按共同要求保留失败和覆盖缺口，调用重写后的指导工具 save 保存 PT_WEB_AUTH_14，核对返回路径与成功状态；保存错误先修正，不把计划或预览写成已完成原文
minimum_evidence: 上传规则、样例/请求体、正常/变体响应、存储/权限/执行效果及删除引用。 项目 AI 在实际调用中取得上述原文，保存或引用本次 evidence/raw/ 下的文件，并保留来源/步骤对应；已完成的目标操作、必要恢复与声明为完成的子项均须有相应真实引用，元数据/AI 摘要不能冒充原文。
expected_results:
  通过: 必测及已触发条件项完成，正常上传有效，规则变体受限制且无非预期执行、覆盖或越权，适用执行/权限边界有证据
  失败: 上传实测违反规则并造成禁止存储、执行、覆盖或越权访问
  中断: 未确认失败，但缺写授权、正常上传、真实存储/访问或约定执行边界证据；命名可用安全等效实现。
