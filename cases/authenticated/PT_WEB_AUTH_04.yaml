---
category: 会话安全
id: PT_WEB_AUTH_04
name: CSRF 跨站请求伪造
description: 用 http-framework-test 与必要的 execute-python-script 浏览器验证，检查实际认证机制下跨站请求是否可造成非预期状态变化。
level: 高
group: authenticated
required: 正常状态变更、实际认证携带机制及跨站请求效果
conditional: Token/Origin/Referer/SameSite 按真实机制选取；浏览器可发送性及 Cookie 携带不能由 CLI 伪造替代
steps:
  - 执行准备：项目 AI 完整读取 PT_WEB_AUTH_04 与共同/分组要求，在当前对话列出必测子项和触发依据；核对授权、正常对照、实际工具 schema 与原文输出方式，复用指导工具返回的本次目录，不要求用户运行命令或填写结果
  - 确认专用可恢复对象及写授权，用 http-framework-test 完成正常操作，登记自动认证携带与适用 CSRF 机制
  - 逐次独立改变缺失/错误 Token 或非可信来源，保持其他业务前提有效，保存响应
  - 项目 AI 经 execute-python-script 驱动已有浏览器，在批准来源上实际构造跨站请求并记录请求类型、Cookie 是否自动携带、浏览器拒绝/发送及状态效果；命令行伪造 Origin、Token 错误或 CORS 报错不能单独证明 CSRF 攻击成功或被阻止
  - 用 http-framework-test 读取持久状态，恢复改动并核对结果
  - 判定与保存：项目 AI 逐子项对照本项 expected_results，关联实际操作、观察及 minimum_evidence 所需的真实文件；按共同要求保留失败和覆盖缺口，调用重写后的指导工具 save 保存 PT_WEB_AUTH_04，核对返回路径与成功状态；保存错误先修正，不把计划或预览写成已完成原文
minimum_evidence: 正常操作、机制依据、变体请求/响应、实际浏览器发送/阻止与 Cookie 携带观察、持久状态及恢复引用。 项目 AI 在实际调用中取得上述原文，保存或引用本次 evidence/raw/ 下的文件，并保留来源/步骤对应；已完成的目标操作、必要恢复与声明为完成的子项均须有相应真实引用，元数据/AI 摘要不能冒充原文。
expected_results:
  通过: 必测及已触发条件项完成，浏览器可构造的非可信请求不能借身份完成禁止状态变更，有效机制可替代 Token，不限定 403/SameSite 值
  失败: 具有浏览器可发送性与身份携带依据的跨站请求实际完成禁止状态变更
  中断: 未确认失败，但缺写授权、正常操作、状态对照或关键跨站请求证据；仅 CLI 成功不等同 CSRF。
