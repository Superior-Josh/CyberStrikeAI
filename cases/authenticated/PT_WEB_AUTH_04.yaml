---
category: 会话安全
id: PT_WEB_AUTH_04
name: CSRF 跨站请求伪造
description: 用 http-framework-test 与必要的 execute-python-script 浏览器验证，检查实际认证机制下跨站请求是否可造成非预期状态变化。
level: 高
group: authenticated
required: 目标范围与攻击面实际核查；存在适用入口时完成：正常状态变更、实际认证携带机制及跨站请求效果
conditional: （本共同要求优先：可选机制不存在时完成攻击面核查并停止以下仅适用分支；此后的策略/规则取本项默认基线和实际实现，不向用户索要未必存在的文档）Token/Origin/Referer/SameSite 按真实机制选取；浏览器可发送性及 Cookie 携带不能由 CLI 伪造替代
steps:
  - 执行准备：项目 AI 完整读取 PT_WEB_AUTH_04 与共同/分组要求，在当前对话列出必测子项和触发依据；核对授权、正常对照、实际工具 schema 与原文输出方式，复用指导工具返回的本次目录，不要求用户运行命令或填写结果
  - 默认安全基线：浏览器自动携带身份的敏感状态变更须拒绝非可信跨站请求，需Token或有效等效来源防护。执行：发现实际密码/资料等可恢复变更和自动携带身份方式，选专用对象登记原值及恢复方案；在本机靶机无禁止动作授权下执行必要有限变更，不因未单列写授权自动跳过
  - 攻击面核查：读取本轮匿名及认证资源清单、链接/表单/脚本/实际网络记录，探测与本项相关的同源候选入口并对照正常页和随机不存在路径；必要时读取获准本机靶机路由/实现补证。记录实际覆盖和每个候选的结果，不以单个404、登录页、工具无告警、语言指纹或DVWA惯例证明不存在。确认不使用对应机制后停止不适用攻击步骤，将攻击面核查作为must_complete=true的实际验证子项；无法确认时继续补查，只有环境阻塞才中断
  - 逐次独立改变缺失/错误 Token 或非可信来源，保持其他业务前提有效，保存响应
  - 项目 AI 经 execute-python-script 驱动已有浏览器，在批准来源上实际构造跨站请求并记录请求类型、Cookie 是否自动携带、浏览器拒绝/发送及状态效果；命令行伪造 Origin、Token 错误或 CORS 报错不能单独证明 CSRF 攻击成功或被阻止
  - 用 http-framework-test 读取持久状态，恢复改动并核对结果
  - 判定与保存：项目 AI 逐子项对照本项 expected_results，关联实际操作、观察及 minimum_evidence 所需的真实文件；按共同要求保留失败和覆盖缺口，调用banma_pentest_run_cases save 保存 PT_WEB_AUTH_04，核对返回路径与成功状态；保存错误先修正，不把计划或预览写成已完成原文
minimum_evidence: 本项默认基线引用、实际目标与入口核查清单、已探测候选及正常/不存在路径对照原文；正常操作、机制依据、变体请求/响应、实际浏览器发送/阻止与 Cookie 携带观察、持久状态及恢复引用。 项目 AI 在实际调用中取得上述原文，保存或引用本次 evidence/raw/ 下的文件，并保留来源/步骤对应；已完成的目标操作、必要恢复与声明为完成的子项均须有相应真实引用，元数据/AI 摘要不能冒充原文。
expected_results:
  通过: 必测及已触发条件项完成，浏览器可构造的非可信请求不能借身份完成禁止状态变更，有效机制可替代 Token，不限定 403/SameSite 值；依据本项默认安全基线及真实观察判定，范围限于本轮已完整核查内容；或完成攻击面核查确认无适用入口/未使用对应机制，记录“通过（攻击面不适用）”的理由和原文，不声称该机制的防护已验证
  失败: 具有浏览器可发送性与身份携带依据的跨站请求实际完成禁止状态变更；不需要另行用户策略文档才能确认违反本项默认安全基线
  中断: 仅在未证实失败且实际工具/执行环境故障经修正或等效工具重试仍阻止必要验证时中断，记录失败调用、原文及补救；缺策略文档、目标没有该功能、未提供可选凭据或首次采集不足不是中断理由。未知仍须继续核查，不得凭空判通过/失败
