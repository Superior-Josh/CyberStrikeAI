---
category: 会话安全
id: PT_WEB_AUTH_06
name: 会话固定攻击
description: 用 http-framework-test 与 execute-python-script 在独立会话中检查攻击者已知的预登录会话能否被登录者采用并继承登录后权限。
level: 高
group: authenticated
required: 目标范围与攻击面实际核查；存在适用入口时完成：预登录会话采用、真实登录及攻击者已知会话重放
conditional: （本共同要求优先：可选机制不存在时完成攻击面核查并停止以下仅适用分支；此后的策略/规则取本项默认基线和实际实现，不向用户索要未必存在的文档）无预登录会话的 Token 架构须以流程/实现证据确认无需继承匿名认证状态；结论不包含权限提升
steps:
  - 执行准备：项目 AI 完整读取 PT_WEB_AUTH_06 与共同/分组要求，在当前对话列出必测子项和触发依据；核对授权、正常对照、实际工具 schema 与原文输出方式，复用指导工具返回的本次目录，不要求用户运行命令或填写结果
  - 默认安全基线：攻击者已知预登录会话不得继承受害者登录权限；不轮换本身不是失败。执行：以两个隔离客户端取得匿名会话并正常登录；保持旧凭据与新凭据独立，按后续步骤核对受保护资源权限
  - 覆盖核查：基于本项默认安全基线与实际目标入口完成必测，不以缺外部策略资料停止；必要时读取获准本机靶机实现补充对照，发现任一确证失败保留失败，其余覆盖继续记录
  - 攻击者取得匿名会话，仅在专用测试客户端交给登录者，核对服务端是否采用该会话及正常登录结果
  - 取得登录后会话，由攻击者仅携带原已知会话访问受保护资源，对照新会话和未登录请求，不混入新 Cookie/Token
  - execute-python-script 比较签发/绑定与实际身份，记录已知会话拒绝、匿名或继承权限结果，清理本轮会话
  - 判定与保存：项目 AI 逐子项对照本项 expected_results，关联实际操作、观察及 minimum_evidence 所需的真实文件；按共同要求保留失败和覆盖缺口，调用banma_pentest_run_cases save 保存 PT_WEB_AUTH_06，核对返回路径与成功状态；保存错误先修正，不把计划或预览写成已完成原文
minimum_evidence: 本项默认基线引用、实际目标与入口核查清单、已探测候选及正常/不存在路径对照原文；会话机制、隔离客户端与会话引用、采用/登录响应、旧/新/匿名权限对照引用。 项目 AI 在实际调用中取得上述原文，保存或引用本次 evidence/raw/ 下的文件，并保留来源/步骤对应；已完成的目标操作、必要恢复与声明为完成的子项均须有相应真实引用，元数据/AI 摘要不能冒充原文。
expected_results:
  通过: 必测及已触发条件项完成，登录有效，攻击者已知预登录会话不能继承受保护权限，或充分机制证据证明不采用该认证路径；依据本项默认安全基线及真实观察判定，范围限于本轮已完整核查内容
  失败: 登录者认证后攻击者凭原已知会话实测取得其受保护权限；不需要另行用户策略文档才能确认违反本项默认安全基线
  中断: 仅在未证实失败且实际工具/执行环境故障经修正或等效工具重试仍阻止必要验证时中断，记录失败调用、原文及补救；缺策略文档、目标没有该功能、未提供可选凭据或首次采集不足不是中断理由。未知仍须继续核查，不得凭空判通过/失败
