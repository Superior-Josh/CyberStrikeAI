---
category: 会话安全
id: PT_WEB_AUTH_06
name: 会话固定攻击
description: 用 http-framework-test 与 execute-python-script 在独立会话中检查攻击者已知的预登录会话能否被登录者采用并继承登录后权限。
level: 高
group: authenticated
required: 预登录会话采用、真实登录及攻击者已知会话重放
conditional: 无预登录会话的 Token 架构须以流程/实现证据确认无需继承匿名认证状态；结论不包含权限提升
steps:
  - 执行准备：项目 AI 完整读取 PT_WEB_AUTH_06 与共同/分组要求，在当前对话列出必测子项和触发依据；核对授权、正常对照、实际工具 schema 与原文输出方式，复用指导工具返回的本次目录，不要求用户运行命令或填写结果
  - 用 http-framework-test 确认会话机制，建立隔离的攻击者/登录者客户端与正常登录对照
  - 攻击者取得匿名会话，仅在专用测试客户端交给登录者，核对服务端是否采用该会话及正常登录结果
  - 取得登录后会话，由攻击者仅携带原已知会话访问受保护资源，对照新会话和未登录请求，不混入新 Cookie/Token
  - execute-python-script 比较签发/绑定与实际身份，记录已知会话拒绝、匿名或继承权限结果，清理本轮会话
  - 判定与保存：项目 AI 逐子项对照本项 expected_results，关联实际操作、观察及 minimum_evidence 所需的真实文件；按共同要求保留失败和覆盖缺口，调用重写后的指导工具 save 保存 PT_WEB_AUTH_06，核对返回路径与成功状态；保存错误先修正，不把计划或预览写成已完成原文
minimum_evidence: 会话机制、隔离客户端与会话引用、采用/登录响应、旧/新/匿名权限对照引用。 项目 AI 在实际调用中取得上述原文，保存或引用本次 evidence/raw/ 下的文件，并保留来源/步骤对应；已完成的目标操作、必要恢复与声明为完成的子项均须有相应真实引用，元数据/AI 摘要不能冒充原文。
expected_results:
  通过: 必测及已触发条件项完成，登录有效，攻击者已知预登录会话不能继承受保护权限，或充分机制证据证明不采用该认证路径
  失败: 登录者认证后攻击者凭原已知会话实测取得其受保护权限
  中断: 未确认失败，但缺真实登录、隔离会话、采用/重放对照或适用机制证据；匿名会话可用和无轮换不单独判失败。
