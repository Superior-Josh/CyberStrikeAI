---
category: 业务逻辑
id: PT_WEB_AUTH_18
name: 业务逻辑漏洞（支付/优惠/流程）
description: 用 http-framework-test 与 execute-python-script 按真实业务规则验证金额、数量、优惠次数、归属及状态顺序。
level: 高
group: authenticated
required: 约定业务的正常流程及非法金额/数量/优惠/状态顺序
conditional: 仅测试目标实际具有且已约定的业务子项；付款须单独授权，所有写入使用专用可恢复对象
steps:
  - 执行准备：项目 AI 完整读取 PT_WEB_AUTH_18 与共同/分组要求，在当前对话列出必测子项和触发依据；核对授权、正常对照、实际工具 schema 与原文输出方式，复用指导工具返回的本次目录，不要求用户运行命令或填写结果
  - 从用户或获准业务资料取得计价、合法零金额、数量、优惠次数/归属和状态机规则，登记必测子项与恢复方法
  - 用 http-framework-test 完成正常流程，保存订单、余额、优惠和状态对照
  - 逐因素提交已纳入非法金额、数量、超额优惠、归属或跳步/越序变体，读取持久状态
  - execute-python-script 按规则对照效果，恢复改动并核对，不把合法免费或可重复优惠判失败
  - 判定与保存：项目 AI 逐子项对照本项 expected_results，关联实际操作、观察及 minimum_evidence 所需的真实文件；按共同要求保留失败和覆盖缺口，调用重写后的指导工具 save 保存 PT_WEB_AUTH_18，核对返回路径与成功状态；保存错误先修正，不把计划或预览写成已完成原文
minimum_evidence: 业务规则/子项、正常与变体请求、前后订单/余额/优惠状态及恢复引用。 项目 AI 在实际调用中取得上述原文，保存或引用本次 evidence/raw/ 下的文件，并保留来源/步骤对应；已完成的目标操作、必要恢复与声明为完成的子项均须有相应真实引用，元数据/AI 摘要不能冒充原文。
expected_results:
  通过: 必测及已触发条件项完成，正常流程有效，约定非法输入和顺序不能造成违反规则的持久状态
  失败: 实测违规计价、优惠、归属或流程操作改变业务状态
  中断: 未确认失败，但缺业务规则、正常流程、写授权、专用对象或必要持久状态。
