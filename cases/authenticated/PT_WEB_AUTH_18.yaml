category: 业务逻辑
id: PT_WEB_AUTH_18
name: 业务逻辑漏洞（支付/优惠/流程）
description: 用 http-framework-test 与 execute-python-script 按真实业务规则验证金额、数量、优惠次数、归属及状态顺序。
level: 高
group: authenticated
required: 目标范围与攻击面实际核查；存在适用入口时完成：约定业务的正常流程及非法金额/数量/优惠/状态顺序
conditional: （本共同要求优先：可选机制不存在时完成攻击面核查并停止以下仅适用分支；此后的策略/规则取本项默认基线和实际网络观察，不向用户索要未必存在的文档）仅测试目标实际具有且已约定的业务子项；付款须单独授权，所有写入使用专用可恢复对象
steps:
  - 执行准备：项目 AI 完整读取 PT_WEB_AUTH_18 与共同/分组要求，在当前对话列出必测子项和触发依据；核对授权、正常对照、实际工具 schema 与原文输出方式，复用指导工具返回的本次目录，不要求用户运行命令或填写结果
  - 默认安全基线：金额/数量/优惠归属和业务状态转换须满足实际业务不变量；没有支付/优惠功能时只核查适用范围，不臆造订单。执行：从实际页面及API网络行为发现支付/优惠/流程并取得规则，存在时创建最小可恢复测试对象验证；无业务入口用完成的攻击面核查证据收口
  - 攻击面核查：读取本轮匿名及认证资源清单、链接/表单/脚本/实际网络记录，探测与本项相关的同源候选入口并对照正常页和随机不存在路径；通过真实授权网络请求补充入口与行为证据。记录实际覆盖和每个候选的结果，不以单个404、登录页、工具无告警、语言指纹或DVWA惯例证明不存在。确认不使用对应机制后停止不适用攻击步骤，将攻击面核查作为must_complete=true的实际验证子项；无法确认时继续补查，只有环境阻塞才中断
  - 用 http-framework-test 完成正常流程，保存订单、余额、优惠和状态对照
  - 逐因素提交已纳入非法金额、数量、超额优惠、归属或跳步/越序变体，读取持久状态
  - execute-python-script 按规则对照效果，恢复改动并核对，不把合法免费或可重复优惠判失败
  - 判定与保存：项目 AI 逐子项对照本项 expected_results，关联实际操作、观察及 minimum_evidence 所需的真实文件；按共同要求保留失败和覆盖缺口，调用banma_pentest_run_cases save 保存 PT_WEB_AUTH_18，核对返回路径与成功状态；保存错误先修正，不把计划或预览写成已完成原文
minimum_evidence: 本项默认基线引用、实际目标与入口核查清单、已探测候选及正常/不存在路径对照原文；业务规则/子项、正常与变体请求、前后订单/余额/优惠状态及恢复引用。 项目 AI 在实际调用中取得上述原文，保存或引用本次 evidence/raw/ 下的文件，并保留来源/步骤对应；已完成的目标操作、必要恢复与声明为完成的子项均须有相应真实引用，元数据/AI 摘要不能冒充原文。
expected_results:
  通过: 必测及已触发条件项完成，正常流程有效，约定非法输入和顺序不能造成违反规则的持久状态；依据本项默认安全基线及真实观察判定，范围限于本轮已完整核查内容；或完成攻击面核查确认无适用入口/未使用对应机制，记录“通过（攻击面不适用）”的理由和原文，不声称该机制的防护已验证
  失败: 实测违规计价、优惠、归属或流程操作改变业务状态；不需要另行用户策略文档才能确认违反本项默认安全基线
  中断: 仅在未证实失败且实际工具/执行环境故障经修正或等效工具重试仍阻止必要验证时中断，记录失败调用、原文及补救；缺策略文档、目标没有该功能、未提供可选凭据或首次采集不足不是中断理由。未知仍须继续核查，不得凭空判通过/失败
