---
category: OAuth2/SSO
id: PT_WEB_AUTH_26
name: OAuth2/SSO 集成漏洞
description: 用 http-framework-test 与 execute-python-script 验证 OAuth2/SSO 回调绑定、授权码和 PKCE 或其他适用防护及账号绑定。
level: 高
group: authenticated
required: 有效 OAuth2/SSO 流程、会话/身份绑定、授权码及回调校验
conditional: PKCE 按实际协议适用，OIDC 须复核 nonce；存在账号绑定/改绑时用专用可恢复账号验证
steps:
  - 执行准备：项目 AI 完整读取 PT_WEB_AUTH_26 与共同/分组要求，在当前对话列出必测子项和触发依据；核对授权、正常对照、实际工具 schema 与原文输出方式，复用指导工具返回的本次目录，不要求用户运行命令或填写结果
  - 确认授权 IdP、账号及协议资料，登记 state/nonce/PKCE 适用机制和回调规则；http-framework-test 关闭跳转，execute-python-script 解析参数
  - 项目 AI 用 http-framework-test 或经 execute-python-script 驱动已有浏览器完成真实 IdP 流程，各 state/会话变体使用独立新流程与新授权码；消费码重放单独测试，不伪造码，不要求用户手工执行回调或交换授权码
  - 适用 PKCE 时由项目 AI 在实际承担码交换的客户端/IdP 边界对照正确、错误、缺失 verifier 及降级；Web 客户端后端持有 verifier 时不能仅修改浏览器回调来声称已验证，OIDC 核对 nonce 与真实身份，其他前提保持有效
  - 测试批准回调变体；存在绑定/改绑时核对重新认证及实际身份并恢复，不禁止合法多账号映射
  - 逐机制对照会话、码使用与最终身份，交互 IdP 无可用正常流程时记录缺口
  - 判定与保存：项目 AI 逐子项对照本项 expected_results，关联实际操作、观察及 minimum_evidence 所需的真实文件；按共同要求保留失败和覆盖缺口，调用重写后的指导工具 save 保存 PT_WEB_AUTH_26，核对返回路径与成功状态；保存错误先修正，不把计划或预览写成已完成原文
minimum_evidence: 协议/机制依据、正常与独立变体流程引用、授权码消费/重放、回调/身份及适用恢复证据。 项目 AI 在实际调用中取得上述原文，保存或引用本次 evidence/raw/ 下的文件，并保留来源/步骤对应；已完成的目标操作、必要恢复与声明为完成的子项均须有相应真实引用，元数据/AI 摘要不能冒充原文。
expected_results:
  通过: 必测及已触发条件项完成，适用机制有效约束会话和身份，授权码一次性且受客户端/回调等约束，绑定权限符合业务规则
  失败: 有效流程中实测请求伪造、串号、码重用、违规回调或未经授权绑定
  中断: 未确认失败，但缺正常 IdP 流程、适用机制依据、新码或必要身份/绑定对照。必要 PKCE 码交换边界不可观察时不能用回调参数检查代替。
