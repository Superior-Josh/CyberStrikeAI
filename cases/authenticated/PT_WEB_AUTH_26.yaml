---
category: OAuth2/SSO
id: PT_WEB_AUTH_26
name: OAuth2/SSO 集成漏洞
description: 用 http-framework-test 与 execute-python-script 验证 OAuth2/SSO 回调绑定、授权码和 PKCE 或其他适用防护及账号绑定。
level: 高
group: authenticated
required: 目标范围与攻击面实际核查；存在适用入口时完成：有效 OAuth2/SSO 流程、会话/身份绑定、授权码及回调校验
conditional: （本共同要求优先：可选机制不存在时完成攻击面核查并停止以下仅适用分支；此后的策略/规则取本项默认基线和实际实现，不向用户索要未必存在的文档）PKCE 按实际协议适用，OIDC 须复核 nonce；存在账号绑定/改绑时用专用可恢复账号验证
steps:
  - 执行准备：项目 AI 完整读取 PT_WEB_AUTH_26 与共同/分组要求，在当前对话列出必测子项和触发依据；核对授权、正常对照、实际工具 schema 与原文输出方式，复用指导工具返回的本次目录，不要求用户运行命令或填写结果
  - 默认安全基线：OAuth2/SSO须保持回调、state及适用nonce/PKCE绑定和授权码一次性；本地账密会话不自动要求SSO。执行：从真实登录入口、网络及获准本地认证路由核查OAuth2/SSO；存在时取得真实流程与适用机制并测试，不造授权码；不存在须有认证机制核查原文
  - 攻击面核查：读取本轮匿名及认证资源清单、链接/表单/脚本/实际网络记录，探测与本项相关的同源候选入口并对照正常页和随机不存在路径；必要时读取获准本机靶机路由/实现补证。记录实际覆盖和每个候选的结果，不以单个404、登录页、工具无告警、语言指纹或DVWA惯例证明不存在。确认不使用对应机制后停止不适用攻击步骤，将攻击面核查作为must_complete=true的实际验证子项；无法确认时继续补查，只有环境阻塞才中断
  - 项目 AI 用 http-framework-test 或经 execute-python-script 驱动已有浏览器完成真实 IdP 流程，各 state/会话变体使用独立新流程与新授权码；消费码重放单独测试，不伪造码，不要求用户手工执行回调或交换授权码
  - 适用 PKCE 时由项目 AI 在实际承担码交换的客户端/IdP 边界对照正确、错误、缺失 verifier 及降级；Web 客户端后端持有 verifier 时不能仅修改浏览器回调来声称已验证，OIDC 核对 nonce 与真实身份，其他前提保持有效
  - 测试批准回调变体；存在绑定/改绑时核对重新认证及实际身份并恢复，不禁止合法多账号映射
  - 逐机制对照会话、码使用与最终身份，交互 IdP 无可用正常流程时记录缺口
  - 判定与保存：项目 AI 逐子项对照本项 expected_results，关联实际操作、观察及 minimum_evidence 所需的真实文件；按共同要求保留失败和覆盖缺口，调用banma_pentest_run_cases save 保存 PT_WEB_AUTH_26，核对返回路径与成功状态；保存错误先修正，不把计划或预览写成已完成原文
minimum_evidence: 本项默认基线引用、实际目标与入口核查清单、已探测候选及正常/不存在路径对照原文；协议/机制依据、正常与独立变体流程引用、授权码消费/重放、回调/身份及适用恢复证据。 项目 AI 在实际调用中取得上述原文，保存或引用本次 evidence/raw/ 下的文件，并保留来源/步骤对应；已完成的目标操作、必要恢复与声明为完成的子项均须有相应真实引用，元数据/AI 摘要不能冒充原文。
expected_results:
  通过: 必测及已触发条件项完成，适用机制有效约束会话和身份，授权码一次性且受客户端/回调等约束，绑定权限符合业务规则；依据本项默认安全基线及真实观察判定，范围限于本轮已完整核查内容；或完成攻击面核查确认无适用入口/未使用对应机制，记录“通过（攻击面不适用）”的理由和原文，不声称该机制的防护已验证
  失败: 有效流程中实测请求伪造、串号、码重用、违规回调或未经授权绑定；不需要另行用户策略文档才能确认违反本项默认安全基线
  中断: 仅在未证实失败且实际工具/执行环境故障经修正或等效工具重试仍阻止必要验证时中断，记录失败调用、原文及补救；缺策略文档、目标没有该功能、未提供可选凭据或首次采集不足不是中断理由。未知仍须继续核查，不得凭空判通过/失败
