---
category: 权限控制
id: PT_WEB_AUTH_01
name: 越权访问（水平越权）
description: 用 http-framework-test 与有限 ffuf 探测在两个资源归属已确认的账号之间验证读取及获准操作的水平权限。
level: 高
group: authenticated
required: 两个独立账号的资源归属、正常读取及双向资源 ID 交换
conditional: 写操作仅在专用可恢复对象和写授权具备时纳入；ffuf 仅辅助批准 ID 发现
steps:
  - 执行准备：项目 AI 完整读取 PT_WEB_AUTH_01 与共同/分组要求，在当前对话列出必测子项和触发依据；核对授权、正常对照、实际工具 schema 与原文输出方式，复用指导工具返回的本次目录，不要求用户运行命令或填写结果
  - 从用户或获准业务资料确认资源所有权与共享规则，登记必测读取/获准操作及两个账号角色
  - 用 http-framework-test 验证 A/B 对本人资源的正常访问，保存资源与会话身份对照
  - 保持请求者会话仅替换另一账号资源 ID，双向测试并核对实际数据；获准写操作读取持久状态
  - execute-python-script 整理访问与操作差异，恢复获准改动并核对结果
  - 判定与保存：项目 AI 逐子项对照本项 expected_results，关联实际操作、观察及 minimum_evidence 所需的真实文件；按共同要求保留失败和覆盖缺口，调用重写后的指导工具 save 保存 PT_WEB_AUTH_01，核对返回路径与成功状态；保存错误先修正，不把计划或预览写成已完成原文
minimum_evidence: 账号/归属/共享依据、本人正常及跨账号响应、适用状态与恢复引用。 项目 AI 在实际调用中取得上述原文，保存或引用本次 evidence/raw/ 下的文件，并保留来源/步骤对应；已完成的目标操作、必要恢复与声明为完成的子项均须有相应真实引用，元数据/AI 摘要不能冒充原文。
expected_results:
  通过: 必测及已触发条件项完成，正常对照有效，跨账号不能取得共享规则禁止的数据或完成禁止操作，不限定拒绝状态码
  失败: 有效对照下实际取得禁止数据或完成禁止操作
  中断: 未确认失败，但缺独立账号、明确归属、正常对照或必要状态证据；未获授权的写操作不纳入结论。
