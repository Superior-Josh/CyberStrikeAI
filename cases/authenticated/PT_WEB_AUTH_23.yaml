---
category: 数据安全
id: PT_WEB_AUTH_23
name: 缓存敏感数据检测
description: 用 http-framework-test 与 execute-python-script 分别验证敏感响应缓存策略、共享缓存隔离及登出后重新获取。
level: 中
group: authenticated
required: 敏感响应缓存策略、共享缓存身份隔离及登出后重新获取
conditional: 存在浏览器缓存时须经已有浏览器观察；没有共享缓存路径需实际部署依据，不以无命中排除
steps:
  - 执行准备：项目 AI 完整读取 PT_WEB_AUTH_23 与共同/分组要求，在当前对话列出必测子项和触发依据；核对授权、正常对照、实际工具 schema 与原文输出方式，复用指导工具返回的本次目录，不要求用户运行命令或填写结果
  - 从用户或获准缓存资料取得敏感响应基线及缓存层，登记 URL、账号和本地缓存观察范围
  - 用 http-framework-test 保存 Cache-Control、Age、X-Cache、Via、Vary，同 URL 作账号及匿名对照，区分命中与新响应
  - 项目 AI 用 http-framework-test 真实登出后以旧凭证发起新的受保护请求，核对数据是否重新获取；已纳入浏览器缓存部分由 execute-python-script 驱动已有浏览器，区分网络新响应、本地缓存及已有页面副本
  - execute-python-script 分别整理策略、共享缓存、登出和浏览器证据，不要求撤回合法取得的副本
  - 判定与保存：项目 AI 逐子项对照本项 expected_results，关联实际操作、观察及 minimum_evidence 所需的真实文件；按共同要求保留失败和覆盖缺口，调用重写后的指导工具 save 保存 PT_WEB_AUTH_23，核对返回路径与成功状态；保存错误先修正，不把计划或预览写成已完成原文
minimum_evidence: 缓存基线/部署依据、响应头及身份内容对照、登出重放和适用浏览器观察引用。 项目 AI 在实际调用中取得上述原文，保存或引用本次 evidence/raw/ 下的文件，并保留来源/步骤对应；已完成的目标操作、必要恢复与声明为完成的子项均须有相应真实引用，元数据/AI 摘要不能冒充原文。
expected_results:
  通过: 必测及已触发条件项完成，敏感响应符合基线，共享缓存不串号，登出凭证不能重新获取数据，适用浏览器缓存符合规则
  失败: 敏感缓存违反明确基线、跨身份泄露，或登出后旧凭证实际重新获取受保护数据
  中断: 未确认失败，但缺缓存策略/层次、必要身份/命中依据或已触发浏览器观察。
