category: 数据安全
id: PT_WEB_AUTH_23
name: 缓存敏感数据检测
description: 用 http-framework-test 与 execute-python-script 分别验证敏感响应缓存策略、共享缓存隔离及登出后重新获取。
level: 中
group: authenticated
required: 目标范围与攻击面实际核查；存在适用入口时完成：敏感响应缓存策略、共享缓存身份隔离及登出后重新获取
conditional: （本共同要求优先：可选机制不存在时完成攻击面核查并停止以下仅适用分支；此后的策略/规则取本项默认基线和实际网络观察，不向用户索要未必存在的文档）存在浏览器缓存时须经已有浏览器观察；没有共享缓存路径需实际部署依据，不以无命中排除
steps:
  - 默认安全基线：认证敏感响应须禁止共享缓存泄露，登出后不得通过新网络请求获取受保护内容；合法既有页面副本不算失败。执行：从实际敏感响应与部署观察确定缓存层，核对私有/no-store等实际有效控制；无共享缓存层经核查不适用，仍完成客户端策略与登出重取检查
  - 覆盖核查：基于本项默认安全基线与实际目标入口完成必测，不以缺外部策略资料停止；通过获准网络接口取得正常/变体响应补充对照，发现任一确证失败保留失败，其余覆盖继续记录
  - 用 http-framework-test 保存 Cache-Control、Age、X-Cache、Via、Vary，同 URL 作账号及匿名对照，区分命中与新响应
  - 代码或Eino 用 http-framework-test 真实登出后以旧凭证发起新的受保护请求，核对数据是否重新获取；已纳入浏览器缓存部分由 execute-python-script 驱动已有浏览器，区分网络新响应、本地缓存及已有页面副本
  - execute-python-script 分别整理策略、共享缓存、登出和浏览器证据，不要求撤回合法取得的副本
minimum_evidence: 本项默认基线引用、实际目标与入口核查清单、已探测候选及正常/不存在路径对照原文；缓存基线/部署依据、响应头及身份内容对照、登出重放和适用浏览器观察引用。 原文在实际操作中取得并自动关联本轮执行、步骤及子项；必要操作和恢复均保留真实来源，元数据或模型解释不能冒充原文。
expected_results:
  通过: 必测及已触发条件项完成，敏感响应符合基线，共享缓存不串号，登出凭证不能重新获取数据，适用浏览器缓存符合规则；依据本项默认安全基线及真实观察判定，范围限于本轮已完整核查内容
  失败: 敏感缓存违反明确基线、跨身份泄露，或登出后旧凭证实际重新获取受保护数据；不需要另行用户策略文档才能确认违反本项默认安全基线
  中断: 仅在未证实失败且实际工具/执行环境故障经修正或等效工具重试仍阻止必要验证时中断，记录失败调用、原文及补救；缺策略文档、目标没有该功能、未提供可选凭据或首次采集不足不是中断理由。未知仍须继续核查，不得凭空判通过/失败
