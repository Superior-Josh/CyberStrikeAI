category: MFA 安全
id: PT_WEB_AUTH_25
name: 多因素认证绕过
description: 用 http-framework-test 与 execute-python-script 验证 MFA 状态、OTP 重用、到期、会话绑定及错误尝试防护。
level: 高
group: authenticated
required: 目标范围与攻击面实际核查；存在适用入口时完成：MFA 正常流程、时效/重用、绑定、错误尝试及跳步权限
conditional: （本共同要求优先：可选机制不存在时完成攻击面核查并停止以下仅适用分支；此后的策略/规则取本项默认基线和实际网络观察，不向用户索要未必存在的文档）按实际 OTP 类型和容许偏差选择样例；账号交换需第二测试账号，恢复码仅专用账号授权使用
steps:
  - 默认安全基线：已实现MFA须保持验证码绑定、一次性/时效、错误控制及跳步权限；未要求且未实现MFA不等于绕过。执行：从真实登录、账号安全页面及实际认证网络流程确认MFA及其绑定/时效规则；无MFA时核查不适用，存在时按真实正常流程验证
  - 攻击面核查：读取本轮匿名及认证资源清单、链接/表单/脚本/实际网络记录，探测与本项相关的同源候选入口并对照正常页和随机不存在路径；通过真实授权网络请求补充入口与行为证据。记录实际覆盖和每个候选的结果，不以单个404、登录页、工具无告警、语言指纹或DVWA惯例证明不存在。确认不使用对应机制后停止不适用攻击步骤，将攻击面核查作为must_complete=true的实际验证子项；无法确认时继续补查，只有环境阻塞才中断
  - 用 http-framework-test 在独立有效流程测试已消费/过期验证码及已纳入账号/流程交换，不误判 TOTP 相邻窗口
  - 代码或Eino 在批准次数内用 http-framework-test 逐次提交错误验证码，出现锁定、挑战或 429 停止；独立流程验证跳步/客户端状态篡改，不在停止后继续试码；如正常 OTP 只能由用户提供则仅询问该秘密事实，不要求用户执行测试
  - 读取受保护资源核对真实权限，execute-python-script 汇总时效、次数与状态，清理测试流程
minimum_evidence: 本项默认基线引用、实际目标与入口核查清单、已探测候选及正常/不存在路径对照原文；MFA 策略、正常/重用/过期/绑定及错误请求引用、次数时间与跳步权限响应。 原文在实际操作中取得并自动关联本轮执行、步骤及子项；必要操作和恢复均保留真实来源，元数据或模型解释不能冒充原文。
expected_results:
  通过: 必测及已触发条件项完成，按类型和窗口拒绝已消费/过期及错误绑定，错误控制有效，未完成 MFA 不能取得受保护权限；依据本项默认安全基线及真实观察判定，范围限于本轮已完整核查内容；或完成攻击面核查确认无适用入口/未使用对应机制，记录“通过（攻击面不适用）”的理由和原文，不声称该机制的防护已验证
  失败: 实测不合规则的 OTP 或跳步获得权限，或错误尝试突破明确策略；不需要另行用户策略文档才能确认违反本项默认安全基线
  中断: 仅在未证实失败且实际工具/执行环境故障经修正或等效工具重试仍阻止必要验证时中断，记录失败调用、原文及补救；缺策略文档、目标没有该功能、未提供可选凭据或首次采集不足不是中断理由。未知仍须继续核查，不得凭空判通过/失败
