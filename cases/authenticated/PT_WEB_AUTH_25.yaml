---
category: MFA 安全
id: PT_WEB_AUTH_25
name: 多因素认证绕过
description: 用 http-framework-test 与 execute-python-script 验证 MFA 状态、OTP 重用、到期、会话绑定及错误尝试防护。
level: 高
group: authenticated
required: MFA 正常流程、时效/重用、绑定、错误尝试及跳步权限
conditional: 按实际 OTP 类型和容许偏差选择样例；账号交换需第二测试账号，恢复码仅专用账号授权使用
steps:
  - 执行准备：项目 AI 完整读取 PT_WEB_AUTH_25 与共同/分组要求，在当前对话列出必测子项和触发依据；核对授权、正常对照、实际工具 schema 与原文输出方式，复用指导工具返回的本次目录，不要求用户运行命令或填写结果
  - 从用户或获准 MFA 资料取得类型、有效窗口、绑定和错误次数策略，登记测试次数/停止条件并完成正常流程
  - 用 http-framework-test 在独立有效流程测试已消费/过期验证码及已纳入账号/流程交换，不误判 TOTP 相邻窗口
  - 项目 AI 在批准次数内用 http-framework-test 逐次提交错误验证码，出现锁定、挑战或 429 停止；独立流程验证跳步/客户端状态篡改，不在停止后继续试码；如正常 OTP 只能由用户提供则仅询问该秘密事实，不要求用户执行测试
  - 读取受保护资源核对真实权限，execute-python-script 汇总时效、次数与状态，清理测试流程
  - 判定与保存：项目 AI 逐子项对照本项 expected_results，关联实际操作、观察及 minimum_evidence 所需的真实文件；按共同要求保留失败和覆盖缺口，调用重写后的指导工具 save 保存 PT_WEB_AUTH_25，核对返回路径与成功状态；保存错误先修正，不把计划或预览写成已完成原文
minimum_evidence: MFA 策略、正常/重用/过期/绑定及错误请求引用、次数时间与跳步权限响应。 项目 AI 在实际调用中取得上述原文，保存或引用本次 evidence/raw/ 下的文件，并保留来源/步骤对应；已完成的目标操作、必要恢复与声明为完成的子项均须有相应真实引用，元数据/AI 摘要不能冒充原文。
expected_results:
  通过: 必测及已触发条件项完成，按类型和窗口拒绝已消费/过期及错误绑定，错误控制有效，未完成 MFA 不能取得受保护权限
  失败: 实测不合规则的 OTP 或跳步获得权限，或错误尝试突破明确策略
  中断: 未确认失败，但缺正常 MFA、时效/绑定/次数依据、必要第二账号或受保护权限对照。
