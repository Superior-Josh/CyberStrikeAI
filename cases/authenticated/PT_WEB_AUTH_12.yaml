category: 注入
id: PT_WEB_AUTH_12
name: 反序列化漏洞
description: 用 http-framework-test、execute-python-script、nuclei 与必要检查模块核对真实反序列化路径及安全边界。
level: 严重
group: authenticated
required: 真实反序列化路径及类型、完整性、来源控制的适用验证
conditional: nuclei 已安装非破坏性模板或行为明确的 metasploit 检查模块仅辅助；实现证据仅在获准可读时使用
steps:
  - 执行准备：项目 AI 完整读取 PT_WEB_AUTH_12 与共同/分组要求，在当前对话列出必测子项和触发依据；核对授权、正常对照、实际工具 schema 与原文输出方式，复用指导工具返回的本次目录，不要求用户运行命令或填写结果
  - 用 http-framework-test 取得正常样例，以实际行为或获准资料确认解析组件、路径及适用控制
  - execute-python-script 只解码外层 base64/压缩并核对结构，不执行不可信反序列化函数
  - 项目 AI 用 http-framework-test 提交已批准且与实际组件适用的无害类型/完整性变体，保持有效认证和其他必要条件，记录可重复行为；仅破坏编码/JSON 语法不构成危险对象处理验证
  - 核对危险对象处理边界，以动态或获准源码/配置证据支持结论，区分编码特征和实际反序列化
  - 判定与保存：项目 AI 逐子项对照本项 expected_results，关联实际操作、观察及 minimum_evidence 所需的真实文件；按共同要求保留失败和覆盖缺口，调用重写后的指导工具 save 保存 PT_WEB_AUTH_12，核对返回路径与成功状态；保存错误先修正，不把计划或预览写成已完成原文
minimum_evidence: 正常样例/组件路径依据、适用控制、变体响应及重复行为或实现引用。 项目 AI 在实际调用中取得上述原文，保存或引用本次 evidence/raw/ 下的文件，并保留来源/步骤对应；已完成的目标操作、必要恢复与声明为完成的子项均须有相应真实引用，元数据/AI 摘要不能冒充原文。
expected_results:
  通过: 必测及已触发条件项完成，约定适用控制有充分证据，已测输入不能触发危险对象的非预期行为
  失败: 证实反序列化危险对象导致非预期行为或违反适用安全边界
  中断: 未确认失败，但缺真实解析路径、必要变体或充分控制证据；编码特征、无报错和未见 RCE 不足。
