name: "pacu"
command: "pacu"
enabled: false
short_description: "AWS渗透测试框架"
description: |
  Pacu是一个AWS渗透测试框架，用于测试AWS环境的安全性。

  **主要功能：**
  - AWS渗透测试
  - 权限提升
  - 数据访问
  - 模块化架构

  **使用场景：**
  - AWS安全测试
  - 渗透测试
  - 权限测试
  - 安全评估
parameters:
  - name: "session_name"
    type: "string"
    description: "Pacu会话名称"
    required: false
    flag: "--session"
    format: "flag"
  - name: "module"
    type: "string"
    description: "单个模块名；实际执行需 additional_args 中的 --exec"
    required: false
    flag: "--module-name"
    format: "flag"
  - name: "module_args"
    type: "string"
    description: "完整模块参数字符串，例如 --regions us-east-1；不是顶层 --regions"
    required: false
    flag: "--module-args"
    format: "flag"
  - name: "additional_args"
    type: "string"
    description: |
      额外的pacu参数。用于传递未在参数列表中定义的pacu选项。

      **示例值：**
      - 根据工具特性添加常用参数示例

      **注意事项：**
      - 多个参数用空格分隔
      - 确保参数格式正确，避免命令注入
      - 此参数会直接追加到命令末尾
    required: false
    format: "positional"
