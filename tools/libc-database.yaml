name: "libc-database"
command: "python3"
args:
  - "-c"
  - |
    import os
    import shlex
    import subprocess
    import sys

    if len(sys.argv) < 2:
        sys.stderr.write("缺少操作类型（find/dump/download）\n")
        sys.exit(1)

    action = sys.argv[1]
    symbols = sys.argv[2] if len(sys.argv) > 2 else ""
    libc_id = sys.argv[3] if len(sys.argv) > 3 else ""
    extra = sys.argv[4] if len(sys.argv) > 4 else ""

    repo_dir = os.path.expanduser(sys.argv[5]) if len(sys.argv) > 5 else os.path.expanduser("~/.cyberstrike/tools/libc-database")
    if action not in {"find", "dump", "download"}:
        sys.stderr.write("不支持的操作，请选择 find/dump/download\n")
        sys.exit(1)
    script_path = os.path.join(repo_dir, action)
    if not os.path.isfile(script_path):
        sys.stderr.write("缺少 libc-database 仓库脚本，请通过 repo_dir 指定已有仓库\n")
        sys.exit(1)
    cmd = [script_path]
    if action in {"dump", "download"}:
        if not libc_id:
            sys.stderr.write("dump/download 需要 libc_id\n")
            sys.exit(1)
        cmd.append(libc_id)
    if symbols:
        for token in shlex.split(symbols):
            cmd.extend(token.split(":", 1) if action == "find" and ":" in token else [token])
    if extra:
        cmd.extend(shlex.split(extra))

    proc = subprocess.run(cmd, capture_output=True, text=True)
    if proc.stdout:
        sys.stdout.write(proc.stdout)
    if proc.stderr:
        sys.stderr.write(proc.stderr)
    sys.exit(proc.returncode)
enabled: true
short_description: "libc识别和偏移查找工具"
description: |
  Libc-database是一个用于libc识别和偏移查找的工具。

  **主要功能：**
  - libc识别
  - 符号偏移查找
  - libc下载
  - 数据库查询

  **使用场景：**
  - CTF挑战
  - 漏洞利用开发
  - libc识别
  - 安全研究
parameters:
  - name: "operation"
    type: "string"
    description: "要执行的操作（find, dump, download）"
    required: true
    position: 0
    format: "positional"
  - name: "symbols"
    type: "string"
    description: "符号和偏移（格式：symbol1:offset1 symbol2:offset2）"
    required: false
    default: ""
    position: 1
    format: "positional"
  - name: "libc_id"
    type: "string"
    description: "Libc ID（用于dump/download操作）"
    required: false
    default: ""
    position: 2
    format: "positional"
  - name: "tool_args"
    type: "string"
    description: "传给包装器的完整扩展参数字符串，保留引号；由包装器按 shell 规则拆分"
    required: false
    default: ""
    position: 3
    format: "positional"
  - name: "repo_dir"
    type: "string"
    description: "已有 libc-database 仓库目录，内含 find/dump/download 脚本"
    required: false
    default: "~/.cyberstrike/tools/libc-database"
    position: 4
    format: "positional"
