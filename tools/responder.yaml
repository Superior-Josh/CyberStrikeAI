name: "responder"
command: "python3"
args:
  - "-c"
  - |
    import shlex
    import subprocess
    import sys

    interface = sys.argv[1] if len(sys.argv) > 1 else "eth0"
    analyze = sys.argv[2].lower() == "true" if len(sys.argv) > 2 else False
    wpad = sys.argv[3].lower() == "true" if len(sys.argv) > 3 else True
    fingerprint = sys.argv[4].lower() == "true" if len(sys.argv) > 4 else False
    duration = int(sys.argv[5]) if len(sys.argv) > 5 and sys.argv[5] else 300
    extra = sys.argv[6] if len(sys.argv) > 6 else ""

    cmd = ["responder", "-I", interface]
    if analyze:
        cmd.append("-A")
    if wpad:
        cmd.append("-w")
    if fingerprint:
        cmd.append("-f")
    if extra:
        cmd.extend(shlex.split(extra))

    proc = subprocess.Popen(cmd)
    try:
        exit_code = proc.wait(timeout=duration if duration > 0 else None)
    except subprocess.TimeoutExpired:
        proc.terminate()
        try:
            exit_code = proc.wait(timeout=10)
        except subprocess.TimeoutExpired:
            proc.kill()
            proc.wait()
            exit_code = 0
        if exit_code == -15:
            exit_code = 0
    except KeyboardInterrupt:
        proc.terminate()
        try:
            proc.wait(timeout=10)
        except subprocess.TimeoutExpired:
            proc.kill()
            proc.wait()
        exit_code = 130
    sys.exit(exit_code if exit_code >= 0 else 128 - exit_code)
enabled: true
short_description: "LLMNR/NBT-NS/MDNS投毒和凭据收集工具"
description: |
  封装 Responder，支持自动在指定持续时间后停止进程，避免占用网络。
  提前退出时保留真实退出码；到达持续时间后由包装器正常终止时返回 0。
parameters:
  - name: "interface"
    type: "string"
    description: "网络接口（-I）"
    required: false
    default: "eth0"
    position: 0
    format: "positional"
  - name: "analyze"
    type: "bool"
    description: "仅分析模式（-A）"
    required: false
    default: false
    position: 1
    format: "positional"
  - name: "wpad"
    type: "bool"
    description: "启用WPAD恶意代理（-w）"
    required: false
    default: true
    position: 2
    format: "positional"
  - name: "fingerprint"
    type: "bool"
    description: "指纹识别模式（-f）"
    required: false
    default: false
    position: 3
    format: "positional"
  - name: "duration"
    type: "int"
    description: "运行持续时间（秒，0表示直到手动停止）"
    required: false
    default: 300
    position: 4
    format: "positional"
  - name: "tool_args"
    type: "string"
    description: "传给包装器的完整扩展参数字符串，保留引号；由包装器按 shell 规则拆分"
    required: false
    default: ""
    position: 5
    format: "positional"
