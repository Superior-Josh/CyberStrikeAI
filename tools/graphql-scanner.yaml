name: "graphql-scanner"
command: "graphqlmap"
enabled: true
short_description: "GraphQL安全扫描和自省工具"
description: |
  调用 GraphQLMap 交互式安全测试工具。当前 CLI 不提供 --introspection、--depth 或 --mutations；自动 HTTP 对照测试使用 http-framework-test 或 exec。

  **主要功能：**
  - GraphQL自省
  - 查询深度测试
  - 突变操作测试
  - 漏洞评估

  **使用场景：**
  - GraphQL安全测试
  - API安全评估
  - 漏洞发现
  - 安全测试
parameters:
  - name: "endpoint"
    type: "string"
    description: "GraphQL端点URL"
    required: true
    flag: "-u"
    format: "flag"
  - name: "additional_args"
    type: "string"
    description: |
      额外的graphql-scanner参数。用于传递未在参数列表中定义的graphql-scanner选项。

      **示例值：**
      - 根据工具特性添加常用参数示例

      **注意事项：**
      - 多个参数用空格分隔
      - 确保参数格式正确，避免命令注入
      - 此参数会直接追加到命令末尾
    required: false
    format: "positional"
  - name: "method"
    type: "string"
    description: "HTTP 方法"
    required: false
    flag: "--method"
    format: "flag"
    default: "POST"
  - name: "headers"
    type: "object"
    description: "请求头字典，由执行器序列化为 JSON"
    required: false
    flag: "--headers"
    format: "flag"
