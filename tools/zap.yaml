name: "zap"
command: "python3"
args:
  - "-c"
  - |
    import shlex
    import subprocess
    import sys

    target, api_key, port, output_format, extra = sys.argv[1:6]
    cmd = ["zap-cli", "--port", port]
    if api_key:
        cmd.extend(["--api-key", api_key])
    cmd.extend(["quick-scan", "--output-format", output_format])
    cmd.extend(shlex.split(extra))
    cmd.append(target)
    sys.exit(subprocess.run(cmd, check=False).returncode)
enabled: false
short_description: "通过已有 ZAP daemon 执行 quick-scan"
description: |
  调用 zap-cli quick-scan；需要已运行的 ZAP daemon，默认不启动或停止 daemon。
  输出格式仅 table/json；扩展参数使用 quick-scan --help 支持的选项。
parameters:
  - name: "target"
    type: "string"
    description: "目标 URL"
    required: true
    position: 0
    format: "positional"
  - name: "api_key"
    type: "string"
    description: "可选 ZAP API 密钥"
    required: false
    position: 1
    format: "positional"
    default: ""
  - name: "port"
    type: "string"
    description: "已有 ZAP daemon 端口"
    required: false
    position: 2
    format: "positional"
    default: "8090"
  - name: "format_type"
    type: "string"
    description: "告警输出格式 table/json"
    required: false
    position: 3
    format: "positional"
    default: "json"
    options: ["table", "json"]
  - name: "tool_args"
    type: "string"
    description: "quick-scan 完整扩展参数字符串"
    required: false
    position: 4
    format: "positional"
    default: ""
